<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFR Nav</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@import url('https://cdnjs.cloudflare.com/ajax/libs/inter-ui/3.19.3/inter.min.css');

:root{
  --bg-0:#0b0d12; --bg-1:#12151c; --bg-2:#181c25; --bg-3:#1f242f;
  --border:#2a3040; --border-soft:#232834;
  --text-0:#e9ecf1; --text-1:#aab1c2; --text-2:#6b7385;
  --accent:#4fd1a5; --accent-dim:#245c48; --accent-blue:#5b8cff;
  --warn:#e0a856; --danger:#e0685f;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
*{box-sizing:border-box;min-width:0;}
html,body{margin:0;height:100%;background:var(--bg-0);color:var(--text-0);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;}
#app{display:flex;height:100vh;overflow:hidden;}

.sidebar{width:200px;flex-shrink:0;background:var(--bg-1);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;padding:16px 0;overflow-y:auto;}
.brand{padding:0 16px 16px 16px;border-bottom:1px solid var(--border-soft);margin-bottom:8px;}
.brand-name{font-weight:700;font-size:15px;letter-spacing:0.3px;}
.brand-name span{color:var(--accent);}
.brand-sub{font-size:9.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.nav-item{padding:9px 16px;color:var(--text-1);cursor:pointer;font-size:12.5px;border-left:2px solid transparent;
  display:flex;align-items:center;gap:8px;}
.nav-item:hover{background:var(--bg-2);color:var(--text-0);}
.nav-item.active{background:var(--bg-2);color:var(--text-0);border-left-color:var(--accent);font-weight:600;}
.nav-section-title{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-2);
  padding:12px 16px 4px 16px;}
.saved-list{overflow-y:auto;}
.saved-item{padding:8px 16px;font-size:11.5px;color:var(--text-1);cursor:pointer;border-left:2px solid transparent;}
.saved-item:hover{background:var(--bg-2);color:var(--text-0);}
.saved-item .sf-name{color:var(--text-0);font-weight:500;}
.saved-item .sf-meta{color:var(--text-2);font-size:10px;margin-top:1px;}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.topbar{background:var(--bg-1);border-bottom:1px solid var(--border-soft);padding:11px 20px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.topbar-title{font-weight:700;font-size:14.5px;margin-right:6px;white-space:nowrap;}
.pill-badge{background:var(--accent-dim);color:var(--accent);font-size:9.5px;padding:3px 9px;border-radius:10px;
  text-transform:uppercase;letter-spacing:0.5px;font-weight:600;}
.spacer{flex:1;}
.btn{background:var(--bg-3);border:1px solid var(--border);color:var(--text-0);padding:7px 13px;
  border-radius:6px;font-size:12px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.btn:hover{background:#252b38;border-color:#3a4155;}
.btn-primary{background:var(--accent);color:#06231a;border-color:var(--accent);font-weight:700;}
.btn-primary:hover{background:#5edcae;}
.btn-danger-ghost{color:var(--danger);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 20px 60px 20px;}
.card{background:var(--bg-1);border:1px solid var(--border-soft);border-radius:10px;padding:15px 17px;margin-bottom:14px;}
.card-title{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-2);font-weight:700;
  margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.field-row{display:flex;flex-wrap:wrap;gap:14px;}
.field{display:flex;flex-direction:column;gap:5px;flex:1 1 130px;max-width:220px;}
.field.grow{flex:2 1 200px;max-width:none;}
.field label{font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:0.4px;white-space:nowrap;}
input,select{background:var(--bg-0);border:1px solid var(--border);color:var(--text-0);
  padding:8px 10px;border-radius:6px;font-size:12.5px;font-family:inherit;width:100%;}
input:focus,select:focus{outline:none;border-color:var(--accent-blue);}
input[type=number]{font-family:var(--mono);}

.map-wrap{height:420px;border-radius:10px;overflow:hidden;border:1px solid var(--border-soft);position:relative;}
#map{height:100%;width:100%;background:#0b0d12;}
.map-hint{position:absolute;bottom:10px;left:10px;background:rgba(11,13,18,0.88);border:1px solid var(--border);
  padding:6px 10px;border-radius:6px;font-size:11px;color:var(--text-1);z-index:1000;}
.map-toolbar{position:absolute;top:10px;left:10px;z-index:1000;display:flex;gap:6px;flex-wrap:wrap;max-width:70%;}
.map-toolbar .btn{padding:6px 10px;font-size:11px;}

table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;}
th{text-align:left;color:var(--text-2);font-weight:600;font-size:9.5px;text-transform:uppercase;
  letter-spacing:0.4px;padding:7px 7px;border-bottom:1px solid var(--border-soft);font-family:'Inter',sans-serif;}
td{padding:6px 7px;border-bottom:1px solid var(--border-soft);color:var(--text-0);white-space:nowrap;}
tr:hover td{background:var(--bg-2);}
td input{width:100%;min-width:50px;padding:5px 7px;font-size:11.5px;background:transparent;border:1px solid transparent;}
td input:hover{border-color:var(--border);}
td input:focus{background:var(--bg-0);border-color:var(--accent-blue);}
.wp-name-input{min-width:85px !important;font-family:'Inter',sans-serif !important;}
.small-btn{background:none;border:none;color:var(--text-2);cursor:pointer;font-size:13px;padding:2px 5px;border-radius:4px;}
.small-btn:hover{background:var(--bg-3);color:var(--text-0);}
.total-row td{border-top:1px solid var(--border);font-weight:700;color:var(--accent);background:var(--bg-2);}
.manual-tag{font-size:9px;color:var(--warn);border:1px solid var(--warn);padding:1px 5px;border-radius:8px;margin-left:5px;}
.auto-tag{font-size:9px;color:var(--accent);border:1px solid var(--accent-dim);padding:1px 5px;border-radius:8px;margin-left:5px;}
.ok-tag{font-size:10px;color:var(--accent);font-weight:700;}
.bad-tag{font-size:10px;color:var(--danger);font-weight:700;}

.empty-state{color:var(--text-2);font-size:12px;text-align:center;padding:22px 10px;}
.status-line{font-size:11px;color:var(--text-2);margin-top:8px;line-height:1.5;}
.status-line.ok{color:var(--accent);}
.status-line.err{color:var(--danger);}
.status-line.warn{color:var(--warn);}

.mnb-grid{display:grid;grid-template-columns:1fr 320px;gap:18px;}
@media (max-width:900px){.mnb-grid{grid-template-columns:1fr;}}
.limit-bar{height:5px;background:var(--bg-3);border-radius:3px;overflow:hidden;margin-top:4px;}
.limit-fill{height:100%;background:var(--accent);}
.limit-fill.over{background:var(--danger);}

.tabs-locked{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.tab-locked{background:var(--bg-1);border:1px solid var(--border-soft);color:var(--text-2);
  padding:8px 14px;border-radius:6px;font-size:12px;cursor:not-allowed;display:flex;align-items:center;gap:6px;}

.toast{position:fixed;bottom:20px;right:20px;background:var(--bg-3);border:1px solid var(--border);
  padding:10px 16px;border-radius:8px;font-size:12px;color:var(--text-0);z-index:2000;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);opacity:0;transform:translateY(8px);transition:all 0.25s;max-width:320px;}
.toast.show{opacity:1;transform:translateY(0);}

::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:var(--bg-0);}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:5px;}

/* ---- Performances (décollage / atterrissage) ---- */
.perf-tabs{display:flex;gap:8px;margin-bottom:14px;}
.perf-tabs .btn{flex:1;justify-content:center;}
.perf-speeds{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.perf-spd{flex:1;min-width:90px;background:var(--bg-0);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.perf-spd .k{font-size:9.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;}
.perf-spd .v{font-family:var(--mono);font-size:16px;color:var(--text-0);margin-top:2px;}
.perf-big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.perf-box{background:var(--bg-0);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.perf-box .k{font-size:9.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;}
.perf-box .v{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--text-0);margin-top:4px;}
.perf-box .x{font-size:10.5px;color:var(--text-2);margin-top:2px;}
.perf-box.accent .v{color:var(--accent);}
.perf-verdict{font-family:var(--mono);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;}
.perf-verdict.ok{color:var(--accent);background:rgba(79,209,165,.12);border:1px solid rgba(79,209,165,.35);}
.perf-verdict.warn{color:var(--warn);background:rgba(224,168,86,.12);border:1px solid rgba(224,168,86,.35);}
.perf-verdict.bad{color:var(--danger);background:rgba(224,104,95,.14);border:1px solid rgba(224,104,95,.4);}
.perf-rwybox{background:var(--bg-0);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;}
.perf-rwyhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
.perf-rwyhead .t{font-size:10.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;}
svg.perf-rwy{width:100%;height:auto;display:block;font-family:var(--mono);}
.perf-notes{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--text-1);line-height:1.6;}
.perf-notes .nw{color:var(--warn);}
.perf-notes .ne{color:var(--danger);}
.perf-src{font-size:10.5px;color:var(--accent-blue);margin-top:4px;}
details.perf-method{margin-top:12px;border:1px solid var(--border-soft);border-radius:8px;background:var(--bg-0);}
details.perf-method summary{cursor:pointer;padding:9px 12px;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--accent-blue);list-style:none;}
details.perf-method summary::-webkit-details-marker{display:none;}
details.perf-method .body{padding:0 13px 12px;font-family:var(--mono);font-size:11px;color:var(--text-1);line-height:1.65;}
details.perf-method .body b{color:var(--text-0);}
</style>
</head>

<script>
/* Storage abstraction: uses Claude's window.storage when running as an artifact,
   falls back to the browser's localStorage when running as a standalone hosted page. */
const appStorage = (window.storage && typeof window.storage.get === 'function')
  ? window.storage
  : {
      async get(key){ const v = localStorage.getItem(key); return v===null ? null : {key, value:v}; },
      async set(key, value){ localStorage.setItem(key, value); return {key, value}; },
      async delete(key){ localStorage.removeItem(key); return {key, deleted:true}; },
      async list(prefix){
        const keys = [];
        for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(!prefix || k.startsWith(prefix)) keys.push(k); }
        return { keys };
      }
    };

/* ============================= PERFORMANCE DA40 D (décollage / atterrissage) =============================
   Sources :
   - F-HOVE / F-GZMP (TAE 125-02-114, 155 HP, STC 10036328) : tables EXACTES du supplément AFM/POH
     (Doc. 50-0310-500, chap. 5(a)/5(b) selon hélice) — reproduites intégralement ci-dessous.

     l'abaque de base lui-même :
       · Roulage : PA 6000ft, OAT 10°C, 1010 kg, vent debout 15 kt → 260 m  ⇒ K_ROLL = 1.109
       · Distance/obstacle 15 m : PA 4000ft, OAT 22°C, 1070 kg, vent debout 10 kt → 600 m ⇒ K_OBST = 1.250
     C'est donc une ESTIMATION, explicitement marquée comme telle dans l'UI — à recouper avec l'abaque
     papier avant tout vol réel.

     (indépendant du moteur) : volets LDG 744 m / 287 m roulage ; volets UP 916 m / 304 m roulage

   - Montée (135 HP) : même principe que le décollage — pas de table, seulement des abaques (nomogrammes
     3 panneaux, Doc. 6.01.05-E Rev.8, p.5-15 montée initiale / p.5-17 montée croisière). Forme reprise
     des tables -114 (5(a)-7 et 5(a)-8), mise à l'échelle sur l'exemple chiffré imprimé sur chaque abaque :
       · Montée initiale : PA 8000ft, OAT 21°C, 1030 kg → Vz = 560 ft/min ⇒ K_CLIMB_TO = 0,933
       · Montée croisière : PA 4000ft, OAT 18°C, 975 kg → Vz = 740 ft/min ⇒ K_CLIMB_CRUISE = 0,977
     Un seul point de calibration par abaque (contre deux pour le décollage) : ESTIMATION à recouper avec
     l'abaque papier avant tout vol réel — un champ de saisie manuelle permet d'écraser la valeur si tu
     préfères t'appuyer directement sur ta lecture de l'abaque. */

  const PA_CL8_5a=[0,1000,2000,3000,4000,5000,6000,7000,8000,9000,10000,11000,12000,13000,14000,15000];
  const climb8_5a=[[815,785,754,723],[810,779,748,717],[804,773,742,711],[798,766,735,704],[792,760,729,697],[785,754,722,691],[779,747,715,684],[772,740,708,677],[765,733,701,669],[725,693,661,630],[675,644,613,583],[626,595,565,535],[576,546,517,487],[526,497,468,439],[476,448,420,391],[426,398,371,343]];
  const PA_CL8_5b=[0,1000,2000,3000,4000,5000,6000,7000,8000,9000,10000,11000,12000,13000,14000,15000,16000];
  const climb8_5b=[[918,913,901,829],[914,909,896,824],[909,904,891,819],[905,899,887,814],[900,894,882,809],[895,889,877,804],[890,884,871,798],[885,879,866,793],[880,874,861,787],[850,844,831,759],[821,814,801,730],[791,784,771,701],[761,754,740,672],[730,723,710,643],[700,693,680,614],[670,662,649,584],[639,632,618,554]];
  const VCRUISECLIMB_KIAS=78; // Airspeed for (cruise) climb, 1150 kg, identique tables 5(a)-8 et 5(b)-8

  // ---- Vitesses de montée (base AFM §5.3.8/5.3.9, valides pour toute la flotte y compris 135 HP) ----
  // Utilisées pour convertir un Vz lu à la main sur l'abaque (135 HP) en TAS/γ.
  const VCL01_CRUISE={850:60,1000:68,1150:73}; // montée croisière, flaps UP

  // ---- Croisière — Table 5(a)-11 / 5(b)-11, réservoirs standard ----
  // KTAS par [PA, %puissance]. Débit essentiellement indépendant de PA (fonction du %puissance seul).
  const cruiseTAS5a={
    100:[[0,140],[2000,143],[4000,146],[6000,148]],
    90:[[0,135],[2000,137],[4000,140],[6000,142],[8000,145],[10000,148],[12000,150]],
    80:[[0,129],[2000,131],[4000,133],[6000,135],[8000,138],[10000,140],[12000,143],[14000,145],[16000,148]],
    70:[[0,122],[2000,124],[4000,126],[6000,128],[8000,130],[10000,132],[12000,134],[14000,137],[16000,139]],
    60:[[0,114],[2000,115],[4000,117],[6000,119],[8000,121],[10000,123],[12000,125],[14000,127],[16000,129]],
    50:[[0,104],[2000,105],[4000,107],[6000,109],[8000,110],[10000,112],[12000,113],[14000,115],[16000,117]]
  };
  const cruiseTAS5b={
    100:[[0,143],[2000,145],[4000,148],[6000,151],[8000,154]],
    90:[[0,137],[2000,140],[4000,142],[6000,145],[8000,148],[10000,150],[12000,153]],
    80:[[0,131],[2000,133],[4000,136],[6000,138],[8000,141],[10000,144],[12000,146],[14000,149],[16000,152]],
    70:[[0,124],[2000,126],[4000,129],[6000,131],[8000,133],[10000,136],[12000,138],[14000,141],[16000,143]],
    60:[[0,117],[2000,118],[4000,120],[6000,123],[8000,125],[10000,127],[12000,129],[14000,131],[16000,133]],
    50:[[0,107],[2000,109],[4000,111],[6000,112],[8000,114],[10000,115],[12000,117],[14000,118],[16000,120]]
  };
  // Débit carburant par %puissance (identique 5(a)/5(b), même moteur) — l/h et US gal/h
  const FUEL_FLOW_BY_LOAD={50:{lh:15.3,usgh:4.0},60:{lh:18.6,usgh:4.9},70:{lh:22.1,usgh:5.8},80:{lh:25.8,usgh:6.8},90:{lh:29.6,usgh:7.8},100:{lh:33.6,usgh:8.9}};

  const lerp=(a,b,t)=>a+(b-a)*t;
  function bracket(grid,v){
    if(v<=grid[0])return[0,0,0];
    if(v>=grid[grid.length-1])return[grid.length-1,grid.length-1,0];
    for(let i=0;i<grid.length-1;i++) if(v<=grid[i+1]) return[i,i+1,(v-grid[i])/(grid[i+1]-grid[i])];
  }
  function interpTable(tbl,dGrid,paV,dISA){
    const dC=Math.max(0,dISA);
    const[p0,p1,pf]=bracket(PA,paV);
    const[d0,d1,df]=bracket(dGrid,dC);
    const cell=(pi,di,w)=>tbl[pi][di*2+w];
    const atD=(pi,w)=>lerp(cell(pi,d0,w),cell(pi,d1,w),df);
    return{roll:lerp(atD(p0,0),atD(p1,0),pf),obst:lerp(atD(p0,1),atD(p1,1),pf)};
  }
  function vAt(map,mass,ws){
    let w0=ws[0],w1=ws[ws.length-1];
    for(let i=0;i<ws.length-1;i++){if(mass>=ws[i]&&mass<=ws[i+1]){w0=ws[i];w1=ws[i+1];break;}}
    return lerp(map[w0],map[w1],w1===w0?0:(mass-w0)/(w1-w0));
  }
  function takeoffShape(prop,mass,paV,dISA){
    const tabs=prop==='5b'?t5b:t5a, dGrid=prop==='5b'?D5b:D5a;
    const ws=Object.keys(tabs).map(Number).sort((a,b)=>a-b);
    let w0=ws[0],w1=ws[ws.length-1];
    for(let i=0;i<ws.length-1;i++){if(mass>=ws[i]&&mass<=ws[i+1]){w0=ws[i];w1=ws[i+1];break;}}
    const a=interpTable(tabs[w0],dGrid,paV,dISA), b=interpTable(tabs[w1],dGrid,paV,dISA);
    const t=w1===w0?0:(mass-w0)/(w1-w0);
    return{roll:lerp(a.roll,b.roll,t),obst:lerp(a.obst,b.obst,t),wlo:ws[0],whi:ws[ws.length-1]};
  }
  const isaTemp=pa=>15-1.98*(pa/1000);
  function sigma(pa,oat){const d=Math.pow(1-6.8756e-6*pa,5.2559);return d/((273.15+oat)/288.15);}
  function vApp(mass){const p=[[850,58],[1000,63],[1150,71]];if(mass<=850)return 58;if(mass>=1150)return 71;for(let i=0;i<p.length-1;i++){if(mass<=p[i+1][0]){const[a,b]=p[i],[c,d]=p[i+1];return b+(d-b)*(mass-a)/(c-a);}}}
  function windTO(hw){return hw>=0?Math.max(0.60,1-0.020*hw):1+0.035*(-hw);}
  function windLDG(va,hw){return Math.pow(Math.max(0.30,(va-hw)/va),2);}
  function grassLD(s){return s==='g5'?.05:s==='g10'?.15:s==='g25'?.25:0;}
  // OPS 1.530 : herbe sèche x1.2, herbe mouillée x1.3, piste dure (sèche ou mouillée) x1.0. Appliqué au TOD (roulage + distance/obstacle).
  function opsTOFactor(surf,pstate){ return surf!=='0' ? (pstate==='wet'?1.3:1.2) : 1.0; }

  function climbVz(prop,paV,dISA){
    const tbl = prop==='5b'?climb5b:climb5a, dGrid = prop==='5b'?D5b_CL:D5a_CL;
    const dC=Math.max(0,dISA);
    const[p0,p1,pf]=bracket(PA,paV);
    const[d0,d1,df]=bracket(dGrid,dC);
    const cell=(pi,di)=>tbl[pi][di];
    const atD=(pi)=>lerp(cell(pi,d0),cell(pi,d1),df);
    return lerp(atD(p0),atD(p1),pf);
  }
  function climbVzCruise(prop,paV,dISA){
    const tbl = prop==='5b'?climb8_5b:climb8_5a, paGrid = prop==='5b'?PA_CL8_5b:PA_CL8_5a;
    const dGrid = D5a_CL; // [0,10,20,30] pour les deux hélices (colonne ISA+35 de 5(b)-8 écartée, voir note)
    const dC=Math.max(0,dISA);
    const[p0,p1,pf]=bracket(paGrid,paV);
    const[d0,d1,df]=bracket(dGrid,dC);
    const cell=(pi,di)=>tbl[pi][di];
    const atD=(pi)=>lerp(cell(pi,d0),cell(pi,d1),df);
    return lerp(atD(p0),atD(p1),pf);
  }
  function cruiseLookup(prop,load,paV){
    const table = prop==='5b'?cruiseTAS5b:cruiseTAS5a;
    const arr = table[load];
    if(!arr) return null;
    const maxPA = arr[arr.length-1][0];
    const clamped = Math.min(paV, maxPA);
    let ktas;
    if(clamped<=arr[0][0]) ktas=arr[0][1];
    else{
      for(let i=0;i<arr.length-1;i++){
        if(clamped<=arr[i+1][0]){ const t=(clamped-arr[i][0])/(arr[i+1][0]-arr[i][0]); ktas=lerp(arr[i][1],arr[i+1][1],t); break; }
      }
    }
    const ff = FUEL_FLOW_BY_LOAD[load];
    return{ ktas, lh:ff.lh, usgh:ff.usgh, outOfRange: paV>maxPA, maxPA };
  }

  function computeTO(eng,prop,mass,I){
    let roll,obst,vr,vcl,est;
    if(eng==='114'){
      const r=takeoffShape(prop,mass,I.pa,I.isa);
      roll=r.roll; obst=r.obst;
      vr=Math.round(vAt(VR114,mass,[980,1000,1150])); vcl=Math.round(vAt(VCL114,mass,[980,1000,1150]));
      est=false;
    }else{
      const r=takeoffShape('5a',mass,I.pa,I.isa); // forme reprise de la table -114 (même cellule), mise à l'échelle
      roll=K_ROLL01*r.roll; obst=K_OBST01*r.obst;
      vr=Math.round(vAt(VR01,mass,[850,1000,1150])); vcl=Math.round(vAt(VCL01,mass,[850,1000,1150]));
      est=true;
    }
    let air=obst-roll; const notes=[];
    const opsF = opsTOFactor(I.surf, I.state);
    if(opsF!==1.0){
      roll*=opsF; air*=opsF;
      notes.push(['w', `OPS 1.530 — ${I.surf!=='0'?(I.state==='wet'?'herbe mouillée':'herbe sèche'):'piste dure'} : TOD ×${opsF}.`]);
    }
    let slF=1; if(I.slope>0){slF=1+0.05*I.slope; notes.push(['w',`Pente montante ${I.slope}% : TOD +${(0.05*I.slope*100).toFixed(0)} % (OPS 1.530 : +5 % par 1 % de pente).`]);}
    roll*=slF; air*=slF;
    const fw=windTO(I.head); roll*=fw; air*=fw;
    obst=air+roll;
    if(I.head<0) notes.push(['e',`Vent arrière ${Math.abs(I.head).toFixed(0)} kt : distance fortement majorée.`]);
    if(mass>1150) notes.push(['e','Masse > MTOW 1150 kg.']);
    if(I.pa>10000) notes.push(['e','Altitude pression > 10 000 ft : hors plage.']);
    if(eng==='114'&&mass<980) notes.push(['e','Masse < 980 kg : hors table (extrapolée).']);
    if(eng==='01'&&mass<850) notes.push(['w','Masse < 850 kg : hors plage VR/Vclimb (extrapolée).']);
    return{roll,obst,vr,vcl,est,notes,avail:I.tora};
  }
  function computeLDG(flaps,mass,I){
    const base=LDG_BASE[flaps];
    const va=vApp(mass);
    const fw=windLDG(va,I.head);
    let roll=base.roll*(mass/1150)/I.sig*fw;
    let tot =base.tot *(mass/1150)/I.sig*fw;
    let air=tot-roll; const notes=[];
    const g=grassLD(I.surf); if(g){roll*=(1+g); notes.push(['w',`Herbe : roulage +${(g*100)|0} %.`]);}
    if(I.state==='wet'){roll*=1.15; notes.push(['w','Mouillé : +15 % roulage (prudentiel, hors AFM).']);}
    let slF=1; if(I.slope<0){slF=1+0.05*Math.abs(I.slope); notes.push(['w',`Pente descendante ${Math.abs(I.slope)}% : +${(0.05*Math.abs(I.slope)*100).toFixed(0)} % (AFM : 2 % pente ≈ +10 %).`]);}
    roll*=slF; air*=slF; tot=air+roll;
    if(I.head<0) notes.push(['e',`Vent arrière ${Math.abs(I.head).toFixed(0)} kt : atterrissage fortement allongé.`]);
    if(mass>1150) notes.push(['e','Masse > MLW 1150 kg.']);
    return{roll,tot,vapp:Math.round(va),notes,avail:I.lda};
  }
  function computeClimb(prop,I,head){
    const vz = climbVz(prop, I.pa, I.isa);
    const tas = VCLIMB_INIT_KIAS / Math.sqrt(sigma(I.pa,I.oat));
    const gsKt = Math.max(1, tas - head);
    const gsFtMin = gsKt * 101.269;
    const gamma = (vz/gsFtMin)*100;
    return{ vz, iasKt:VCLIMB_INIT_KIAS, tas, gsKt, gamma };
  }
  function computeClimbCruise(prop,I,head){
    const vz = climbVzCruise(prop, I.pa, I.isa);
    const tas = VCRUISECLIMB_KIAS / Math.sqrt(sigma(I.pa,I.oat));
    const gsKt = Math.max(1, tas - head);
    const gsFtMin = gsKt * 101.269;
    const gamma = (vz/gsFtMin)*100;
    return{ vz, iasKt:VCRUISECLIMB_KIAS, tas, gsKt, gamma };
  }
  // ---- 135 HP (moteur 01) : pas de table Vz dans l'AFM de base, seulement des abaques (nomogrammes) —
  // forme reprise des tables -114 (5(a)-7/5(a)-8), mise à l'échelle par K_CLIMB_TO01/K_CLIMB_CRUISE01
  // (calibrés sur l'exemple chiffré de chaque abaque, voir en-tête). ESTIMATION.
  function climb01Estimate(phase,mass,I,head){
    const shape = phase==='cruise' ? climbVzCruise('5a', I.pa, I.isa) : climbVz('5a', I.pa, I.isa);
    const K = phase==='cruise' ? K_CLIMB_CRUISE01 : K_CLIMB_TO01;
    const vz = shape*K;
    const iasKt = phase==='cruise' ? vAt(VCL01_CRUISE,mass,[850,1000,1150]) : vAt(VCL01,mass,[850,1000,1150]);
    const tas = iasKt / Math.sqrt(sigma(I.pa,I.oat));
    const gsKt = Math.max(1, tas - head);
    const gsFtMin = gsKt * 101.269;
    const gamma = (vz/gsFtMin)*100;
    return{ vz, iasKt, tas, gsKt, gamma, est:true };
  }
  // Permet d'écraser l'estimation ci-dessus par une lecture manuelle de l'abaque papier, si le pilote préfère.
  function manualClimbFromVz(phase,vz,mass,I,head){
    const iasKt = phase==='cruise' ? vAt(VCL01_CRUISE,mass,[850,1000,1150]) : vAt(VCL01,mass,[850,1000,1150]);
    const tas = iasKt / Math.sqrt(sigma(I.pa,I.oat));
    const gsKt = Math.max(1, tas - head);
    const gsFtMin = gsKt * 101.269;
    const gamma = (vz/gsFtMin)*100;
    return{ vz, iasKt, tas, gsKt, gamma };
  }
  function computeCruise(prop,load,paV){
    return cruiseLookup(prop, load, paV);
  }
  return{isaTemp,sigma,computeTO,computeLDG,computeClimb,computeClimbCruise,climb01Estimate,manualClimbFromVz,computeCruise};
})();

    aircraft: state.aircraft, regTail: state.regTail,
    depIcao: state.depIcao, destIcao: state.destIcao, altnIcao: state.altnIcao,
    pprDep: state.pprDep, pprDest: state.pprDest, notamText: state.notamText, metText: state.metText,
    crew: state.crew, pax: state.pax, boardingTime: state.boardingTime,
    alternatePoint: state.alternatePoint, weatherExtraIcao: state.weatherExtraIcao,
    waypoints: state.waypoints, fuelParams: state.fuelParams, fuelMode: state.fuelMode, fuelParamsNco: state.fuelParamsNco,
    legNotes: state.legNotes, mnb: state.mnb, perf: state.perf,
    savedAt: new Date().toISOString()
  };
  try{
    await appStorage.set('flight_' + id, JSON.stringify(payload));
    const idx = state.savedFlights.filter(f => f.id !== id);
    idx.unshift({ id, name: state.flightName, savedAt: payload.savedAt,
      route: state.waypoints.map(w=>w.name).join(' → ') });
    state.savedFlights = idx;
    await appStorage.set('flights_index', JSON.stringify(idx));
    showToast('Vol enregistré ✓');
    renderSidebarSaved();
  }catch(e){ showToast('Erreur d’enregistrement.'); }
}
async function loadFlight(id){

    state.waypoints = f.waypoints; state.legs = [];

/* ============================= GEO / NAV MATH ============================= */
const toRad = d => d * Math.PI/180;
const toDeg = r => r * 180/Math.PI;
function norm360(d){ d = d % 360; if(d<0) d+=360; return d; }
function distanceNM(a,b){
  const R = 3440.065;
  const dLat = toRad(b.lat-a.lat), dLon = toRad(b.lon-a.lon);
  const la1=toRad(a.lat), la2=toRad(b.lat);
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return R * 2*Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
}
function trueCourse(a,b){
  const la1=toRad(a.lat), la2=toRad(b.lat), dLon=toRad(b.lon-a.lon);
  const y = Math.sin(dLon)*Math.cos(la2);
  const x = Math.cos(la1)*Math.sin(la2) - Math.sin(la1)*Math.cos(la2)*Math.cos(dLon);
  return norm360(toDeg(Math.atan2(y,x)));
}
function windTriangle(tc, tas, windDirFrom, windSpeed){
  const diff = toRad(windDirFrom - tc);
  const wca = toDeg(Math.asin( Math.max(-1,Math.min(1,(windSpeed/tas)*Math.sin(diff))) ));
  const hdgTrue = norm360(tc + wca);
  const gs = tas*Math.cos(toRad(wca)) - windSpeed*Math.cos(diff);
  return { wca, hdgTrue, gs: Math.max(gs, 1) };
}
const LEVELS = [1000,975,950,925,900,850,800,700,600,500];
function levelAltFt(hpa){ return (44330 * (1 - Math.pow(hpa/1013.25, 1/5.255))) * 3.28084; }
function nearestLevel(altFt){
  let best = LEVELS[0], bestDiff = Infinity;
  for(const l of LEVELS){ const d = Math.abs(levelAltFt(l) - altFt); if(d < bestDiff){ bestDiff = d; best = l; } }
  return best;
}

/* ============================= MEA / TERRAIN (obstacle corridor sampling) ============================= */
function destinationPoint(lat, lon, bearingDeg, distNM){
  const R = 3440.065;
  const d = distNM/R;
  const brng = toRad(bearingDeg);
  const lat1 = toRad(lat), lon1 = toRad(lon);
  const lat2 = Math.asin(Math.sin(lat1)*Math.cos(d) + Math.cos(lat1)*Math.sin(d)*Math.cos(brng));
  const lon2 = lon1 + Math.atan2(Math.sin(brng)*Math.sin(d)*Math.cos(lat1), Math.cos(d)-Math.sin(lat1)*Math.sin(lat2));
  return { lat: toDeg(lat2), lon: toDeg(lon2) };
}
async function fetchElevations(points){
  const results = new Array(points.length);
  for(let i=0;i<points.length;i+=100){
    const chunk = points.slice(i, i+100);
    const lats = chunk.map(p=>p.lat.toFixed(4)).join(',');
    const lons = chunk.map(p=>p.lon.toFixed(4)).join(',');
    const url = `https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lons}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('elevation http '+res.status);
    const data = await res.json();
    data.elevation.forEach((e,j)=>{ results[i+j] = e; });
  }
  return results;
}
/* Samples a 20NM-wide corridor (10NM either side of track) along a leg and returns the
   highest obstacle found, plus the MEA (obstacle + 1000ft if <5000ft, +2000ft if >=5000ft). */
async function computeLegMEA(a, b){
  const dist = distanceNM(a,b);
  const tc = trueCourse(a,b);
  const alongStep = Math.max(2, dist/6);
  const offsets = [-10,-5,0,5,10];
  const samples = [];
  for(let d=0; d<=dist+0.01; d+=alongStep){
    const dd = Math.min(d, dist);
    const centerPt = destinationPoint(a.lat, a.lon, tc, dd);
    offsets.forEach(off=>{
      if(off===0){ samples.push(centerPt); }
      else{ samples.push(destinationPoint(centerPt.lat, centerPt.lon, norm360(tc + (off<0?-90:90)), Math.abs(off))); }
    });
  }
  const elevM = await fetchElevations(samples);
  const validElevM = elevM.filter(v=>v!=null && !isNaN(v));
  const maxElevFt = validElevM.length ? Math.max(...validElevM) * 3.28084 : 0;
  const margin = maxElevFt < 5000 ? 1000 : 2000;
  const mea = Math.ceil((maxElevFt + margin)/50)*50; // round up to nearest 50ft
  return { maxElevFt, margin, mea };
}
/* Rounds a required pressure altitude up to the next valid VFR semicircular flight level.
   Magnetic track 000-179° -> odd thousands +500ft. Magnetic track 180-359° -> even thousands +500ft. */
function roundToSemicircular(requiredAlt, magneticTrack){
  const wantOdd = (magneticTrack >= 0 && magneticTrack < 180);
  let n = Math.ceil((requiredAlt - 500) / 1000);
  if(n < 1) n = 1;
  if(wantOdd && n % 2 === 0) n += 1;
  if(!wantOdd && n % 2 !== 0) n += 1;
  return n*1000 + 500;
}
/* Pure calc + state mutation (cruiseAlt, waypoints, autoFlInfo) — does NOT itself
   trigger a nav log recompute, so it can be called both from computeNavLog() (which
   is already mid-computation) and from the manual "Auto" button. Returns true if the
   chosen level actually changed the cruise altitude (caller decides whether to
   recompute the nav log to refresh wind-at-level etc.). */
function applyAutoFL(){
  if(state.legs.length === 0) return false;
  const routeMEA = Math.max(...state.legs.map(l=>l.mea));
  const wpsWithAtmo = state.waypoints.filter(w=>w.qnh!=null && w.tempC!=null);
  const qnh = wpsWithAtmo.length ? wpsWithAtmo.reduce((s,w)=>s+w.qnh,0)/wpsWithAtmo.length : 1013.25;
  const tempAtLevel = wpsWithAtmo.length ? wpsWithAtmo.reduce((s,w)=>s+w.tempC,0)/wpsWithAtmo.length : null;
  const pressureCorrection = Math.max(0, (1013 - qnh) * 30);
  const isaTemp = 15 - 1.98*(routeMEA/1000);
  const deltaT = tempAtLevel!=null ? Math.max(0, isaTemp - tempAtLevel) : 0;
  const tempCorrection = routeMEA * deltaT * 0.004;
  const requiredAlt = routeMEA + pressureCorrection + tempCorrection;
  const mt = state.legs[0].mt;
  const chosenFL = roundToSemicircular(requiredAlt, mt);
  const oldCruiseAlt = state.cruiseAlt;
  const changed = Math.round(chosenFL) !== Math.round(oldCruiseAlt);
  // propagate the new level to every waypoint that was still at the old cruise altitude
  // (points deliberately set lower/higher — TOD, circuit altitude, etc. — are left untouched)
  state.waypoints.forEach(wp=>{
    if(Math.round(wp.alt ?? oldCruiseAlt) === Math.round(oldCruiseAlt)){ wp.alt = chosenFL; }
  });
  state.cruiseAlt = chosenFL;
  state.autoFlInfo = { routeMEA, qnh: Math.round(qnh), tempAtLevel: tempAtLevel!=null?Math.round(tempAtLevel):null,
    isaTemp: Math.round(isaTemp), deltaT: Math.round(deltaT*10)/10, pressureCorrection: Math.round(pressureCorrection),
    tempCorrection: Math.round(tempCorrection), requiredAlt: Math.round(requiredAlt), mt: Math.round(mt), chosenFL };
  return changed;
}
/* Manual "🧮 Auto" button (visible in Manuel mode): one-off suggestion, does not
   switch the field back into permanent Auto mode. */
async function computeAutoFL(){
  if(state.legs.length === 0){ showToast('Calcule d\'abord le log de nav (MEA nécessaire pour le niveau auto).'); return; }
  const changed = applyAutoFL();
  showToast('Niveau de croisière calculé : ' + state.cruiseAlt + ' ft' + (changed ? ' — recalcul du log de nav…' : ''));
  if(changed) await computeNavLog({isRecompute:true});
  else renderAll();
}


async function fetchWindAtPoint(lat, lon, level, dateStr, timeStr){
  const hour = timeStr.slice(0,2);
  const targetISO = `${dateStr}T${hour}:00`;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}`
    + `&hourly=windspeed_${level}hPa,winddirection_${level}hPa,temperature_${level}hPa,pressure_msl&windspeed_unit=kn&timezone=UTC&forecast_days=16`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('http '+res.status);
  const data = await res.json();
  const times = data.hourly.time;
  let idx = times.indexOf(targetISO);
  if(idx === -1){
    const target = new Date(targetISO+':00Z').getTime();
    let bestI=0, bestD=Infinity;
    times.forEach((t,i)=>{ const d=Math.abs(new Date(t+':00Z').getTime()-target); if(d<bestD){bestD=d;bestI=i;} });
    idx = bestI;
    if(bestD > 1000*60*60*24*3) throw new Error('hors plage');
  }
  const spd = data.hourly[`windspeed_${level}hPa`][idx];
  const dir = data.hourly[`winddirection_${level}hPa`][idx];
  const tempC = data.hourly[`temperature_${level}hPa`] ? data.hourly[`temperature_${level}hPa`][idx] : null;
  const qnh = data.hourly.pressure_msl ? data.hourly.pressure_msl[idx] : null;
  if(spd == null || dir == null) throw new Error('donnée manquante');
  return { speed: Math.round(spd), dir: Math.round(dir), tempC, qnh };
}

async function computeNavLog(opts={}){
  const isRecompute = !!opts.isRecompute;
  if(state.waypoints.length < 2){ showToast('Ajoute au moins 2 points.'); return; }
  state.computeStatus = {type:'info', msg: (state.flAutoMode && !isRecompute)
    ? 'Récupération du vent (Open-Meteo) — niveau provisoire, sera recalculé en auto ensuite…'
    : 'Récupération du vent (Open-Meteo)…'};
  renderContent();
  let anyManualFallback = false;
  for(const wp of state.waypoints){
    if(wp.manual) continue;
    const level = nearestLevel(wp.alt ?? state.cruiseAlt);
    try{
      const w = await fetchWindAtPoint(wp.lat, wp.lon, level, state.eobtDate, state.eobtTime);
      wp.windDir = w.dir; wp.windSpeed = w.speed; wp.windError = false;
      wp.tempC = w.tempC; wp.qnh = w.qnh;
    }catch(e){
      wp.windError = true; anyManualFallback = true;
      if(wp.windDir == null) wp.windDir = 0;
      if(wp.windSpeed == null) wp.windSpeed = 0;
    }
  }
  state.computeStatus = {type:'info', msg:'Analyse du relief le long de la route (corridor 20NM)…'};
  renderContent();
  const legs = [];
  let cumMin = 0, cumNM = 0, cumFuelUSG = 0;
  let meaError = false;
  const ac = AIRCRAFT_DB[state.aircraft];
  const climbFpm = (ac.climbFpmByTail && ac.climbFpmByTail[state.regTail]) || ac.climbFpmDefault || null;
  for(let i=0;i<state.waypoints.length-1;i++){
    const a = state.waypoints[i], b = state.waypoints[i+1];
    const aAlt = a.alt ?? state.cruiseAlt, bAlt = b.alt ?? state.cruiseAlt;
    const dist = distanceNM(a,b);
    const tc = trueCourse(a,b);
    const d1 = toRad(a.windDir||0), d2 = toRad(b.windDir||0);
    const sSin = Math.sin(d1)+Math.sin(d2), sCos = Math.cos(d1)+Math.cos(d2);
    const windDir = norm360(toDeg(Math.atan2(sSin,sCos)));
    const windSpeed = ((a.windSpeed||0)+(b.windSpeed||0))/2;
    let phase = 'cruise', legTas = state.tas;
    if(bAlt > aAlt + 50 && ac.climbSpeedKt){ phase = 'climb'; legTas = ac.climbSpeedKt; }
    else if(bAlt < aAlt - 50){ phase = 'descent'; legTas = state.descentTas || state.tas; }
    const { wca, hdgTrue, gs } = windTriangle(tc, legTas, windDir, windSpeed);
    const magHdg = norm360(hdgTrue - state.variation);
    const magTrack = norm360(tc - state.variation);
    const eteMin = (dist/gs)*60;
    cumMin += eteMin; cumNM += dist;
    const fuelRate = phase==='climb' ? (ac.climbUSGh ?? ac.cruiseUSGh ?? state.fuelParams.manualCruiseUSGh)
      : phase==='descent' ? (ac.descentUSGh ?? ac.cruiseUSGh ?? state.fuelParams.manualCruiseUSGh)
      : (ac.cruiseUSGh ?? state.fuelParams.manualCruiseUSGh);
    const fuelUSG = (eteMin/60) * fuelRate;
    cumFuelUSG += fuelUSG;
    let meaData = { maxElevFt:0, margin:1000, mea:0 };
    try{ meaData = await computeLegMEA(a,b); }catch(e){ meaError = true; }
    legs.push({ from:a.name, to:b.name, dist, tt:tc, mt:magTrack, windDir, windSpeed, wca,
      th:hdgTrue, mh:magHdg, gs, eteMin, cumMin, cumNM, phase, legTas, alt:bAlt, climbFpm,
      obstacleFt: meaData.maxElevFt, mea: meaData.mea, fuelUSG, cumFuelUSG });
  }
  state.legs = legs;
  {
    const oldNotes = state.legNotes || {};
    const newNotes = {};
    legs.forEach(l=>{
      const key = l.from+'→'+l.to;
      newNotes[key] = oldNotes[key] || {radio:'', nav:'', remarks:''};
    });
    state.legNotes = newNotes;
  }
  // Niveau de croisière auto : ce premier passage a utilisé le niveau encore en
  // vigueur (souvent provisoire) pour aller chercher le vent/MEA. On en déduit
  // maintenant le vrai niveau, et si ça change quelque chose on relance un passage
  // complet pour récupérer le vent au bon niveau et des segments montée/descente cohérents.
  if(state.flAutoMode && !isRecompute){
    const changed = applyAutoFL();
    if(changed){ await computeNavLog({isRecompute:true}); return; }
  }
  state.computeStatus = anyManualFallback
    ? {type:'err', msg:'Vent indisponible pour un ou plusieurs points (hors plage de prévision Open-Meteo) — saisis-le manuellement dans le tableau ci-dessus, puis recalcule.'}
    : {type:'ok', msg:'Log de nav calculé ✓ (vent Open-Meteo par point, altitude propre à chaque segment)'
        + (meaError ? ' — relief indisponible pour au moins un segment, MEA à vérifier manuellement sur la carte.' : '')
        + (state.flAutoMode ? ' — niveau de croisière ' + state.cruiseAlt + ' ft calculé automatiquement.' : '')};
  renderAll();
}

function renderAutoFlDetail(){

/* Inserts a TOD (Top of Descent) point on the last leg, using the 3:1 rule:
   distance (NM) = (alt initiale - alt cible) / 1000 * 3 */
/* Walks backward from waypoints[targetIdx] through preceding legs, accumulating distance,
   and returns the lat/lon that sits `distanceBackNM` before it, plus the array index
   at which the new point should be spliced in. Returns null if the route isn't long enough. */
function pointAtDistanceBeforeIndex(waypoints, targetIdx, distanceBackNM){
  let remaining = distanceBackNM;
  for(let i = targetIdx; i > 0; i--){
    const a = waypoints[i-1], b = waypoints[i];
    const legDist = distanceNM(a,b);
    if(remaining <= legDist){
      const tc = trueCourse(a,b);
      const pos = destinationPoint(a.lat, a.lon, tc, legDist - remaining);
      return { lat: pos.lat, lon: pos.lon, insertAt: i };
    }
    remaining -= legDist;
  }
  return null;
}
/* Mirror of pointAtDistanceBeforeIndex, but walking forward from a source index — used for TOC. */
function pointAtDistanceAfterIndex(waypoints, sourceIdx, distanceFwdNM){
  let remaining = distanceFwdNM;
  for(let i = sourceIdx; i < waypoints.length-1; i++){
    const a = waypoints[i], b = waypoints[i+1];
    const legDist = distanceNM(a,b);
    if(remaining <= legDist){
      const tc = trueCourse(a,b);
      const pos = destinationPoint(a.lat, a.lon, tc, remaining);
      return { lat: pos.lat, lon: pos.lon, insertAt: i+1 };
    }
    remaining -= legDist;
  }
  return null;
}
function todSuggestedDistance(targetIdx){
  if(targetIdx <= 0 || targetIdx >= state.waypoints.length) return null;
  const to = state.waypoints[targetIdx];
  const toAlt = to.alt ?? state.cruiseAlt;
  const fromAlt = state.cruiseAlt; // descent planned from the route's cruise level
  if(toAlt >= fromAlt) return null;
  const margin = state.todMarginNM ?? 2;
  const deltaFL = (fromAlt - toAlt) / 100;
  return Math.round((deltaFL / 3 + margin) * 10) / 10;
}
function insertTOD(){
  if(state.waypoints.length < 2){ showToast('Il faut au moins 2 points.'); return; }
  const targetIdx = state.todTargetIdx != null ? state.todTargetIdx : state.waypoints.length - 1;
  const to = state.waypoints[targetIdx];
  if(!to){ showToast('Point cible invalide.'); return; }
  const toAlt = to.alt ?? state.cruiseAlt;
  const fromAlt = state.cruiseAlt;
  if(toAlt >= fromAlt){ showToast('Le point cible n\'est pas plus bas que le niveau de croisière — règle son altitude avant d\'insérer le TOD.'); return; }
  const dist = state.todManualDistNM != null ? state.todManualDistNM : todSuggestedDistance(targetIdx);
  if(!dist || dist <= 0){ showToast('Distance TOD invalide.'); return; }
  const placement = pointAtDistanceBeforeIndex(state.waypoints, targetIdx, dist);
  if(!placement){ showToast('La route n\'est pas assez longue avant ce point pour placer le TOD à ' + dist.toFixed(1) + ' NM (réduis la distance ou choisis un point cible plus loin).'); return; }
  const id = uid++;
  state.waypoints.splice(placement.insertAt, 0, { id, name:'TOD', lat: placement.lat, lon: placement.lon,
    windDir:null, windSpeed:null, manual:false, alt: fromAlt });
  state.legs = [];
  state.todManualDistNM = null;
  renderAll();
  showToast('TOD inséré à ' + dist.toFixed(1) + ' NM avant ' + escapeHtml(to.name) + ' ✓');
}
function tocSuggestedDistance(sourceIdx){
  if(state.waypoints.length < 2 || sourceIdx < 0 || sourceIdx >= state.waypoints.length-1) return null;
  const from = state.waypoints[sourceIdx];
  const fromAlt = from.alt ?? 0;
  const toAlt = state.cruiseAlt;
  if(toAlt <= fromAlt) return null;
  const ac = AIRCRAFT_DB[state.aircraft];
  const climbFpm = (ac.climbFpmByTail && ac.climbFpmByTail[state.regTail]) || ac.climbFpmDefault;
  const climbKt = ac.climbSpeedKt;
  if(!climbFpm || !climbKt) return null;
  const timeMin = (toAlt-fromAlt)/climbFpm;
  return Math.round((climbKt*timeMin/60)*10)/10;
}
function insertTOC(){
  if(state.waypoints.length < 2){ showToast('Il faut au moins 2 points.'); return; }
  const sourceIdx = state.tocSourceIdx != null ? state.tocSourceIdx : 0;
  const from = state.waypoints[sourceIdx];
  if(!from){ showToast('Point source invalide.'); return; }
  const fromAlt = from.alt ?? 0;
  const toAlt = state.cruiseAlt;
  if(toAlt <= fromAlt){ showToast('Le niveau de croisière n\'est pas plus haut que le point source — règle les altitudes avant d\'insérer le TOC.'); return; }
  const dist = state.tocManualDistNM != null ? state.tocManualDistNM : tocSuggestedDistance(sourceIdx);
  if(!dist || dist <= 0){ showToast('Distance TOC invalide (vérifie la vitesse/taux de montée de l\'avion sélectionné).'); return; }
  const placement = pointAtDistanceAfterIndex(state.waypoints, sourceIdx, dist);
  if(!placement){ showToast('La route n\'est pas assez longue après ce point pour placer le TOC à ' + dist.toFixed(1) + ' NM (réduis la distance ou choisis un point source plus loin).'); return; }
  const id = uid++;
  state.waypoints.splice(placement.insertAt, 0, { id, name:'TOC', lat: placement.lat, lon: placement.lon,
    windDir:null, windSpeed:null, manual:false, alt: toAlt });
  state.legs = [];
  state.tocManualDistNM = null;
  renderAll();
  showToast('TOC inséré à ' + dist.toFixed(1) + ' NM après ' + escapeHtml(from.name) + ' ✓');
}

/* Computes the Alternate fuel (D) from the last route waypoint to the placed diversion point:
   distance/GS at cruise speed with fetched wind, plus a 15-min minimum approach allowance. */
async function computeAlternateFuel(){
  if(state.waypoints.length === 0){ showToast('Ajoute au moins ton point de destination sur la route.'); return; }
  if(!state.alternatePoint){ showToast('Place d\'abord le point de dégagement sur la carte ("Placer le dégagement").'); return; }
  const dest = state.waypoints[state.waypoints.length-1];
  const altn = state.alternatePoint;
  const dist = distanceNM(dest, altn);
  const tc = trueCourse(dest, altn);
  const ac = AIRCRAFT_DB[state.aircraft];
  const level = nearestLevel(dest.alt ?? state.cruiseAlt);
  let windDir = 0, windSpeed = 0, windNote = 'vent non disponible, calcul sans vent';
  try{
    const w = await fetchWindAtPoint((dest.lat+altn.lat)/2, (dest.lon+altn.lon)/2, level, state.eobtDate, state.eobtTime);
    windDir = w.dir; windSpeed = w.speed; windNote = `vent ${Math.round(w.dir)}°/${Math.round(w.speed)}kt`;
  }catch(e){}
  const { gs } = windTriangle(tc, state.tas, windDir, windSpeed);
  const eteMin = (dist/gs)*60;
  const approachMin = 15;
  const totalMin = eteMin + approachMin;
  const cruiseUSGh = ac.cruiseUSGh ?? state.fuelParams.manualCruiseUSGh;
  const fuelUSG = (totalMin/60) * cruiseUSGh;
  state.fuelParams.altnMin = Math.round(totalMin);
  state.fuelParams.altnUSG = Math.round(fuelUSG*10)/10;
  showToast(`Dégagement : ${dist.toFixed(1)} NM, ${windNote}, +15min approche → ${Math.round(totalMin)} min / ${fuelUSG.toFixed(1)} USG`);
  renderContent();
}

/* ============================= METAR / TAF (aviationweather.gov, free, no key) ============================= */
function weatherAirportList(){
  const set = new Set();
  [state.depIcao, state.destIcao, state.altnIcao].forEach(c => { if(c && c.trim()) set.add(c.trim().toUpperCase()); });
  state.weatherExtraIcao.forEach(c => { if(c && c.trim()) set.add(c.trim().toUpperCase()); });
  return Array.from(set);
}
async function refreshWeather(){
  const list = weatherAirportList();
  if(list.length===0){ showToast('Renseigne au moins un code OACI (Départ/Destination/Dégagement ou aérodrome ajouté).'); return; }
  state.weatherLoading = true;
  renderContent();
  const errors = [];
  let metars = {}, tafs = {};
  try{
    const res = await fetch(`https://aviationweather.gov/api/data/metar?ids=${list.join(',')}&format=json`);
    if(res.ok){ const data = await res.json(); data.forEach(m => { metars[m.icaoId] = m; }); }
    else errors.push('METAR: erreur HTTP ' + res.status);
  }catch(e){ errors.push('METAR: requête échouée (' + e.message + ')'); }
  try{
    const res = await fetch(`https://aviationweather.gov/api/data/taf?ids=${list.join(',')}&format=json`);
    if(res.ok){ const data = await res.json(); data.forEach(t => { tafs[t.icaoId] = t; }); }
    else errors.push('TAF: erreur HTTP ' + res.status);
  }catch(e){ errors.push('TAF: requête échouée (' + e.message + ')'); }
  state.weatherData = { metars, tafs, fetchedAt: new Date(), errors };
  state.weatherLoading = false;
  renderContent();
}
function fltCatColor(cat){
  if(cat==='VFR') return '#4fd1a5';
  if(cat==='MVFR') return '#5b8cff';
  if(cat==='IFR') return '#e0a856';
  if(cat==='LIFR') return '#e0685f';
  return '#6b7385';
}
function minutesAgo(iso){
  if(!iso) return null;
  return Math.round((Date.now() - new Date(iso).getTime())/60000);
}

  bind('in-time','eobtTime',false);
  bind('in-var','variation',true);
  bind('in-boarding','boardingTime',false);
  bind('in-crew','crew',true);

  const bindBool = (id, key) => {

  if(inTodDist) inTodDist.addEventListener('change', e=>{
    state.todManualDistNM = e.target.value === '' ? null : parseFloat(e.target.value);

  const btnInsertToc = document.getElementById('btn-insert-toc');
  if(btnInsertToc) btnInsertToc.onclick = insertTOC;
  const inTocSource = document.getElementById('in-toc-source');
  if(inTocSource) inTocSource.addEventListener('change', e=>{

  });
  const inTocDist = document.getElementById('in-toc-dist');
  if(inTocDist) inTocDist.addEventListener('change', e=>{
    state.tocManualDistNM = e.target.value === '' ? null : parseFloat(e.target.value);
    renderContent();
  });
  const btnAutoFl = document.getElementById('btn-auto-fl');
  if(btnAutoFl) btnAutoFl.onclick = computeAutoFL;
  const btnFlAuto = document.getElementById('btn-fl-auto');
  if(btnFlAuto) btnFlAuto.onclick = ()=>{ state.flAutoMode = true; renderContent(); };
  const btnFlManual = document.getElementById('btn-fl-manual');
  if(btnFlManual) btnFlManual.onclick = ()=>{ state.flAutoMode = false; renderContent(); };

/* ---------- waypoints table ---------- */
function renderWaypointTable(){
  if(state.waypoints.length===0){
    return `<div class="empty-state">Aucun point pour l'instant — clique sur la carte ci-dessus pour placer ton premier point (départ).</div>`;
  }
  const rows = state.waypoints.map((wp,i)=>`
    <tr data-wid="${wp.id}">
      <td style="color:var(--text-2);">${i+1}</td>
      <td><input class="wp-name-input" data-field="name" value="${escapeHtml(wp.name)}"></td>
      <td>${wp.lat.toFixed(4)}</td>
      <td>${wp.lon.toFixed(4)}</td>
      <td><input data-field="alt" type="number" step="50" value="${wp.alt ?? state.cruiseAlt}" style="width:64px;"> ft</td>
      <td>
        <input data-field="windDir" type="number" min="0" max="360" step="1" value="${wp.windDir ?? ''}" placeholder="dir° True" style="width:56px;">
        <span class="${wp.manual ? 'manual-tag':'auto-tag'}">${wp.manual?'manuel':'auto'}</span>
        ${wp.manual ? `<button class="small-btn" data-act="reset-auto" title="Repasser en auto (revient chercher le vent Open-Meteo au prochain calcul)">↺ auto</button>` : ''}
      </td>
      <td><input data-field="windSpeed" type="number" min="0" value="${wp.windSpeed ?? ''}" placeholder="kt" style="width:50px;"></td>
      <td>
        <button class="small-btn" data-act="up" title="Monter">↑</button>
        <button class="small-btn" data-act="down" title="Descendre">↓</button>
        <button class="small-btn" data-act="del" title="Supprimer">✕</button>
      </td>
    </tr>`).join('');
  return `<table>
    <thead><tr><th>#</th><th>Nom</th><th>Lat</th><th>Lon</th><th>Alt</th><th>Vent dir (° True)</th><th>Vent (kt)</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}
function wireWaypointRowEvents(){
  document.querySelectorAll('#content tr[data-wid]').forEach(tr=>{
    const id = parseInt(tr.dataset.wid);
    tr.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('change', e=>{
        const wp = state.waypoints.find(w=>w.id===id);
        const field = e.target.dataset.field;
        if(field==='name'){ wp.name = e.target.value || wp.name; renderMapMarkers(); }
        else if(field==='windDir'){
          if(e.target.value === ''){ wp.windDir = null; }
          else{
            let v = parseFloat(e.target.value);
            if(isNaN(v)) v = 0;
            v = ((v % 360) + 360) % 360; // clamp into [0,360), reject negatives by wrapping
            wp.windDir = v;
          }
          wp.manual = true;
          renderContent();
        }
        else if(field==='windSpeed'){
          let v = e.target.value === '' ? null : parseFloat(e.target.value);
          if(v !== null && (isNaN(v) || v < 0)) v = 0;
          wp.windSpeed = v;
          wp.manual = true;
          renderContent();
        }
        else if(field==='alt'){
          let v = parseFloat(e.target.value);
          if(isNaN(v)) v = state.cruiseAlt;
          wp.alt = v;
          state.legs = [];
          renderContent();
        }
        else{ wp[field] = e.target.value === '' ? null : parseFloat(e.target.value); wp.manual = true; renderContent(); }
      });
    });
    tr.querySelectorAll('button[data-act]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = state.waypoints.findIndex(w=>w.id===id);
        const act = btn.dataset.act;
        if(act==='del'){ state.waypoints.splice(idx,1); }
        else if(act==='up' && idx>0){ [state.waypoints[idx-1],state.waypoints[idx]]=[state.waypoints[idx],state.waypoints[idx-1]]; }
        else if(act==='down' && idx<state.waypoints.length-1){ [state.waypoints[idx+1],state.waypoints[idx]]=[state.waypoints[idx],state.waypoints[idx+1]]; }
        else if(act==='reset-auto'){
          const wp = state.waypoints[idx];
          wp.manual = false; wp.windError = false;
          showToast('Repassé en auto — reclique sur "Calculer le log de nav" pour récupérer le vent Open-Meteo.');
        }
        state.legs = [];
        renderAll();
      });
    });
  });
}

/* ---------- nav log table ---------- */
function renderNavLogTable(){
  if(state.legs.length===0){
    return `<div class="empty-state">Clique sur « Calculer le log de nav » une fois tes points placés.</div>`;
  }
  const rows = state.legs.map(l=>{
    const phaseIcon = l.phase==='climb' ? '↑' : l.phase==='descent' ? '↓' : '→';
    const phaseTitle = l.phase==='climb' ? `Montée ${l.climbFpm||''} ft/min @ ${l.legTas}kt` : l.phase==='descent' ? `Descente @ ${l.legTas}kt` : `Croisière @ ${l.legTas}kt`;
    const key = l.from+'→'+l.to;
    const n = state.legNotes[key] || {radio:'', nav:'', remarks:''};
    return `
    <tr>
      <td style="color:var(--text-0);font-family:'Inter',sans-serif;">${escapeHtml(l.from)} → ${escapeHtml(l.to)}</td>
      <td>${l.dist.toFixed(1)} NM</td>
      <td title="${phaseTitle}">${Math.round(l.alt)} ft ${phaseIcon}</td>
      <td>${Math.round(l.tt)}°</td>
      <td>${Math.round(l.mt)}°</td>
      <td>${Math.round(l.windDir)}°/${Math.round(l.windSpeed)}kt</td>
      <td>${Math.round(l.wca)>=0?'+':''}${Math.round(l.wca)}°</td>
      <td>${Math.round(l.th)}°</td>
      <td style="color:var(--accent);font-weight:700;">${Math.round(l.mh)}°</td>
      <td>${Math.round(l.gs)} kt</td>
      <td>${fmtMin(l.eteMin)}</td>
      <td>${fmtMin(l.cumMin)}</td>
      <td style="color:var(--warn);">${Math.round(l.mea)} ft</td>
      <td>${l.fuelUSG.toFixed(1)} USG</td>
      <td><textarea data-legnote-key="${escapeHtml(key)}" data-legnote-field="radio" placeholder="Nice Info : 120.850" style="width:160px;min-height:44px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;resize:vertical;">${escapeHtml(n.radio)}</textarea></td>
      <td><textarea data-legnote-key="${escapeHtml(key)}" data-legnote-field="nav" placeholder="CNM 115.95 R170" style="width:160px;min-height:44px;font-family:var(--mono);font-size:11px;white-space:pre-wrap;resize:vertical;">${escapeHtml(n.nav)}</textarea></td>
      <td><textarea data-legnote-key="${escapeHtml(key)}" data-legnote-field="remarks" placeholder="…" style="width:160px;min-height:44px;font-size:11px;white-space:pre-wrap;resize:vertical;">${escapeHtml(n.remarks)}</textarea></td>
    </tr>`;}).join('');
  const total = state.legs[state.legs.length-1];
  return `<table>
    <thead><tr><th>Segment</th><th>Dist</th><th>Alt</th><th>TT</th><th>MT</th><th>Wind</th><th>WCA</th><th>TH</th><th>MH</th><th>GS</th><th>ETE</th><th>Cumul</th><th>MEA</th><th>Fuel</th><th>Radio</th><th>Nav</th><th>Remarks</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr class="total-row"><td>TOTAL</td><td>${total.cumNM.toFixed(1)} NM</td><td colspan="9"></td><td>${fmtMin(total.cumMin)}</td><td>max ${Math.round(Math.max(...state.legs.map(l=>l.mea)))} ft</td><td>${total.cumFuelUSG.toFixed(1)} USG</td><td colspan="3"></td></tr></tfoot>
    </table>`;
}
function wireNavLogNotes(){
  document.querySelectorAll('[data-legnote-key]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const key = e.target.dataset.legnoteKey, field = e.target.dataset.legnoteField;
      if(!state.legNotes[key]) state.legNotes[key] = {radio:'', nav:'', remarks:''};
      state.legNotes[key][field] = e.target.value;
    });
  });
}

function renderFuelSection(){

  return `
    <div class="perf-tabs" style="margin-bottom:14px;">
      <button class="btn ${mode==='cat'?'btn-primary':''}" id="btn-fuelmode-cat" type="button">Part-CAT</button>
      <button class="btn ${mode==='nco'?'btn-primary':''}" id="btn-fuelmode-nco" type="button">Part-NCO</button>
    </div>
    ${mode==='cat' ? renderFuelTable() : renderFuelTableNco()}

function wireFuelModeToggle(){
  const btnCat = document.getElementById('btn-fuelmode-cat');
  const btnNco = document.getElementById('btn-fuelmode-nco');
  if(btnCat) btnCat.onclick = ()=>{ state.fuelMode='cat'; renderContent(); };
  if(btnNco) btnNco.onclick = ()=>{ state.fuelMode='nco'; renderContent(); };
}
function renderFuelTable(){
  const ac = AIRCRAFT_DB[state.aircraft];
  const fp = state.fuelParams;
  const cruiseUSGh = ac.cruiseUSGh != null ? ac.cruiseUSGh : fp.manualCruiseUSGh;
  const taxiUSG = ac.taxiUSG != null ? ac.taxiUSG : fp.manualTaxiUSG;
  const finalReserveUSG = ac.finalReserveUSG != null ? ac.finalReserveUSG : fp.manualFinalReserveUSG;

  if(state.legs.length===0){
    return `<div class="empty-state">Calcule d'abord le log de nav pour obtenir le Trip Fuel.</div>`;
  }
  const tripMin = state.legs[state.legs.length-1].cumMin;
  const tripUSG = state.legs.reduce((s,l)=>s+l.fuelUSG, 0);
  const contUSG = tripUSG * (fp.contingencyPct/100);
  const minReq = taxiUSG + tripUSG + contUSG + fp.altnUSG + finalReserveUSG + fp.additionalUSG + fp.extraUSG;
  state._lastFuelTotalUSG = minReq; // used to prefill M&B

  const cruiseInput = ac.cruiseUSGh != null
    ? `${ac.cruiseUSGh} USG/h (${ac.cruisePct})${ac.climbUSGh!=null?', montée '+ac.climbUSGh+' USG/h':''}${ac.descentUSGh!=null?', descente '+ac.descentUSGh+' USG/h':''}`
    : `<input data-fp="manualCruiseUSGh" type="number" step="0.1" value="${fp.manualCruiseUSGh}" style="width:60px;"> USG/h <span class="manual-tag">à saisir</span>`;
  const taxiInput = ac.taxiUSG != null ? ac.taxiUSG.toFixed(1)
    : `<input data-fp="manualTaxiUSG" type="number" step="0.1" value="${fp.manualTaxiUSG}" style="width:50px;">`;
  const reserveInput = ac.finalReserveUSG != null ? ac.finalReserveUSG.toFixed(1)
    : `<input data-fp="manualFinalReserveUSG" type="number" step="0.1" value="${fp.manualFinalReserveUSG}" style="width:50px;"> <span class="manual-tag">à saisir</span>`;

  return `
  <table>
    <thead><tr><th></th><th>Poste</th><th>Min</th><th>USG</th></tr></thead>
    <tbody>
      <tr><td>A</td><td>Taxi fuel</td><td>—</td><td>${taxiInput}</td></tr>
      <tr><td>B</td><td>Trip fuel (conso ${cruiseInput})</td><td>${fmtMin(tripMin)}</td><td>${tripUSG.toFixed(1)}</td></tr>
      <tr><td>C</td><td>Contingency (${fp.contingencyPct}% trip)</td><td>—</td><td>${contUSG.toFixed(1)}</td></tr>
      <tr><td>D</td><td>Alternate fuel <input data-fp="altnMin" type="number" value="${fp.altnMin}" style="width:40px;">min /
        <input data-fp="altnUSG" type="number" step="0.1" value="${fp.altnUSG}" style="width:44px;">USG
        <button class="small-btn" id="btn-calc-altn" title="Calcule à partir du point de dégagement placé sur la carte" style="border:1px solid var(--border);padding:2px 6px;">🧮 Calculer</button></td>
        <td>${fp.altnMin}</td><td>${fp.altnUSG.toFixed(1)}</td></tr>
      <tr><td>E</td><td>Final reserve</td><td>${ac.finalReserveMin}</td><td>${reserveInput}</td></tr>
      <tr><td>F</td><td>Additional fuel <input data-fp="additionalUSG" type="number" step="0.1" value="${fp.additionalUSG}" style="width:46px;">USG</td>
        <td>—</td><td>${fp.additionalUSG.toFixed(1)}</td></tr>
      <tr><td>G</td><td>Extra fuel <input data-fp="extraUSG" type="number" step="0.1" value="${fp.extraUSG}" style="width:46px;">USG</td>
        <td>—</td><td>${fp.extraUSG.toFixed(1)}</td></tr>
      <tr class="total-row"><td>H</td><td>Minimum required fuel</td><td>—</td><td>${minReq.toFixed(1)} USG</td></tr>
    </tbody>
  </table>
  <div class="status-line">Carburant : ${ac.fuelType}. Ajuste D/F/G selon ton dégagement réel. Ce total (H) peut être repris comme carburant embarqué dans le Mass &amp; Balance ci-dessous.</div>
  <button class="btn" id="btn-fuel-to-mnb" style="margin-top:8px;">↓ Reprendre ${minReq.toFixed(1)} USG dans le Mass &amp; Balance</button>
  `;
}
function wireFuelInputs(){
  document.querySelectorAll('[data-fp]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      state.fuelParams[e.target.dataset.fp] = parseFloat(e.target.value)||0;
      renderContent();
    });
  });

/* ---------- Mass & Balance ---------- */
function pointInPolygon(pt, poly){
  let inside = false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    const intersect = ((yi>pt[1]) !== (yj>pt[1])) && (pt[0] < (xj-xi)*(pt[1]-yi)/(yj-yi)+xi);
    if(intersect) inside = !inside;
  }
  return inside;
}
function computeMnB(){
  const ac = AIRCRAFT_DB[state.aircraft];
  const reg = ac.registrations.find(r=>r.tail===state.regTail) || ac.registrations[0];
  const emptyMass = reg.mass, emptyMoment = reg.moment;

  let zfMass = emptyMass, zfMoment = emptyMoment;
  const stationRows = ac.stations.map(s=>{
    const mass = state.mnb.stations[s.key] || 0;
    zfMass += mass; zfMoment += mass*s.arm;
    return { ...s, mass };
  });

  let toMass = zfMass, toMoment = zfMoment, fuelMassTotal = 0;
  const fuelRows = ac.fuelStations.map(f=>{
    const usg = state.mnb.fuel[f.key] || 0;
    const kg = usg * ac.kgPerUSG;
    fuelMassTotal += kg;
    toMass += kg; toMoment += kg*f.arm;
    return { ...f, usg, kg };
  });
  const toArm = toMass>0 ? toMoment/toMass : 0;

  // landing = takeoff minus trip fuel burn (from computed nav log if available), burned from MAIN tank arm
  const tripMin = state.legs.length ? state.legs[state.legs.length-1].cumMin : 0;
  const cruiseUSGh = ac.cruiseUSGh != null ? ac.cruiseUSGh : state.fuelParams.manualCruiseUSGh;
  const burnUSG = (tripMin/60) * (cruiseUSGh||0);
  const burnKg = burnUSG * ac.kgPerUSG;
  const mainArm = ac.fuelStations[0].arm;
  const ldgMass = Math.max(toMass - burnKg, zfMass);
  const ldgMoment = toMoment - burnKg*mainArm;
  const ldgArm = ldgMass>0 ? ldgMoment/ldgMass : 0;

  return { ac, reg, emptyMass, emptyMoment, stationRows, fuelRows, fuelMassTotal,
    zfMass, zfMoment, toMass, toMoment, toArm, burnKg, ldgMass, ldgArm };
}

function limitBar(val, max){
  if(max == null) return '';
  const pct = Math.min(100, (val/max)*100);
  return `<div class="limit-bar"><div class="limit-fill ${val>max?'over':''}" style="width:${pct}%;"></div></div>`;
}

function envelopeSVG(ac, points){
  const allX = ac.envelope.map(p=>p[0]).concat(points.map(p=>p.cg));
  const allY = ac.envelope.map(p=>p[1]).concat(points.map(p=>p.mass));
  const xmin = Math.min(...allX)-0.03, xmax = Math.max(...allX)+0.03;
  const ymin = Math.min(...allY)-60, ymax = Math.max(...allY)+60;
  const W=300,H=220,padL=46,padB=26,padT=10,padR=10;
  const sx = x => padL + (x-xmin)/(xmax-xmin) * (W-padL-padR);
  const sy = y => (H-padB) - (y-ymin)/(ymax-ymin) * (H-padB-padT);
  const poly = ac.envelope.map(p=>`${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(' ');
  let gridY = '';
  const ySteps = 4;
  for(let i=0;i<=ySteps;i++){
    const yv = ymin + (ymax-ymin)*i/ySteps;
    gridY += `<line x1="${padL}" y1="${sy(yv).toFixed(1)}" x2="${W-padR}" y2="${sy(yv).toFixed(1)}" stroke="#232834" stroke-width="1"/>
      <text x="${padL-6}" y="${(sy(yv)+3).toFixed(1)}" font-size="8.5" fill="#6b7385" text-anchor="end">${Math.round(yv)}</text>`;
  }
  const xSteps = 4;
  let gridX = '';
  for(let i=0;i<=xSteps;i++){
    const xv = xmin + (xmax-xmin)*i/xSteps;
    gridX += `<text x="${sx(xv).toFixed(1)}" y="${H-padB+14}" font-size="8.5" fill="#6b7385" text-anchor="middle">${xv.toFixed(2)}</text>`;
  }
  const pointsSVG = points.map((p,pi)=>{
    // takeoff (first point) drawn larger as a ring so it stays visible even when landing sits exactly on top of it
    const r = pi===0 ? 7 : 4;
    const strokeW = pi===0 ? 2.5 : 1.5;
    return `<line x1="${padL}" y1="${sy(p.mass).toFixed(1)}" x2="${sx(p.cg).toFixed(1)}" y2="${sy(p.mass).toFixed(1)}" stroke="${p.color}" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="${sx(p.cg).toFixed(1)}" y1="${sy(p.mass).toFixed(1)}" x2="${sx(p.cg).toFixed(1)}" y2="${H-padB}" stroke="${p.color}" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="${sx(p.cg).toFixed(1)}" cy="${sy(p.mass).toFixed(1)}" r="${r}" fill="${pi===0?'none':p.color}" stroke="${p.color}" stroke-width="${strokeW}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--bg-0);border-radius:8px;">
    ${gridY}${gridX}
    <polygon points="${poly}" fill="rgba(79,209,165,0.10)" stroke="#4fd1a5" stroke-width="1.5"/>
    ${pointsSVG}
    <text x="${W/2}" y="${H-4}" font-size="9" fill="#6b7385" text-anchor="middle">Bras de levier (m)</text>
  </svg>`;
}

function renderMnBSection(){
  const ac = AIRCRAFT_DB[state.aircraft];
  const r = computeMnB();

  const stationInputs = r.stationRows.map(s=>`
    <div class="field">
      <label>${escapeHtml(s.label)} (kg)${s.max?` · max ${s.max}`:''}</label>
      <input data-mnb-station="${s.key}" type="number" value="${s.mass}">
      ${s.max ? limitBar(s.mass, s.max) : ''}
    </div>`).join('');

  const fuelInputs = r.fuelRows.map(f=>`
    <div class="field">
      <label>${escapeHtml(f.label)} (USG) · max ${f.usableUSG}</label>
      <input data-mnb-fuel="${f.key}" type="number" step="0.5" value="${f.usg}">
      <span class="status-line" style="margin:2px 0 0 0;">${f.kg.toFixed(1)} kg</span>
      ${limitBar(f.usg, f.usableUSG)}
    </div>`).join('');

  const zfOver = ac.maxZFM!=null && r.zfMass > ac.maxZFM;
  const toOver = r.toMass > ac.maxTOM;
  const ldOver = r.ldgMass > ac.maxLDG;
  const toInside = pointInPolygon([r.toArm, r.toMass], ac.envelope);
  const ldInside = pointInPolygon([r.ldgArm, r.ldgMass], ac.envelope);

  return `
  <div class="mnb-grid">
    <div>
      <div class="status-line" style="margin-bottom:10px;">Masse à vide ${escapeHtml(r.reg.tail)} : <b style="color:var(--text-0);">${r.emptyMass} kg</b> (bras ${(r.emptyMoment/r.emptyMass).toFixed(3)} m)</div>
      <div class="field-row">${stationInputs}</div>
      <div class="field-row" style="margin-top:12px;">${fuelInputs}</div>

      <table style="margin-top:16px;">
        <thead><tr><th></th><th>Masse (kg)</th><th>Bras (m)</th><th>Moment (m.kg)</th><th>Limite</th></tr></thead>
        <tbody>
          ${ac.maxZFM!=null ? `<tr><td>ZFM</td><td>${r.zfMass.toFixed(1)}</td><td>${(r.zfMoment/r.zfMass).toFixed(3)}</td><td>${r.zfMoment.toFixed(1)}</td>
            <td class="${zfOver?'bad-tag':'ok-tag'}">${zfOver?'✗ '+ac.maxZFM+' kg':'✓ max '+ac.maxZFM+' kg'}</td></tr>` : ''}
          <tr><td>TOM</td><td>${r.toMass.toFixed(1)}</td><td>${r.toArm.toFixed(3)}</td><td>${r.toMoment.toFixed(1)}</td>
            <td class="${toOver?'bad-tag':'ok-tag'}">${toOver?'✗ '+ac.maxTOM+' kg':'✓ max '+ac.maxTOM+' kg'}</td></tr>
          <tr><td>LDM (estimée)</td><td>${r.ldgMass.toFixed(1)}</td><td>${r.ldgArm.toFixed(3)}</td><td>—</td>
            <td class="${ldOver?'bad-tag':'ok-tag'}">${ldOver?'✗ '+ac.maxLDG+' kg':'✓ max '+ac.maxLDG+' kg'}</td></tr>
        </tbody>
      </table>
      <div class="status-line">LDM estimée = TOM − carburant consommé sur le trip (${r.burnKg.toFixed(1)} kg, à partir du log de nav). Centrage T/O : <span class="${toInside?'ok-tag':'bad-tag'}">${toInside?'✓ dans l’enveloppe':'✗ hors enveloppe'}</span> · Centrage LDG : <span class="${ldInside?'ok-tag':'bad-tag'}">${ldInside?'✓ dans l’enveloppe':'✗ hors enveloppe'}</span></div>
    </div>
    <div>
      ${envelopeSVG(ac, [
        {cg:r.toArm, mass:r.toMass, color:'#5b8cff'},
        {cg:r.ldgArm, mass:r.ldgMass, color:'#e0a856'}
      ])}
      <div class="status-line"><span style="color:#5b8cff;">◯</span> Décollage &nbsp; <span style="color:#e0a856;">●</span> Atterrissage (estimé) &nbsp;— si le carburant consommé est nul (log de nav pas encore calculé), les deux points sont identiques et le point d'atterrissage s'affiche au centre de l'anneau de décollage.</div>
    </div>
  </div>`;
}

  const emptyMsg = (!showAll && icaos.length===0) ? `<div class="status-line" style="margin-bottom:8px;">Aucun terrain du vol en cours (Départ/Destination/Dégagement) n'est dans ta base — clique ci-dessus pour voir tous les terrains enregistrés, ou ajoute-en un.</div>` : '';
  return `

/* ---------- eAIP France (SIA) : source officielle des distances déclarées ---------- */
function airacCycleUrl(icao){
  const MONS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const anchor = Date.UTC(2026,7,6); // 06 AUG 2026 = début de cycle AIRAC connu (2609)
  const msPerCycle = 28*24*3600*1000;
  const now = Date.now();
  const cycles = Math.floor((now-anchor)/msPerCycle);
  const start = new Date(anchor + cycles*msPerCycle);
  const dd=String(start.getUTCDate()).padStart(2,'0');
  const mon=MONS[start.getUTCMonth()];
  const yyyy=start.getUTCFullYear();
  const mm=String(start.getUTCMonth()+1).padStart(2,'0');
  return `https://www.sia.aviation-civile.gouv.fr/media/dvd/eAIP_${dd}_${mon}_${yyyy}/FRANCE/AIRAC-${yyyy}-${mm}-${dd}/html/eAIP/FR-AD-2.${icao.toUpperCase()}-fr-FR.html`;
}
async function perfFetchEAIP(icao){
  const key = icao.toUpperCase();
  if(state.perf.eaipCache[key] !== undefined) return state.perf.eaipCache[key];
  const url = airacCycleUrl(key);
  try{
    const res = await fetch(url);
    if(!res.ok){ const r={ok:false,url,reason:'http_'+res.status}; state.perf.eaipCache[key]=r; return r; }
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const tables = Array.from(doc.querySelectorAll('table'));
    let target=null, headerRow=null;
    outer: for(const t of tables){
      for(const r of Array.from(t.querySelectorAll('tr'))){
        const cells = Array.from(r.querySelectorAll('th,td')).map(c=>c.textContent.trim().toUpperCase());
        if(cells.includes('TORA') && cells.includes('LDA')){ target=t; headerRow=cells; break outer; }
      }
    }
    if(!target){ const r={ok:false,url,reason:'table_not_found'}; state.perf.eaipCache[key]=r; return r; }
    const idx = { rwy: headerRow.findIndex(c=>c.includes('RWY')), tora: headerRow.indexOf('TORA'),
      toda: headerRow.indexOf('TODA'), asda: headerRow.indexOf('ASDA'), lda: headerRow.indexOf('LDA') };
    const num=(s)=>{ const v=parseFloat((s||'').replace(/[^\d.]/g,'')); return isNaN(v)?null:v; };
    const runways=[];
    for(const r of Array.from(target.querySelectorAll('tr'))){
      const cells = Array.from(r.querySelectorAll('th,td')).map(c=>c.textContent.trim());
      if(cells.length<4) continue;
      const rwyId = cells[idx.rwy];
      if(!rwyId || !/^\d{2}[LCR]?$/.test(rwyId)) continue;
      runways.push({ designator:rwyId, tora:num(cells[idx.tora]), toda:num(cells[idx.toda]), asda:num(cells[idx.asda]), lda:num(cells[idx.lda]) });
    }
    const r = runways.length ? {ok:true,url,runways} : {ok:false,url,reason:'no_rows'};
    state.perf.eaipCache[key]=r; return r;
  }catch(e){
    const r={ok:false,url,reason:'fetch_error'}; state.perf.eaipCache[key]=r; return r;
  }
}
/* ---------- OpenAIP : géométrie piste (QFU, altitude) + repli distances si eAIP indisponible ---------- */
async function perfFetchAirport(icao){
  if(!icao) return null;
  const key = icao.toUpperCase();
  if(state.perf.oaCache[key] !== undefined) return state.perf.oaCache[key];
  if(!state.openaipApiKey){ state.perf.oaCache[key] = null; return null; }
  try{
    const url = `https://api.core.openaip.net/api/airports?search=${encodeURIComponent(key)}&apiKey=${encodeURIComponent(state.openaipApiKey)}`;
    const res = await fetch(url);
    if(!res.ok){ state.perf.oaCache[key] = null; return null; }
    const data = await res.json();
    const items = data.items || data || [];
    const airport = items.find(a => (a.icaoCode||'').toUpperCase() === key) || items[0] || null;
    state.perf.oaCache[key] = airport;
    return airport;
  }catch(e){ state.perf.oaCache[key] = null; return null; }
}
/* Extrait TWR/AFIS/ATIS/GND/INFO d'un objet aéroport OpenAIP (déjà en cache via perfFetchAirport).
   Défensif : le champ "type" peut être une chaîne ("TWR") ou un code numérique selon les endpoints —
   on filtre donc aussi sur le "name" (toujours une chaîne lisible, ex. "Nice Tower") pour ne rien rater. */
function extractRelevantFrequencies(airport){
  const freqs = (airport && airport.frequencies) || [];
  const keyword = /twr|tower|afis|atis|gnd|ground|info/i;
  return freqs
    .filter(f => f && f.value != null && (keyword.test(String(f.type||'')) || keyword.test(String(f.name||''))))
    .map(f => ({ name: f.name || String(f.type||'').toUpperCase(), value: Number(f.value) }))
    .filter(f => !isNaN(f.value));
}
async function fillDepArrFrequencies(){
  if(!state.openaipApiKey){ showToast('Renseigne ta clé OpenAIP (carte, plus haut) pour activer la récupération de fréquences.'); return; }
  if(state.legs.length===0){ showToast('Calcule d\'abord le log de nav.'); return; }
  const dep = (state.depIcao||'').trim().toUpperCase();
  const dest = (state.destIcao||'').trim().toUpperCase();
  if(!dep && !dest){ showToast('Renseigne au moins le départ ou la destination (Flight Info).'); return; }
  let filled = 0;
  if(dep){
    const airport = await perfFetchAirport(dep);
    const freqs = extractRelevantFrequencies(airport);
    if(freqs.length){
      const key = state.legs[0].from+'→'+state.legs[0].to;
      if(!state.legNotes[key]) state.legNotes[key] = {radio:'', nav:'', remarks:''};
      const lines = freqs.map(f=>`${f.name} : ${f.value.toFixed(3)}`).join('\n');
      state.legNotes[key].radio = state.legNotes[key].radio ? (lines+'\n'+state.legNotes[key].radio) : lines;
      filled++;
    }
  }
  if(dest){
    const airport = await perfFetchAirport(dest);
    const freqs = extractRelevantFrequencies(airport);
    if(freqs.length){
      const lastLeg = state.legs[state.legs.length-1];
      const key = lastLeg.from+'→'+lastLeg.to;
      if(!state.legNotes[key]) state.legNotes[key] = {radio:'', nav:'', remarks:''};
      const lines = freqs.map(f=>`${f.name} : ${f.value.toFixed(3)}`).join('\n');
      state.legNotes[key].radio = state.legNotes[key].radio ? (state.legNotes[key].radio+'\n'+lines) : lines;
      filled++;
    }
  }
  renderContent();
  if(filled>0) showToast(`Fréquences OpenAIP ajoutées dans la colonne Radio (${filled} terrain${filled>1?'s':''}) ✓ — à vérifier.`);
  else showToast('Aucune fréquence TWR/AFIS/ATIS/GND trouvée dans OpenAIP pour ce(s) terrain(s).');
}
async function perfOpenPicker(slot){
  const icao = slot==='dep' ? state.depIcao : slot==='dest' ? state.destIcao : state.altnIcao;
  if(!icao){ showToast('Renseigne d\'abord le code OACI correspondant en haut de la fiche vol.'); return; }
  const key = icao.toUpperCase();
  const manual = (state.perf.rwyDB||{})[key];
  if(manual && manual.runways && manual.runways.length){
    // Base vérifiée manuellement : aucune requête réseau, aucun souci CORS, priorité absolue.
    state.perf.oaPicker = { slot, icao:key, name:manual.name||null, elevM:null, manual,
      designators: manual.runways.map(r=>r.designator).filter(Boolean),
      eaip:{ok:false}, openaipRunways:[] };
    renderContent();
    return;
  }
  state.perf.oaLoading = true; state.perf.oaPicker = null; renderContent();
  const [airport, eaip] = await Promise.all([
    state.openaipApiKey ? perfFetchAirport(icao) : Promise.resolve(null),
    perfFetchEAIP(icao)
  ]);
  state.perf.oaLoading = false;
  // Construit la liste des pistes à afficher : priorité aux désignateurs eAIP (officiel),
  // complétée par OpenAIP pour l'altitude terrain (donnée géométrique fiable).
  const elevM = airport && airport.elevation ? airport.elevation.value : null;
  let designators = [];
  if(eaip.ok) designators = eaip.runways.map(r=>r.designator);
  else if(airport) designators = (airport.runways||[]).filter(r=>r.operations===0).map(r=>r.designator);
  if(designators.length===0){
    showToast(`Aucune donnée trouvée pour ${icao.toUpperCase()} (ni base manuelle, ni eAIP officiel, ni OpenAIP).`);
    renderContent(); return;
  }
  state.perf.oaPicker = { slot, icao: icao.toUpperCase(), name: airport?airport.name:null,
    elevM, manual:null, designators, eaip, openaipRunways: airport ? (airport.runways||[]) : [] };
  renderContent();
}
function perfApplyRunway(designator){
  const p = state.perf.oaPicker;
  if(!p) return;
  const qfu = parseInt(designator, 10) * 10;
  state.perf.qfu = qfu;

  if(p.manual){
    const rwy = p.manual.runways.find(r=>r.designator===designator);
    if(!rwy) return;
    if(p.manual.elevFt != null) state.perf.elev = Math.round(p.manual.elevFt);
    if(rwy.tora!=null) state.perf.tora = Math.round(rwy.tora);
    if(rwy.lda!=null) state.perf.lda = Math.round(rwy.lda);
    state.perf.oaApplied = { source:'manual', icao:p.icao, designator,
      tora:rwy.tora, toda:rwy.toda, asda:rwy.asda, lda:rwy.lda, note:p.manual.note };
    state.perf.oaPicker = null;
    renderContent();
    showToast(`Piste ${designator} de ${p.icao} : QFU, altitude, TORA et LDA appliqués (base vérifiée manuellement) ✓`);
    return;
  }
  if(p.elevM != null) state.perf.elev = Math.round(p.elevM * 3.28084);

  const eaipRwy = p.eaip.ok ? p.eaip.runways.find(r=>r.designator===designator) : null;
  if(eaipRwy){
    // Source officielle disponible : on applique directement TORA/LDA.
    if(eaipRwy.tora!=null) state.perf.tora = Math.round(eaipRwy.tora);
    if(eaipRwy.lda!=null) state.perf.lda = Math.round(eaipRwy.lda);
    state.perf.oaApplied = { source:'eaip', icao:p.icao, designator, url:p.eaip.url,
      tora:eaipRwy.tora, toda:eaipRwy.toda, asda:eaipRwy.asda, lda:eaipRwy.lda };
    showToast(`Piste ${designator} de ${p.icao} : QFU, altitude, TORA et LDA appliqués (eAIP officiel) ✓`);
  }else{
    // eAIP indisponible pour ce terrain (CORS, cycle introuvable...) : repli OpenAIP, pas d'auto-apply des distances.
    const rwy = p.openaipRunways.find(r=>r.designator===designator);
    const lenM = rwy && rwy.dimension && rwy.dimension.length ? rwy.dimension.length.value : null;
    const dd = rwy ? (rwy.declaredDistance||{}) : {};
    const tora = dd.tora ? dd.tora.value : lenM;
    const toda = dd.toda ? dd.toda.value : lenM;
    const asda = dd.asda ? dd.asda.value : lenM;
    const lda  = dd.lda  ? dd.lda.value  : lenM;
    state.perf.oaApplied = { source:'openaip', icao:p.icao, designator, eaipUrl:p.eaip.url, eaipReason:p.eaip.reason,
      tora, toda, asda, lda, fallback: !dd.tora || !dd.toda || !dd.asda || !dd.lda };
    showToast(`Piste ${designator} de ${p.icao} : QFU et altitude appliqués — eAIP officiel indisponible, vérifie TORA/LDA avant de les reporter.`);
  }
  state.perf.oaPicker = null;
  renderContent();
}
function perfUseDistance(field){
  const a = state.perf.oaApplied;
  if(!a) return;
  const val = a[field];
  if(val==null) return;
  if(field==='tora') state.perf.tora = Math.round(val);
  if(field==='lda') state.perf.lda = Math.round(val);
  renderContent();
}
