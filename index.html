        const windTxt = (it.head>=0?'H'+Math.round(it.head):'T'+Math.round(Math.abs(it.head)))+'/X'+Math.round(it.cross);
        rows.push({ height:22, cells:[
          {lines:[{text:label, size:8.5}]},
          {lines:[{text:it.designator, bold:true, align:'center', size:9.5}]},
          {lines:[{text:String(Math.round(it.qfu/10)).padStart(2,'0')+'\u00b0', align:'center'}]},
          {lines:[{text:String(Math.round(it.lda)), align:'center'}]},
          {lines:[{text:String(Math.round(it.ldGross)), align:'center'}]},
          {lines:[{text:`${Math.round(it.ldGross)} \u2264 ${Math.round(ldaReg)} (0.7\u00d7LDA)  ${vLabel(vc)}`, color:vColor(vc), size:8}]},
          {lines:[{text:windTxt, align:'center', size:7.6}]},
        ]});
      });
    });
    if(rows.length) drawTable('Landing Performances', cols, rows);
    else if(blank) drawTable('Landing Performances', cols, [['Destination',null],['Alternate',null],['Alternate 2',null]].flatMap(([label])=>[1,2].map(()=>({
      height:22, cells:[{lines:[{text:label, size:8.5}]},
        {lines:[{text:'.......', align:'center', color:GREY}]}, {lines:[{text:'.......', align:'center', color:GREY}]},
        {lines:[{text:'.......', align:'center', color:GREY}]}, {lines:[{text:'.......', align:'center', color:GREY}]},
        {lines:[{text:'.................... \u2264 ....................', align:'center', size:8, color:GREY}]},
        {lines:[{text:'.......', align:'center', color:GREY}]}]
    }))));
    else bodyLine('No runway in the verified database for destination/alternate(s).', {color:GREY});
  }else{
    const cols = [
      {label:'Airport', width:70}, {label:'RWY', width:30}, {label:'QFU', width:32}, {label:'LDA (m)', width:46},
      {label:'LD \u2264 LDA  /  LD(wet\u00d71.25) \u2264 LDA  /  LD(flapless) \u2264 LDA', width:250}, {label:'Wind', width:48},
    ];
    const groups = [ ['Destination', perf.destItems], ['Alternate', perf.altn1Items] ];
    const rows = [];
    groups.forEach(([label,items])=>{
      (items||[]).forEach(it=>{
        const checks = [['Dry',it.ldGross],['Wet\u00d71.25',it.ldWetGross],['Flapless',it.ldFlaplessGross]].map(([lbl,req])=>{
          const [vc] = perfSheetVerdict(it.lda, req);
          return {text:`${lbl}: ${Math.round(req)} \u2264 ${Math.round(it.lda)} ${vLabel(vc)}`, color:vColor(vc), size:8.5};
        });
        const windTxt = (it.head>=0?'H'+Math.round(it.head):'T'+Math.round(Math.abs(it.head)))+'/X'+Math.round(it.cross);
        rows.push({ height:40, cells:[
          {lines:[{text:label, size:9.5}]},
          {lines:[{text:it.designator, bold:true, align:'center', size:10.5}]},
          {lines:[{text:String(Math.round(it.qfu/10)).padStart(2,'0')+'\u00b0', align:'center', size:9}]},
          {lines:[{text:String(Math.round(it.lda)), align:'center', size:9}]},
          {lines:checks},
          {lines:[{text:windTxt, align:'center', size:8.5}]},
        ]});
      });
    });
    if(rows.length) drawTable('Landing Performances', cols, rows);
    else if(blank) drawTable('Landing Performances', cols, [['Destination',null],['Alternate',null]].flatMap(([label])=>[1,2].map(()=>({
      height:34, cells:[{lines:[{text:label, size:9.5}]},
        {lines:[{text:'.......', align:'center', color:GREY, size:9}]}, {lines:[{text:'.......', align:'center', color:GREY, size:9}]},
        {lines:[{text:'.......', align:'center', color:GREY, size:9}]},
        {lines:[
          {text:'.................... \u2264 ....................', size:9, color:GREY},
          {text:'.................... \u2264 ....................', size:9, color:GREY},
          {text:'.................... \u2264 ....................', size:9, color:GREY},
        ]},
        {lines:[{text:'.......', align:'center', color:GREY, size:9}]}]
    }))));
    else bodyLine('No runway in the verified database for destination/alternate.', {color:GREY});
  }

  // ---------------------------------------------------------------------------------------- Notes --
  ensureSpace(70, pageTitle);
  const notesH = Math.min(75, Math.max(50, y - MARGIN - 6));
  page.drawRectangle({x:MARGIN, y:y-notesH, width:PAGE_W-2*MARGIN, height:notesH, borderColor:BLACK, borderWidth:1.4});
  page.drawText('Notes :', {x:MARGIN+6, y:y-14, size:10, font:fontBold, color:BLACK});
  y -= (notesH + 10);

  if(mode==='nco'){
    noteBox([
      {text:'Cannes Aviation Procedures', bold:true},
      {text:'Takeoff and landing on grass: TOD and LD x1.15'},
      {text:'1% uphill/downhill slope increases TOD and LD by 5%'},
    ]);
  }

  return doc;
}


async function fpfBuildFolder(data){
  const { PDFDocument, StandardFonts, rgb } = PDFLib;

  const folderBytes = await fpfLoadBytes(fpfTemplatePaths.folder);
  const folderDoc = await PDFDocument.load(folderBytes);
  const font = await folderDoc.embedFont(StandardFonts.Helvetica);
  const SIZE = 9.5;
  const COLOR = rgb(0.1, 0.15, 0.55);

  const drawIn = (pageIdx, x0, x1, top, bottom, text, opts) => {
    if(text==null || text==='') return;
    opts = opts || {};
    const page = folderDoc.getPages()[pageIdx];
    const size = opts.size || SIZE;
    const y = fpfPdfY(top, bottom, opts.frac);
    let x = x0 + 3;
    if(opts.align==='center'){
      const w = font.widthOfTextAtSize(String(text), size);
      x = (x0+x1)/2 - w/2;
    }
    page.drawText(String(text), { x, y, size, font, color: COLOR });
  };

  // PAGE 1 — cover
  drawIn(0, 124.15,211.27, 244.79,264.55, data.dof);
  drawIn(0, 298.15,363.51, 244.79,264.55, data.crew, {align:'center'});
  drawIn(0, 472.47,559.55, 244.79,264.55, data.pax, {align:'center'});
  drawIn(0, 147.53,228.71, 298.75,316.16, data.registration);
  drawIn(0, 312.07,384.23, 298.75,316.16, data.fobGal, {align:'center'});
  const flightRows = [
    { top:416.96, bottom:434.55, icao:data.depIcao, ppr:data.pprDep, boarding:data.boarding, eobt:data.eobt },
    { top:434.55, bottom:452.31, icao:null },
    { top:452.31, bottom:469.83, icao:data.destIcao, ppr:data.pprDest },
    { top:469.83, bottom:487.35, icao:data.altnIcao },
    { top:487.35, bottom:505.08, icao:data.altn2Icao },
  ];
  for(const r of flightRows){
    drawIn(0, 142.06,184.71, r.top,r.bottom, r.icao, {align:'center'});
    if(r.ppr!=null) drawIn(0, 247.35,370.10, r.top,r.bottom, r.ppr, {align:'center'});
    if(r.boarding) drawIn(0, 370.10,445.35, r.top,r.bottom, r.boarding, {align:'center'});
    if(r.eobt) drawIn(0, 445.35,500.07, r.top,r.bottom, r.eobt, {align:'center'});
  }

  // PAGE 3 — weather (ICAO CODE + RWY/APP only)
  const wxGroups = [
    { icao:data.depIcao, rwy:data.depRwy, top:415.3, bottom:471.0, subTop:429.3, subBottom:443.2 },
    { icao:null, rwy:null, top:471.0, bottom:526.7, subTop:484.9, subBottom:498.9 },
    { icao:data.destIcao, rwy:data.destRwy, top:526.7, bottom:582.4, subTop:540.6, subBottom:554.5 },
    { icao:data.altnIcao, rwy:data.altnRwy, top:582.4, bottom:638.1, subTop:596.3, subBottom:610.2 },
    { icao:data.altn2Icao, rwy:data.altn2Rwy, top:638.1, bottom:693.7, subTop:652.0, subBottom:665.9 },
  ];
  for(const g of wxGroups){
    drawIn(2, 177.5,214.0, g.top,g.bottom, g.icao, {align:'center', frac:0.46});
    drawIn(2, 214.0,277.8, g.subTop,g.subBottom, g.rwy, {align:'center'});
  }

  // Assemble final document in Paul's requested order
  const out = await PDFDocument.create();
  const copyOne = async (srcDoc, idx) => { const [p] = await out.copyPages(srcDoc, [idx]); out.addPage(p); };
  const copyRange = async (srcDoc, from, to) => {
    const idxs = []; for(let i=from;i<=to;i++) idxs.push(i);
    const ps = await out.copyPages(srcDoc, idxs); ps.forEach(p=>out.addPage(p));
  };
  const mergeExternalPdf = async (path) => {
    const bytes = await fpfLoadBytes(path);
    const doc = await PDFDocument.load(bytes);
    const idxs = doc.getPages().map((_,i)=>i);
    const ps = await out.copyPages(doc, idxs); ps.forEach(p=>out.addPage(p));
  };
  const mergeFilledOfp = async (ofp) => {
    const bytes = await fpfLoadBytes(fpfTemplatePaths.ofp);
    const blockYs = [
      {nameTop:226.4, nameBot:254.5, dataTop:254.5, dataBot:280.9},
      {nameTop:280.9, nameBot:308.4, dataTop:308.4, dataBot:335.5},
      {nameTop:335.5, nameBot:362.4, dataTop:362.4, dataBot:389.6},
      {nameTop:389.6, nameBot:415.8, dataTop:415.8, dataBot:442.5},
      {nameTop:442.5, nameBot:470.3, dataTop:470.3, dataBot:497.0},
      {nameTop:497.0, nameBot:524.2, dataTop:524.2, dataBot:551.0},
      {nameTop:551.0, nameBot:577.6, dataTop:577.6, dataBot:608.0},
    ];
    const pageChunks = (ofp.pages && ofp.pages.length) ? ofp.pages : [[]];
    // More than 7 waypoints don't fit on one OFP page: duplicate the blank OFP page template once
    // per group of ≤7 and fill each one from where the previous page left off. The header (ICAO
    // boxes, T/O time, TOM/Vr/TOD/Dpt block, totals, arrival preparation box) is repeated identically
    // on every duplicated page, exactly as on a real paper continuation sheet.
    for(const blocks of pageChunks){
      const doc = await PDFDocument.load(bytes);
      const ofpFont = await doc.embedFont(StandardFonts.Helvetica);
      const page = doc.getPages()[0];
      const draw = (x0,x1,top,bottom,text,opts) => {
        if(text==null || text==='') return;
        opts = opts || {};
        const size = opts.size || 7.8;
        const y = fpfPdfY(top, bottom, opts.frac);
        if(opts.erase){
          page.drawRectangle({ x:x0-1, y:fpfPdfY(top,bottom,0)-1, width:(x1-x0)+2, height:(bottom-top)+2, color: rgb(1,1,1) });
        }
        const pad = opts.pad!=null?opts.pad:2;
        let x = x0 + pad;
        const drawOpts = { x, y, size, font: ofpFont, color: COLOR, lineHeight: opts.maxWidth ? size*1.15 : undefined };
        if(opts.maxWidth){
          drawOpts.maxWidth = opts.maxWidth;
        }else if(opts.align==='center'){
          const w = ofpFont.widthOfTextAtSize(String(text), size);
          drawOpts.x = (x0+x1)/2 - w/2;
        }else if(opts.align==='right'){
          const w = ofpFont.widthOfTextAtSize(String(text), size);
          drawOpts.x = x1 - w - pad;
        }
        page.drawText(String(text), drawOpts);
      };
      // Header: Departure / Destination / Alternate ICAO
      draw(258.2,329.4, 74.5,94.5, ofp.depIcao, {align:'center', size:9, erase:true});
      draw(365.5,436.6, 74.5,94.5, ofp.destIcao, {align:'center', size:9, erase:true});
      draw(481.9,553.0, 74.5,94.5, ofp.altnIcao, {align:'center', size:9, erase:true});
      // T/O time box
      draw(207,233, 204.3,216.3, ofp.toTime, {size:8});
      // Clearance line: TOM / Vr / TOD / Dpt Block
      draw(281,321, 137.9,149.9, ofp.tow, {erase:true});
      draw(342,382, 137.9,149.9, ofp.vr, {erase:true});
      draw(415,449, 137.9,149.9, ofp.tod, {erase:true});
      draw(513,564, 137.9,149.9, ofp.dptBlock, {erase:true});

      // WAYPOINTS blocks (up to 7 on this page): name-row (waypoint + radio/nav/clearances) + data-row
      blocks.forEach((b, i) => {
        const y = blockYs[i]; if(!y) return;
        draw(20,175.5, y.nameTop,y.nameBot, b.name, {size:8.5, frac:0.38, align:'center'});
        draw(368,431, y.nameTop,y.nameBot, b.radio, {size:6.2, frac:0.8, maxWidth:59});
        draw(431,494, y.nameTop,y.nameBot, b.nav, {size:6.2, frac:0.8, maxWidth:59});
        draw(494,565.6, y.nameTop,y.nameBot, b.clearances, {size:6.2, frac:0.8, maxWidth:67});
        if(b.mt==null) return; // final destination slot: name only, no outgoing leg data
        draw(17.1,73.2, y.dataTop, y.dataBot, b.mt+'°', {size:7.5, frac:0.78, pad:3});
        draw(17.1,73.2, y.dataTop, y.dataBot, b.mh+'°', {size:7.5, frac:0.12, align:'right'});
        draw(73.2,125.7, y.dataTop,y.dataBot, b.dist+' NM', {align:'center', size:7.5});
        draw(125.7,175.5, y.dataTop, y.dataBot, b.ete, {size:7, frac:0.78, pad:3});
        draw(125.7,175.5, y.dataTop, y.dataBot, b.etec, {size:7, frac:0.12, align:'right'});
        draw(175.5,241.1, y.dataTop,y.dataBot, b.crz+' ft', {align:'center', size:7.5});
        draw(241.1,298.3, y.dataTop,y.dataBot, b.mea+' ft', {align:'center', size:7.5});
        draw(298.3,367.9, y.dataTop,y.dataBot, b.fuelEst+' USG', {align:'center', size:7.5});
      });
      if(ofp.totals){
        draw(73.2,125.7, 608.0,639.6, ofp.totals.dist+' NM', {align:'center', size:8});
        draw(125.7,175.5, 608.0,639.6, ofp.totals.ete, {align:'center', size:8});
        draw(298.3,367.9, 608.0,639.6, ofp.totals.fuel+' USG', {align:'center', size:8});
      }

      // Arrival preparation box (destination)
      draw(213.1,249.5, 750.5,766.5, ofp.destElevFt!=null?ofp.destElevFt+' ft':null, {size:7.5, erase:true});
      draw(390.4,417.8, 694.7,706.7, ofp.ldm+' kg', {size:7.5, erase:true});
      draw(394.3,421.6, 722.3,734.3, ofp.vref!=null?ofp.vref+' kt':null, {size:7.5, erase:true});
      draw(388.4,415.8, 749.9,761.9, ofp.ld!=null?ofp.ld+' m':null, {size:7.5, erase:true});
      draw(438.7,466.1, 805.1,817.1, ofp.dptBlock, {size:7.5, erase:true});

      // Only the filled nav-log page (index 0) is copied here — the template's 2nd page (blank
      // Diversion sheet) is appended once, after the loop, not duplicated for every OFP page.
      const [copied] = await out.copyPages(doc, [0]);
      out.addPage(copied);
    }
    // Diversion page: same blank template page 2, appended once after all OFP page(s) above.
    const diversionDoc = await PDFDocument.load(bytes);
    if(diversionDoc.getPageCount() > 1){
      const [diversionPage] = await out.copyPages(diversionDoc, [1]);
      out.addPage(diversionPage);
    }
  };

  await copyOne(folderDoc, 0);  // 1. cover (rempli)
  await copyOne(folderDoc, 1);  // 2. documents

  for(const cat of ['euroc','temsi','wintem','msg']){
    for(const f of data.metFiles.filter(f=>(f.cat||'msg')===cat)) await mergeExternalPdf(f.url);
  }

  await copyOne(folderDoc, 2);  // 4. weather (rempli)
  await copyOne(folderDoc, 3);  // 5. NOTAMs
  for(const f of data.notamFiles) await mergeExternalPdf(f.url); // 6. NOTAM PDF(s)

  await copyOne(folderDoc, 4);  // 7. route description & OFP
  await mergeFilledOfp(data.ofp); // 8. OFP (filled) + Diversion (blank for now)
  await copyRange(folderDoc, 5, 9); // 9. route details x5 (blank)

  const mergeMassBalancePage = async (mnb) => {
    const mnbDoc = await PDFDocument.create();
    const page = mnbDoc.addPage([595.28, 841.89]);
    const font = await mnbDoc.embedFont(StandardFonts.Helvetica);
    const fontBold = await mnbDoc.embedFont(StandardFonts.HelveticaBold);
    const DARK = rgb(0.09,0.11,0.15), GREY = rgb(0.42,0.45,0.52), LINE = rgb(0.82,0.84,0.88);
    const GREEN = rgb(0.2,0.55,0.4), RED = rgb(0.75,0.2,0.2);
    const t = (x,y,text,opts) => {
      opts = opts || {};
      page.drawText(String(text), { x, y, size: opts.size||9, font: opts.bold?fontBold:font, color: opts.color||DARK });
    };
    const rule = (x0,x1,y) => page.drawLine({ start:{x:x0,y}, end:{x:x1,y}, thickness:0.6, color:LINE });

    t(50, 802, `MASS & BALANCE — ${mnb.acLabel} (${mnb.reg})`, {size:14, bold:true});
    t(50, 780, `Empty mass: ${mnb.emptyMass} kg (arm ${mnb.emptyArm} m)`, {size:9.5, color:GREY});

    // ---- table ----
    const colX = { label:50, mass:250, arm:330, moment:400, limit:475 };
    let y = 758;
    const header = () => {
      t(colX.label,y,'ITEM',{size:8,bold:true,color:GREY});
      t(colX.mass,y,'MASS (KG)',{size:8,bold:true,color:GREY});
      t(colX.arm,y,'ARM (M)',{size:8,bold:true,color:GREY});
      t(colX.moment,y,'MOMENT (KG.M)',{size:8,bold:true,color:GREY});
      t(colX.limit,y,'LIMIT',{size:8,bold:true,color:GREY});
      y -= 6; rule(50,545,y); y -= 14;
    };
    header();
    mnb.stationRows.forEach(s=>{
      t(colX.label,y,s.label); t(colX.mass,y,s.mass.toFixed(1)); t(colX.arm,y,s.arm.toFixed(3)); t(colX.moment,y,s.moment.toFixed(1));
      y -= 15;
    });
    mnb.fuelRows.forEach(f=>{
      t(colX.label,y,f.label+' (fuel)'); t(colX.mass,y,f.kg.toFixed(1)+' ('+f.usg.toFixed(1)+' USG)'); t(colX.arm,y,f.arm.toFixed(3)); t(colX.moment,y,f.moment.toFixed(1));
      y -= 15;
    });
    y -= 4; rule(50,545,y); y -= 16;
    const limitRow = (label, mass, arm, moment, max) => {
      const over = max!=null && mass>max;
      t(colX.label,y,label,{bold:true});
      t(colX.mass,y,mass.toFixed(1),{bold:true});
      if(arm!=null) t(colX.arm,y,arm.toFixed(3));
      if(moment!=null) t(colX.moment,y,moment.toFixed(1));
      if(max!=null) t(colX.limit,y, (over?'EXCEEDS ':'OK <= ')+max+' kg', {color: over?RED:GREEN, bold:true, size:8.5});
      y -= 17;
    };
    if(mnb.zfMass!=null) limitRow('ZFM', mnb.zfMass, mnb.zfArm, mnb.zfMoment, mnb.maxZFM);
    limitRow('TOM', mnb.toMass, mnb.toArm, mnb.toMoment, mnb.maxTOM);
    limitRow('LDM (estimated)', mnb.ldgMass, mnb.ldgArm, null, mnb.maxLDG);
    y -= 4;
    t(50, y, `Estimated LDM = TOM - trip fuel burn (${mnb.burnKg} kg, from the nav log).`, {size:8.5, color:GREY});
    y -= 26;

    // ---- CG envelope graph ----
    const boxX=60, boxW=470, boxH=300, boxY=y-boxH;
    const padL=48, padB=28, padT=14, padR=14;
    const allX = mnb.envelope.map(p=>p[0]).concat([mnb.toPoint.cg, mnb.ldgPoint.cg]);
    const allY = mnb.envelope.map(p=>p[1]).concat([mnb.toPoint.mass, mnb.ldgPoint.mass]);
    const xmin = Math.min(...allX)-0.03, xmax = Math.max(...allX)+0.03;
    const ymin = Math.min(...allY)-60, ymax = Math.max(...allY)+60;
    const sx = x => boxX+padL + (x-xmin)/(xmax-xmin) * (boxW-padL-padR);
    const sy = v => boxY+padB + (v-ymin)/(ymax-ymin) * (boxH-padB-padT);
    page.drawRectangle({ x:boxX, y:boxY, width:boxW, height:boxH, borderColor:LINE, borderWidth:0.8, color:rgb(0.985,0.985,0.99) });
    for(let i=0;i<=4;i++){
      const yv = ymin + (ymax-ymin)*i/4;
      page.drawLine({ start:{x:boxX+padL,y:sy(yv)}, end:{x:boxX+boxW-padR,y:sy(yv)}, thickness:0.5, color:LINE });
      t(boxX+padL-38, sy(yv)-3, Math.round(yv), {size:7.5, color:GREY});
    }
    for(let i=0;i<=4;i++){
      const xv = xmin + (xmax-xmin)*i/4;
      t(sx(xv)-14, boxY+padB-14, xv.toFixed(2), {size:7.5, color:GREY});
    }
    for(let i=0;i<mnb.envelope.length;i++){
      const p0=mnb.envelope[i], p1=mnb.envelope[(i+1)%mnb.envelope.length];
      page.drawLine({ start:{x:sx(p0[0]),y:sy(p0[1])}, end:{x:sx(p1[0]),y:sy(p1[1])}, thickness:1.6, color:GREEN });
    }
    const drawPt = (p, color, ring) => {
      page.drawLine({ start:{x:boxX+padL,y:sy(p.mass)}, end:{x:sx(p.cg),y:sy(p.mass)}, thickness:0.6, color, dashArray:[2,2] });
      page.drawLine({ start:{x:sx(p.cg),y:sy(p.mass)}, end:{x:sx(p.cg),y:boxY+padB}, thickness:0.6, color, dashArray:[2,2] });
      page.drawEllipse({ x:sx(p.cg), y:sy(p.mass), xScale: ring?7:4.5, yScale: ring?7:4.5, borderColor:color, borderWidth: ring?2:1.5, color: ring?undefined:color });
    };
    const BLUE = rgb(0.35,0.55,1), ORANGE = rgb(0.88,0.66,0.34);
    drawPt(mnb.toPoint, BLUE, true);
    drawPt(mnb.ldgPoint, ORANGE, false);
    const legendY = boxY-16;
    page.drawEllipse({ x:boxX+6, y:legendY+3, xScale:5, yScale:5, borderColor:BLUE, borderWidth:1.8 });
    t(boxX+16, legendY, `Takeoff (${mnb.toInside?'within envelope':'OUTSIDE ENVELOPE'})`, {size:8.5, color: mnb.toInside?GREY:RED});
    const legend2X = boxX+16+font.widthOfTextAtSize(`Takeoff (${mnb.toInside?'within envelope':'OUTSIDE ENVELOPE'})`,8.5)+22;
    page.drawEllipse({ x:legend2X, y:legendY+3, xScale:4.5, yScale:4.5, color:ORANGE });
    t(legend2X+10, legendY, `Landing, estimated (${mnb.ldInside?'within envelope':'OUTSIDE ENVELOPE'})`, {size:8.5, color: mnb.ldInside?GREY:RED});
    t(boxX+boxW-110, boxY-16, 'Lever arm (m)', {size:8, color:GREY});

    const idxs = mnbDoc.getPages().map((_,i)=>i);
    const ps = await out.copyPages(mnbDoc, idxs); ps.forEach(p=>out.addPage(p));
  };

  const mergeFilledFuel = async (fuel) => {
    if(!fuel){ await mergeExternalPdf(data.fuelMode==='nco' ? fpfTemplatePaths.fuelNco : fpfTemplatePaths.fuelCat); return; }
    const bytes = await fpfLoadBytes(data.fuelMode==='nco' ? fpfTemplatePaths.fuelNco : fpfTemplatePaths.fuelCat);
    const doc = await PDFDocument.load(bytes);
    const fFont = await doc.embedFont(StandardFonts.Helvetica);
    const page = doc.getPages()[0];
    const draw = (x0,x1,top,bottom,text,opts) => {
      if(text==null || text==='') return;
      opts = opts || {};
      const size = opts.size || 8.5;
      const y = fpfPdfY(top, bottom, opts.frac==null?0.32:opts.frac);
      const w = fFont.widthOfTextAtSize(String(text), size);
      const x = (x0+x1)/2 - w/2;
      page.drawText(String(text), { x, y, size, font: fFont, color: COLOR });
    };
    const MIN_X = data.fuelMode==='nco' ? [270.2,354.6] : [319.2,376.1];
    const USG_X = data.fuelMode==='nco' ? [354.6,435.2] : [376.1,435.2];
    const KG_X  = data.fuelMode==='nco' ? [435.2,535.0] : [463,517];
    if(fuel.mode==='nco'){
      const rows = [
        {y:[219.6,251.3], v:fuel.a}, {y:[251.3,312.9], v:fuel.b}, {y:[312.9,339.9], v:fuel.c},
        {y:[339.9,368.2], v:fuel.d}, {y:[368.2,394.5], v:fuel.e}, {y:[394.5,422.5], v:fuel.f},
        {y:[422.5,450.0], v:fuel.g}, {y:[450.0,478.1], v:fuel.h}, {y:[478.1,498.6], v:fuel.j},
      ];
      rows.forEach(r=>{
        draw(MIN_X[0],MIN_X[1], r.y[0],r.y[1], r.v.min);
        draw(USG_X[0],USG_X[1], r.y[0],r.y[1], r.v.usg);
        if(r.v.kg!=null) draw(KG_X[0],KG_X[1], r.y[0],r.y[1], r.v.kg);
      });
    }else{
      const rows = [
        {y:[267.0,294.4], v:fuel.b}, {y:[294.4,321.1], v:fuel.c, noMin:true}, {y:[321.1,382.7], v:fuel.d},
        {y:[410.1,435.2], v:fuel.f}, {y:[435.2,484.5], v:fuel.g}, {y:[484.5,510.4], v:fuel.h},
        {y:[510.4,536.2], v:fuel.j}, // Discretionary fuel — previously never filled in at all
      ];
      rows.forEach(r=>{
        // Row C's Minutes cell already has "5% OF TRIP FUEL" printed on the template itself — drawing
        // a number there would overlap that text, so only its USG value is filled in.
        if(!r.noMin) draw(MIN_X[0],MIN_X[1], r.y[0],r.y[1], r.v.min);
        draw(USG_X[0],USG_X[1], r.y[0],r.y[1], r.v.usg);
      });
      // K/L/M previously only had their Kg column filled (K) or were missing Minutes (L) or both (M).
      draw(MIN_X[0],MIN_X[1], 536.2,562.4, fuel.k.min);
      draw(USG_X[0],USG_X[1], 536.2,562.4, fuel.k.usg);
      draw(KG_X[0],KG_X[1], 536.2,562.4, fuel.k.kg);   // K row (Actual block fuel = H + J)
      draw(MIN_X[0],MIN_X[1], 562.4,588.6, fuel.l.min);
      draw(USG_X[0],USG_X[1], 562.4,588.6, fuel.l.usg);
      draw(KG_X[0],KG_X[1], 562.4,588.6, fuel.l.kg);   // L row (Estimated burn off)
      draw(MIN_X[0],MIN_X[1], 588.6,607.7, fuel.m.min);
      draw(USG_X[0],USG_X[1], 588.6,607.7, fuel.m.usg); // M row (Estimated holding fuel)
    }
    const idxs = doc.getPages().map((_,i)=>i);
    const ps = await out.copyPages(doc, idxs); ps.forEach(p=>out.addPage(p));
  };

  await copyOne(folderDoc, 10); // 10. fuel planning
  await mergeFilledFuel(data.fuel); // 11. Part-CAT or Part-NCO, filled

  await copyOne(folderDoc, 11); // 12. mass & balance
  await mergeMassBalancePage(data.mnb); // 12b. table + CG envelope graph (generated)
  await copyOne(folderDoc, 12); // 13. performances
  // 14. Performances — generated from scratch (runways as table rows, not squeezed into the old
  // printed template's fixed "......." blanks) so every runway/check gets full-width room; spills
  // onto a continuation page automatically if there are many runways. Climb/cruise still uses
  // whichever config was last set in the Performance tab; SID/MSA/MVL and go-around aren't computed
  // anywhere in the app, so they're left off this generated page (they were blank on the old
  // template too).
  const perfDoc = await buildPerfPagesNew(data.perf, data.fuelMode==='nco' ? 'nco' : 'cat');
  const perfIdxs = perfDoc.getPages().map((_,i)=>i);
  const perfPages = await out.copyPages(perfDoc, perfIdxs);
  perfPages.forEach(p=>out.addPage(p));

  await copyRange(folderDoc, 13, 16); // 15-18. ICAO FPL / safety / threats / debriefing

  return await out.save();
}
let fpfLastAnnexBytes = null; // stashed here so the separate download button below can trigger
                                // its own explicit browser download — Chrome (and others) silently
                                // block a second programmatic a.click() download fired right after
                                // the first one inside the same async handler, since the `await` in
                                // between breaks the "direct result of a user gesture" chain the
                                // browser requires. A second real click sidesteps that entirely.
async function fpfExport(){
  const btn = document.getElementById('btn-export-fpf');
  const status = document.getElementById('fpf-export-status');
  if(!window.PDFLib){ if(status) status.textContent = 'Error: pdf-lib not loaded (check your connection).'; return; }
  if(btn){ btn.disabled = true; btn.textContent = '⏳ Generating…'; }
  state.fpfAnnexReady = false;
  if(status) status.textContent = '';
  try{
    const data = fpfGatherData();
    const bytes = await fpfBuildFolder(data);
    const blob = new Blob([bytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Flight_Planning_Folder_${(state.depIcao||'DEP')}-${(state.destIcao||'DEST')}_${state.eobtDate||''}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    let statusMsg = '✓ Folder generated (' + Math.round(bytes.length/1024) + ' KB). OFP, performance charts and M&B image still need to be completed by hand for now.';

    // Separate "Annexe — Abaques" PDF (kept apart from the main folder on purpose — see project
    // notes — so day-to-day printing doesn't grow, while the AFM chart justification is one click
    // away if an instructor asks). Currently covers Take-off Ground Roll only; failing to fetch the
    // chart image (e.g. not yet uploaded to templates/abaques/) shouldn't break the main export.
    // Built here but NOT auto-downloaded — see fpfLastAnnexBytes note above.
    try{
      fpfLastAnnexBytes = await fpfBuildAbaqueAnnex(data);
      statusMsg += ' Annexe — Abaques ready (' + Math.round(fpfLastAnnexBytes.length/1024) + ' KB, take-off ground roll only for now) — click the second button below to download it (browsers block two automatic downloads at once).';
      state.fpfAnnexReady = true;
    }catch(annexErr){
      console.error(annexErr);
      fpfLastAnnexBytes = null;
      statusMsg += ' ⚠ Annexe — Abaques not generated (' + annexErr.message + ').';
    }
    if(status) status.textContent = statusMsg;
    renderContent();
  }catch(e){
    console.error(e);
    if(status) status.textContent = '❌ ' + e.message;
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '📦 Export flight planning folder (PDF)'; }
  }
}
function fpfDownloadAnnex(){
  if(!fpfLastAnnexBytes){ return; }
  const blob = new Blob([fpfLastAnnexBytes], {type:'application/pdf'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Annexe_Abaques_${(state.depIcao||'DEP')}-${(state.destIcao||'DEST')}_${state.eobtDate||''}.pdf`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
}

  document.getElementById('in-aircraft').addEventListener('change', e=>{

/* ---------- Onglet "Performances" — outil rapide décollage/atterrissage seul (sans Fiche Part-CAT/NCO),
   pensé pour un calcul ponctuel en vol, indépendant d'un plan de vol en cours d'édition. Réutilise
   directement state.perf et renderPerfSection (mode simplifié) — même moteur de calcul que la fiche
   complète, juste sans le contexte "Nouveau vol" (carte, nav log, fuel, M&B). ---------- */
function renderPerfStandalone(){
  const el = document.getElementById('content');

    `<option value="${k}" ${state.aircraft===k?'selected':''}>${v.label}</option>`).join('');
  const regOptions = ac.registrations.map(r=>
    `<option value="${r.tail}" ${state.regTail===r.tail?'selected':''}>${r.tail} (${r.mass} kg)</option>`).join('');

    <div class="card">
      <div class="card-title">Aircraft</div>
      <div class="field-row">
        <div class="field"><label>Type</label><select id="perfstd-aircraft">${acOptions}</select></div>
        <div class="field"><label>Registration</label><select id="perfstd-reg">${regOptions}</select></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Takeoff / landing performance — ${ac.label}</div>
      ${renderPerfSection({simplified:true})}
    </div>`;

  const inAc = document.getElementById('perfstd-aircraft');
  if(inAc) inAc.addEventListener('change', e=>{
    state.aircraft = e.target.value;
    state.regTail = AIRCRAFT_DB[state.aircraft].registrations[0].tail;
    state.perf.massTO = null; state.perf.massLDG = null;
    state.perf.massTOTouched = false; state.perf.massLDGTouched = false;
    if(!state.perf.loadPctTouched) state.perf.loadPct = perfDefaultLoadPct(state.regTail);

  const inReg = document.getElementById('perfstd-reg');
  if(inReg) inReg.addEventListener('change', e=>{

    if(!state.perf.loadPctTouched) state.perf.loadPct = perfDefaultLoadPct(state.regTail);
    renderContent();
  });
  wirePerfInputs();
  renderSidebarActive();
}

function wireWaypointRowEvents(){
  document.querySelectorAll('#content tr[data-wid]').forEach(tr=>{
    const id = parseInt(tr.dataset.wid);
    tr.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('change', e=>{
        const wp = state.waypoints.find(w=>w.id===id);
        const field = e.target.dataset.field;
        if(field==='name'){ wp.name = e.target.value || wp.name; renderMapMarkers(); }
        else if(field==='windDir'){
          if(e.target.value === ''){ wp.windDir = null; }
          else{
            let v = parseFloat(e.target.value);
            if(isNaN(v)) v = 0;
            v = ((v % 360) + 360) % 360; // clamp into [0,360), reject negatives by wrapping
            wp.windDir = v;
          }
          wp.manual = true;
          renderContent();
        }
        else if(field==='windSpeed'){
          let v = e.target.value === '' ? null : parseFloat(e.target.value);
          if(v !== null && (isNaN(v) || v < 0)) v = 0;
          wp.windSpeed = v;
          wp.manual = true;
          renderContent();
        }
        else if(field==='alt'){
          let v = parseFloat(e.target.value);
          if(isNaN(v)) v = state.cruiseAlt;
          wp.alt = v;
          state.legs = [];
          renderContent();
        }
        else{ wp[field] = e.target.value === '' ? null : parseFloat(e.target.value); wp.manual = true; renderContent(); }
      });
    });
    tr.querySelectorAll('button[data-act]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = state.waypoints.findIndex(w=>w.id===id);
        const act = btn.dataset.act;
        if(act==='del'){ state.waypoints.splice(idx,1); }
        else if(act==='up' && idx>0){ [state.waypoints[idx-1],state.waypoints[idx]]=[state.waypoints[idx],state.waypoints[idx-1]]; }
        else if(act==='down' && idx<state.waypoints.length-1){ [state.waypoints[idx+1],state.waypoints[idx]]=[state.waypoints[idx],state.waypoints[idx+1]]; }
        else if(act==='reset-auto'){
          const wp = state.waypoints[idx];
          wp.manual = false; wp.windError = false;
          showToast('Switched back to auto — click "Compute nav log" again to fetch Open-Meteo wind.');
        }
        state.legs = [];
        renderAll();
      });
    });
  });
}

  `;

function wireFuelModeToggle(){
  const btnCat = document.getElementById('btn-fuelmode-cat');
  const btnNco = document.getElementById('btn-fuelmode-nco');
  if(btnCat) btnCat.onclick = ()=>{ state.fuelMode='cat'; renderContent(); };
  if(btnNco) btnNco.onclick = ()=>{ state.fuelMode='nco'; renderContent(); };
}
function renderFuelTable(){
  const ac = AIRCRAFT_DB[state.aircraft];
  const fp = state.fuelParams;
  const cruiseUSGh = ac.cruiseUSGh != null ? ac.cruiseUSGh : fp.manualCruiseUSGh;
  const holdUSGh = ac.holdUSGh != null ? ac.holdUSGh : cruiseUSGh; // Estimated Holding Fuel (M) always converts at this rate, regardless of the Extra Fuel reason below
  const taxiUSG = ac.taxiUSG != null ? ac.taxiUSG : fp.manualTaxiUSG;
  const finalReserveUSG = ac.finalReserveUSG != null ? ac.finalReserveUSG : fp.manualFinalReserveUSG;

  if(state.legs.length===0){
    return `<div class="empty-state">Compute the nav log first to get the Trip Fuel.</div>`;
  }
  const tripMin = state.legs[state.legs.length-1].cumMin;
  const tripUSG = state.legs.reduce((s,l)=>s+l.fuelUSG, 0);
  const contUSG = tripUSG * (fp.contingencyPct/100);
  const contMin = tripMin * (fp.contingencyPct/100);
  const additionalMin = fp.additionalMin||0, extraMin = fp.extraMin||0;
  const discretionaryMin = fp.discretionaryMin||0, discretionaryUSG = fp.discretionaryUSG||0;
  // Extra Fuel can be for two different reasons with two different burn regimes: holding/delay AT
  // THE DESTINATION (flown at hold power, 3.5 USG/h) or weather/other en-route reasons (flown at
  // cruise power, same as Trip Fuel). The pilot picks which one applies for this flight.
  const extraRate = fp.extraReason==='cruise' ? cruiseUSGh : holdUSGh;

  // Internal calculation stays precise (taxi/reserve = unrounded school reference values); only
  // the DISPLAY is rounded to the unit. The total (H) is rounded UP (never to the nearest unit):
  // a regulatory minimum must never be displayed below its true value. Contingency (C) is rounded
  // UP too, for the same reason: 5% of a non-zero trip is never actually zero, so it must never
  // display as "0" even if it rounds to under 1 USG.
  const minReq = taxiUSG + tripUSG + contUSG + fp.altnUSG + finalReserveUSG + fp.additionalUSG + fp.extraUSG;
  state._lastFuelTotalUSG = minReq; // used to prefill M&B — precise value, not rounded
  const minReqDisp = Math.ceil(minReq);
  const minReqMin = tripMin + contMin + fp.altnMin + ac.finalReserveMin + additionalMin + extraMin;
  const contUSGdisp = Math.ceil(contUSG);

  const cruiseInput = ac.cruiseUSGh != null
    ? `${ac.cruiseUSGh} USG/h (${ac.cruisePct})${ac.climbUSGh!=null?', climb '+ac.climbUSGh+' USG/h':''}${ac.descentUSGh!=null?', descent '+ac.descentUSGh+' USG/h':''}`
    : `<input data-fp="manualCruiseUSGh" type="number" step="1" value="${fp.manualCruiseUSGh}" style="width:50px;"> USG/h <span class="manual-tag">to enter</span>`;
  const taxiInput = ac.taxiUSG != null ? Math.round(ac.taxiUSG)
    : `<input data-fp="manualTaxiUSG" type="number" step="1" value="${Math.round(fp.manualTaxiUSG)}" style="width:50px;">`;
  const reserveInput = ac.finalReserveUSG != null ? Math.round(ac.finalReserveUSG)
    : `<input data-fp="manualFinalReserveUSG" type="number" step="1" value="${Math.round(fp.manualFinalReserveUSG)}" style="width:50px;"> <span class="manual-tag">to enter</span>`;
  const extraReasonSelect = `<select data-fp-reason="extraReason" style="max-width:230px;">
      <option value="hold" ${fp.extraReason!=='cruise'?'selected':''}>Holding/delay at destination (${holdUSGh} USG/h)</option>
      <option value="cruise" ${fp.extraReason==='cruise'?'selected':''}>Weather / other en-route reason (${cruiseUSGh} USG/h)</option>
    </select>`;

  return `
  <table>
    <thead><tr><th></th><th>Item</th><th>Min</th><th>USG</th></tr></thead>
    <tbody>
      <tr><td>A</td><td>Taxi fuel</td><td>—</td><td>${taxiInput}</td></tr>
      <tr><td>B</td><td>Trip fuel (cons. ${cruiseInput})</td><td>${fmtMin(tripMin)}</td><td>${Math.round(tripUSG)}</td></tr>
      <tr><td>C</td><td>Contingency (${fp.contingencyPct}% trip)</td><td>${fmtMin(contMin)}</td><td>${contUSGdisp}</td></tr>
      <tr><td>D</td><td>Alternate fuel <input data-fp="altnMin" type="number" value="${fp.altnMin}" style="width:40px;">min /
        <input data-fp="altnUSG" type="number" step="1" value="${Math.round(fp.altnUSG)}" style="width:44px;">USG
        <button class="small-btn" id="btn-calc-altn" title="Compute from the alternate point placed on the map" style="border:1px solid var(--border);padding:2px 6px;">🧮 Compute</button></td>
        <td>${fp.altnMin}</td><td>${Math.round(fp.altnUSG)}</td></tr>
      <tr><td>E</td><td>Final reserve</td><td>${ac.finalReserveMin}</td><td>${reserveInput}</td></tr>
      <tr><td>F</td><td>Additional fuel (cons. ${cruiseUSGh} USG/h) <input data-fp="additionalMin" type="number" step="1" value="${additionalMin}" style="width:40px;">min /
        <input data-fp="additionalUSG" type="number" step="1" value="${Math.round(fp.additionalUSG)}" style="width:44px;">USG</td>
        <td>${fmtMin(additionalMin)}</td><td>${Math.round(fp.additionalUSG)}</td></tr>
      <tr><td>G</td><td>Extra fuel — reason: ${extraReasonSelect} <input data-fp="extraMin" type="number" step="1" value="${extraMin}" style="width:40px;margin-top:4px;">min /
        <input data-fp="extraUSG" type="number" step="1" value="${Math.round(fp.extraUSG)}" style="width:44px;">USG</td>
        <td>${fmtMin(extraMin)}</td><td>${Math.round(fp.extraUSG)}</td></tr>
      <tr class="total-row"><td>H</td><td>Minimum required fuel</td><td>${fmtMin(minReqMin)}</td><td>${minReqDisp} USG</td></tr>
      <tr><td>J</td><td>Discretionary fuel (if required by the commander, cons. ${cruiseUSGh} USG/h) <input data-fp="discretionaryMin" type="number" step="1" value="${discretionaryMin}" style="width:40px;">min /
        <input data-fp="discretionaryUSG" type="number" step="1" value="${Math.round(discretionaryUSG)}" style="width:44px;">USG</td>
        <td>${fmtMin(discretionaryMin)}</td><td>${Math.round(discretionaryUSG)}</td></tr>
    </tbody>
  </table>
  <div class="status-line">Fuel: ${ac.fuelType}. Adjust D/F/G/J according to your actual flight. Min and USG on F/G/J stay in sync automatically (edit either one) — F and J always convert at the classic cruise consumption (${cruiseUSGh} USG/h); G converts at whichever rate matches the reason you select (currently ${extraRate} USG/h). Estimated Holding Fuel (M, in the PDF export) always converts at the hold consumption (${holdUSGh} USG/h), regardless of G's reason. Figures rounded to the unit for display (H and C rounded up, never to the nearest unit, so as never to show less than the true minimum). This total (H) can be carried over as onboard fuel in the Mass &amp; Balance below.</div>
  <button class="btn" id="btn-fuel-to-mnb" style="margin-top:8px;">↓ Carry ${minReqDisp} USG over to Mass &amp; Balance</button>
  `;
}
function wireFuelInputs(){
  // Additional/Extra/Discretionary fuel: Min and USG are two views of the same quantity, kept in
  // sync via the relevant consumption rate whenever either one is edited. Additional and
  // Discretionary always convert at the classic cruise rate, matching Trip Fuel above. Extra Fuel
  // can be for two different reasons with two different burn regimes — see extraReason below — so
  // its rate is looked up dynamically instead of being fixed to 'hold'.
  const fpSyncPairs = {
    additionalMin: ['additionalUSG','cruise'], additionalUSG: ['additionalMin','cruise'],
    extraMin: ['extraUSG','extra'], extraUSG: ['extraMin','extra'],
    discretionaryMin: ['discretionaryUSG','cruise'], discretionaryUSG: ['discretionaryMin','cruise'],
  };
  const rateFor = (kind) => {
    const ac = AIRCRAFT_DB[state.aircraft];
    const cruiseRate = ac.cruiseUSGh != null ? ac.cruiseUSGh : state.fuelParams.manualCruiseUSGh;
    const holdRate = ac.holdUSGh != null ? ac.holdUSGh : cruiseRate;
    if(kind==='cruise') return cruiseRate;
    if(kind==='hold') return holdRate;
    // 'extra': holding/delay-at-destination reason uses hold rate, weather/other uses cruise rate
    return state.fuelParams.extraReason==='cruise' ? cruiseRate : holdRate;
  };
  document.querySelectorAll('[data-fp]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const key = e.target.dataset.fp;
      const val = Math.round(parseFloat(e.target.value))||0;
      state.fuelParams[key] = val;
      const pair = fpSyncPairs[key];
      if(pair){
        const [otherKey, kind] = pair;
        const rate = rateFor(kind);
        if(rate){
          state.fuelParams[otherKey] = key.endsWith('Min')
            ? Math.round((val/60)*rate)   // minutes entered -> derive USG
            : Math.round((val/rate)*60);  // USG entered -> derive minutes
        }
      }
      renderContent();
    });
  });
  document.querySelectorAll('[data-fp-reason]').forEach(sel=>{
    sel.addEventListener('change', e=>{
      state.fuelParams[e.target.dataset.fpReason] = e.target.value;
      // Reason changed -> the burn rate for Extra Fuel changed too. Keep the USG amount (the actual
      // quantity of fuel loaded) as the source of truth and recompute its time at the new rate.
      const rate = rateFor('extra');
      if(rate) state.fuelParams.extraMin = Math.round((state.fuelParams.extraUSG/rate)*60);
      renderContent();
    });
  });
  const btnCalcAltn = document.getElementById('btn-calc-altn');
  if(btnCalcAltn) btnCalcAltn.onclick = computeAlternateFuel;
  const btn = document.getElementById('btn-fuel-to-mnb');
  if(btn) btn.onclick = ()=>{
    const ac = AIRCRAFT_DB[state.aircraft];
    const total = Math.ceil(state._lastFuelTotalUSG || 0);
    // put it all in the first fuel station (MAIN), capped at its usable capacity
    const main = ac.fuelStations[0];
    state.mnb.fuel[main.key] = Math.min(total, main.usableUSG);
    renderContent();
    showToast('Fuel carried over to Mass & Balance ✓');
  };
  wireFuelModeToggle();
}

function renderFuelTableNco(){
  const ac = AIRCRAFT_DB[state.aircraft];
  const nco = ac.partNCO;
  if(!nco){
    return `<div class="empty-state">Part-NCO data not provided for ${ac.label} — available for the DA40 for now. Use Part-CAT in the meantime.</div>`;
  }
  if(state.legs.length===0){
    return `<div class="empty-state">Compute the nav log first to get the Trip Fuel.</div>`;
  }
  const fp = state.fuelParamsNco;
  const gp = state.fuelParams; // field D (alternate) shared with Part-CAT
  const tripMinRoute = state.legs[state.legs.length-1].cumMin;
  const tripUSGRoute = state.legs.reduce((s,l)=>s+l.fuelUSG, 0);

  const addMin = fp.approachAdd ? nco.approachAddMin : 0;
  const addUSG = fp.approachAdd ? nco.approachAddUSG : 0;
  const aMin = tripMinRoute + addMin, aUSG = tripUSGRoute + addUSG;

  const bMin = aMin*(fp.contingencyPct/100), bUSG = aUSG*(fp.contingencyPct/100);

  const reserve = nco.finalReserve[fp.reserveType];
  const cMin = reserve.min, cUSG = reserve.usg;

  const dMin = gp.altnMin||0, dUSG = gp.altnUSG||0;

  const eMin = aMin+bMin+cMin+dMin, eUSG = aUSG+bUSG+cUSG+dUSG;

  const fMin = fp.discretionaryMin||0, fUSG = fp.discretionaryUSG||0;

  const gMin = eMin+fMin, gUSG = eUSG+fUSG;
  const gKg = gUSG * ac.kgPerUSG;

  const hMin = aMin+bMin, hUSG = aUSG+bUSG;
  const hKg = hUSG * ac.kgPerUSG;

  const jUSG = gUSG - cUSG - dUSG - hUSG;
  const jMin = ac.holdUSGh ? (jUSG/ac.holdUSGh)*60 : null;

  state._lastFuelTotalUSG = gUSG; // block fuel = what actually gets loaded — precise value, not rounded

  const reserveOptions = Object.entries(nco.finalReserve).map(([k,v])=>
    `<option value="${k}" ${fp.reserveType===k?'selected':''}>${escapeHtml(v.label)}</option>`).join('');

  // Display rounded to the unit. E (minimum required) and G (actual block fuel loaded) are rounded
  // UP (never to the nearest unit): these are the two figures that must never be shown below their
  // true value. H/J remain informative estimates, rounded normally.
  const fmtV = (min,usg) => `<td>${fmtMin(min)}</td><td>${Math.round(usg)}</td>`;
  const eUSGdisp = Math.ceil(eUSG), gUSGdisp = Math.ceil(gUSG);

  return `
  <table>
    <thead><tr><th></th><th>Item</th><th>Minutes</th><th>USG</th></tr></thead>
    <tbody>
      <tr><td>A</td><td style="white-space:normal;max-width:380px;">Trip fuel *
          <div style="margin-top:4px;font-size:11px;color:var(--text-2);"><label><input type="checkbox" id="nco-approach" ${fp.approachAdd?'checked':''} style="vertical-align:middle;"> + approach procedure (${nco.approachAddMin} min, ${nco.approachAddUSG} USG)</label></div>
        </td>${fmtV(aMin,aUSG)}</tr>
      <tr><td>B</td><td style="white-space:normal;max-width:380px;">Contingency fuel (forecast weather, ATC, engine failure, traffic delays…)
          <div style="margin-top:4px;"><input data-nco="contingencyPct" type="number" step="0.5" value="${fp.contingencyPct}" style="width:50px;">% of trip</div>
        </td>${fmtV(bMin,bUSG)}</tr>
      <tr><td>C</td><td style="white-space:normal;max-width:380px;">Final reserve fuel **
          <div style="margin-top:4px;"><select id="nco-reserve">${reserveOptions}</select></div>
        </td>${fmtV(cMin,cUSG)}</tr>
      <tr><td>D</td><td style="white-space:normal;max-width:380px;">Alternate reserve fuel * (if necessary)
          <div style="margin-top:4px;"><input data-fp="altnMin" type="number" value="${gp.altnMin}" style="width:44px;">min /
          <input data-fp="altnUSG" type="number" step="1" value="${Math.round(gp.altnUSG)}" style="width:48px;">USG
          <button class="small-btn" id="btn-calc-altn-nco" title="Compute from the alternate point placed on the map" style="border:1px solid var(--border);padding:2px 6px;">🧮</button></div>
        </td>${fmtV(dMin,dUSG)}</tr>
      <tr class="total-row"><td>E</td><td>Minimum required fuel = A+B+C+D</td><td>${fmtMin(eMin)}</td><td>${eUSGdisp}</td></tr>
      <tr><td>F</td><td style="white-space:normal;max-width:380px;">Discretionary fuel (if required by the commander)
          <div style="margin-top:4px;"><input data-nco="discretionaryMin" type="number" value="${fp.discretionaryMin}" style="width:44px;">min /
          <input data-nco="discretionaryUSG" type="number" step="1" value="${Math.round(fp.discretionaryUSG)}" style="width:48px;">USG</div>
        </td>${fmtV(fMin,fUSG)}</tr>
      <tr class="total-row"><td>G</td><td>Actual block fuel = E+F</td><td>${fmtMin(gMin)}</td><td>${gUSGdisp} <span style="color:var(--text-2);">(×${ac.kgPerUSG} = ${Math.round(gKg)} kg)</span></td></tr>
      <tr><td>H</td><td>Estimated burn off = A+B</td><td>${fmtMin(hMin)}</td><td>${Math.round(hUSG)} <span style="color:var(--text-2);">(×${ac.kgPerUSG} = ${Math.round(hKg)} kg)</span></td></tr>
      <tr><td>J</td><td>Estimated holding fuel = G−C−D−H</td><td>${jMin!=null?fmtMin(Math.max(0,jMin)):'—'}</td><td>${Math.round(jUSG)}</td></tr>
    </tbody>
  </table>
  <div class="status-line" style="margin-top:10px;line-height:1.7;">
    * Add approach procedure: 15 min minimum — ${ac.label.split(' ')[0]}: ${nco.approachAddUSG} USG.<br>
    ** Final reserve fuel: Day VFR circuit pattern 10min (Max Cont Pw) = 1.5 USG · Day VFR local/cross-country 30min (holding speed) = 2 USG · Night VFR/IFR 45min (holding speed) = 3 USG.<br>
    Usable fuel: standard tanks = ${ac.fuelStations[0].usableUSG} USG = ${ac.fuelStations[0].usableKg} kg · long range = ${nco.usableLongRangeUSG} USG = ${nco.usableLongRangeKg} kg.<br>
    Cruise consumption: ${nco.cruiseNote}. Hold consumption: ${nco.holdNote}.<br>
    Figures rounded to the unit for display (E and G rounded up, never to the nearest unit).
  </div>
  <button class="btn" id="btn-fuel-to-mnb-nco" style="margin-top:8px;">↓ Carry ${gUSGdisp} USG (Actual Block Fuel) over to Mass &amp; Balance</button>
  `;
}

/* ---------- Mass & Balance ---------- */
function pointInPolygon(pt, poly){
  let inside = false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    const intersect = ((yi>pt[1]) !== (yj>pt[1])) && (pt[0] < (xj-xi)*(pt[1]-yi)/(yj-yi)+xi);
    if(intersect) inside = !inside;
  }
  return inside;
}
function computeMnB(){
  const ac = AIRCRAFT_DB[state.aircraft];
  const reg = ac.registrations.find(r=>r.tail===state.regTail) || ac.registrations[0];
  const emptyMass = reg.mass, emptyMoment = reg.moment;

  let zfMass = emptyMass, zfMoment = emptyMoment;
  const stationRows = ac.stations.map(s=>{
    const mass = state.mnb.stations[s.key] || 0;
    zfMass += mass; zfMoment += mass*s.arm;
    return { ...s, mass };
  });

  let toMass = zfMass, toMoment = zfMoment, fuelMassTotal = 0;
  const fuelRows = ac.fuelStations.map(f=>{
    const usg = state.mnb.fuel[f.key] || 0;
    const kg = usg * ac.kgPerUSG;
    fuelMassTotal += kg;
    toMass += kg; toMoment += kg*f.arm;
    return { ...f, usg, kg };
  });
  const toArm = toMass>0 ? toMoment/toMass : 0;

  // landing = takeoff minus trip fuel burn (from computed nav log if available), burned from MAIN tank arm
  const tripMin = state.legs.length ? state.legs[state.legs.length-1].cumMin : 0;
  const cruiseUSGh = ac.cruiseUSGh != null ? ac.cruiseUSGh : state.fuelParams.manualCruiseUSGh;
  const burnUSG = (tripMin/60) * (cruiseUSGh||0);
  const burnKg = burnUSG * ac.kgPerUSG;
  const mainArm = ac.fuelStations[0].arm;
  const ldgMass = Math.max(toMass - burnKg, zfMass);
  const ldgMoment = toMoment - burnKg*mainArm;
  const ldgArm = ldgMass>0 ? ldgMoment/ldgMass : 0;

  return { ac, reg, emptyMass, emptyMoment, stationRows, fuelRows, fuelMassTotal,
    zfMass, zfMoment, toMass, toMoment, toArm, burnKg, ldgMass, ldgArm };
}

function limitBar(val, max){
  if(max == null) return '';
  const pct = Math.min(100, (val/max)*100);
  return `<div class="limit-bar"><div class="limit-fill ${val>max?'over':''}" style="width:${pct}%;"></div></div>`;
}

function envelopeSVG(ac, points){
  const allX = ac.envelope.map(p=>p[0]).concat(points.map(p=>p.cg));
  const allY = ac.envelope.map(p=>p[1]).concat(points.map(p=>p.mass));
  const xmin = Math.min(...allX)-0.03, xmax = Math.max(...allX)+0.03;
  const ymin = Math.min(...allY)-60, ymax = Math.max(...allY)+60;
  const W=300,H=220,padL=46,padB=26,padT=10,padR=10;
  const sx = x => padL + (x-xmin)/(xmax-xmin) * (W-padL-padR);
  const sy = y => (H-padB) - (y-ymin)/(ymax-ymin) * (H-padB-padT);
  const poly = ac.envelope.map(p=>`${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(' ');
  let gridY = '';
  const ySteps = 4;
  for(let i=0;i<=ySteps;i++){
    const yv = ymin + (ymax-ymin)*i/ySteps;
    gridY += `<line x1="${padL}" y1="${sy(yv).toFixed(1)}" x2="${W-padR}" y2="${sy(yv).toFixed(1)}" stroke="#232834" stroke-width="1"/>
      <text x="${padL-6}" y="${(sy(yv)+3).toFixed(1)}" font-size="8.5" fill="#6b7385" text-anchor="end">${Math.round(yv)}</text>`;
  }
  const xSteps = 4;
  let gridX = '';
  for(let i=0;i<=xSteps;i++){
    const xv = xmin + (xmax-xmin)*i/xSteps;
    gridX += `<text x="${sx(xv).toFixed(1)}" y="${H-padB+14}" font-size="8.5" fill="#6b7385" text-anchor="middle">${xv.toFixed(2)}</text>`;
  }
  const pointsSVG = points.map((p,pi)=>{
    // takeoff (first point) drawn larger as a ring so it stays visible even when landing sits exactly on top of it
    const r = pi===0 ? 7 : 4;
    const strokeW = pi===0 ? 2.5 : 1.5;
    return `<line x1="${padL}" y1="${sy(p.mass).toFixed(1)}" x2="${sx(p.cg).toFixed(1)}" y2="${sy(p.mass).toFixed(1)}" stroke="${p.color}" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="${sx(p.cg).toFixed(1)}" y1="${sy(p.mass).toFixed(1)}" x2="${sx(p.cg).toFixed(1)}" y2="${H-padB}" stroke="${p.color}" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="${sx(p.cg).toFixed(1)}" cy="${sy(p.mass).toFixed(1)}" r="${r}" fill="${pi===0?'none':p.color}" stroke="${p.color}" stroke-width="${strokeW}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--bg-0);border-radius:8px;">
    ${gridY}${gridX}
    <polygon points="${poly}" fill="rgba(79,209,165,0.10)" stroke="#4fd1a5" stroke-width="1.5"/>
    ${pointsSVG}
    <text x="${W/2}" y="${H-4}" font-size="9" fill="#6b7385" text-anchor="middle">Lever arm (m)</text>
  </svg>`;
}

function renderMnBSection(){
  const ac = AIRCRAFT_DB[state.aircraft];
  const r = computeMnB();

  const stationInputs = r.stationRows.map(s=>`
    <div class="field">
      <label>${escapeHtml(s.label)} (kg)${s.max?` · max ${s.max}`:''}</label>
      <input data-mnb-station="${s.key}" type="number" value="${s.mass}">
      ${s.max ? limitBar(s.mass, s.max) : ''}
    </div>`).join('');

  const fuelInputs = r.fuelRows.map(f=>`
    <div class="field">
      <label>${escapeHtml(f.label)} (USG) · max ${f.usableUSG}</label>
      <input data-mnb-fuel="${f.key}" type="number" step="0.5" value="${f.usg}">
      <span class="status-line" style="margin:2px 0 0 0;">${f.kg.toFixed(1)} kg</span>
      ${limitBar(f.usg, f.usableUSG)}
    </div>`).join('');

  const zfOver = ac.maxZFM!=null && r.zfMass > ac.maxZFM;
  const toOver = r.toMass > ac.maxTOM;
  const ldOver = r.ldgMass > ac.maxLDG;
  const toInside = pointInPolygon([r.toArm, r.toMass], ac.envelope);
  const ldInside = pointInPolygon([r.ldgArm, r.ldgMass], ac.envelope);

  return `
  <div class="mnb-grid">
    <div>
      <div class="status-line" style="margin-bottom:10px;">Empty mass ${escapeHtml(r.reg.tail)}: <b style="color:var(--text-0);">${r.emptyMass} kg</b> (arm ${(r.emptyMoment/r.emptyMass).toFixed(3)} m)</div>
      <div class="field-row">${stationInputs}</div>
      <div class="field-row" style="margin-top:12px;">${fuelInputs}</div>

      <table style="margin-top:16px;">
        <thead><tr><th></th><th>Mass (kg)</th><th>Arm (m)</th><th>Moment (m.kg)</th><th>Limit</th></tr></thead>
        <tbody>
          ${ac.maxZFM!=null ? `<tr><td>ZFM</td><td>${r.zfMass.toFixed(1)}</td><td>${(r.zfMoment/r.zfMass).toFixed(3)}</td><td>${r.zfMoment.toFixed(1)}</td>
            <td class="${zfOver?'bad-tag':'ok-tag'}">${zfOver?'✗ '+ac.maxZFM+' kg':'✓ max '+ac.maxZFM+' kg'}</td></tr>` : ''}
          <tr><td>TOM</td><td>${r.toMass.toFixed(1)}</td><td>${r.toArm.toFixed(3)}</td><td>${r.toMoment.toFixed(1)}</td>
            <td class="${toOver?'bad-tag':'ok-tag'}">${toOver?'✗ '+ac.maxTOM+' kg':'✓ max '+ac.maxTOM+' kg'}</td></tr>
          <tr><td>LDM (estimated)</td><td>${r.ldgMass.toFixed(1)}</td><td>${r.ldgArm.toFixed(3)}</td><td>—</td>
            <td class="${ldOver?'bad-tag':'ok-tag'}">${ldOver?'✗ '+ac.maxLDG+' kg':'✓ max '+ac.maxLDG+' kg'}</td></tr>
        </tbody>
      </table>
      <div class="status-line">Estimated LDM = TOM − fuel burned on the trip (${r.burnKg.toFixed(1)} kg, from the nav log). T/O CG: <span class="${toInside?'ok-tag':'bad-tag'}">${toInside?'✓ within envelope':'✗ outside envelope'}</span> · LDG CG: <span class="${ldInside?'ok-tag':'bad-tag'}">${ldInside?'✓ within envelope':'✗ outside envelope'}</span></div>
    </div>
    <div>
      ${envelopeSVG(ac, [
        {cg:r.toArm, mass:r.toMass, color:'#5b8cff'},
        {cg:r.ldgArm, mass:r.ldgMass, color:'#e0a856'}
      ])}
      <div class="status-line"><span style="color:#5b8cff;">◯</span> Takeoff &nbsp; <span style="color:#e0a856;">●</span> Landing (estimated) &nbsp;— if fuel burned is zero (nav log not yet computed), both points are identical and the landing point is shown at the center of the takeoff ring.</div>
    </div>
  </div>`;
}

/* ---------- eAIP France (SIA) : source officielle des distances déclarées ---------- */
function airacCycleUrl(icao){
  const MONS=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const anchor = Date.UTC(2026,7,6); // 06 AUG 2026 = début de cycle AIRAC connu (2609)
  const msPerCycle = 28*24*3600*1000;
  const now = Date.now();
  const cycles = Math.floor((now-anchor)/msPerCycle);
  const start = new Date(anchor + cycles*msPerCycle);
  const dd=String(start.getUTCDate()).padStart(2,'0');
  const mon=MONS[start.getUTCMonth()];
  const yyyy=start.getUTCFullYear();
  const mm=String(start.getUTCMonth()+1).padStart(2,'0');
  return `https://www.sia.aviation-civile.gouv.fr/media/dvd/eAIP_${dd}_${mon}_${yyyy}/FRANCE/AIRAC-${yyyy}-${mm}-${dd}/html/eAIP/FR-AD-2.${icao.toUpperCase()}-fr-FR.html`;
}
async function perfFetchEAIP(icao){
  const key = icao.toUpperCase();
  if(state.perf.eaipCache[key] !== undefined) return state.perf.eaipCache[key];
  const url = airacCycleUrl(key);
  try{
    const res = await fetch(url);
    if(!res.ok){ const r={ok:false,url,reason:'http_'+res.status}; state.perf.eaipCache[key]=r; return r; }
    const html = await res.text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const tables = Array.from(doc.querySelectorAll('table'));
    let target=null, headerRow=null;
    outer: for(const t of tables){
      for(const r of Array.from(t.querySelectorAll('tr'))){
        const cells = Array.from(r.querySelectorAll('th,td')).map(c=>c.textContent.trim().toUpperCase());
        if(cells.includes('TORA') && cells.includes('LDA')){ target=t; headerRow=cells; break outer; }
      }
    }
    if(!target){ const r={ok:false,url,reason:'table_not_found'}; state.perf.eaipCache[key]=r; return r; }
    const idx = { rwy: headerRow.findIndex(c=>c.includes('RWY')), qfu: headerRow.indexOf('QFU'), tora: headerRow.indexOf('TORA'),
      toda: headerRow.indexOf('TODA'), asda: headerRow.indexOf('ASDA'), lda: headerRow.indexOf('LDA') };
    const num=(s)=>{ const v=parseFloat((s||'').replace(/[^\d.]/g,'')); return isNaN(v)?null:v; };
    const runways=[];
    for(const r of Array.from(target.querySelectorAll('tr'))){
      const cells = Array.from(r.querySelectorAll('th,td')).map(c=>c.textContent.trim());
      if(cells.length<4) continue;
      const rwyId = cells[idx.rwy];
      if(!rwyId || !/^\d{2}[LCR]?$/.test(rwyId)) continue;
      const qfu = idx.qfu>=0 ? num(cells[idx.qfu]) : null;
      runways.push({ designator:rwyId, qfu, tora:num(cells[idx.tora]), toda:num(cells[idx.toda]), asda:num(cells[idx.asda]), lda:num(cells[idx.lda]) });
    }
    const r = runways.length ? {ok:true,url,runways} : {ok:false,url,reason:'no_rows'};
    state.perf.eaipCache[key]=r; return r;
  }catch(e){
    const r={ok:false,url,reason:'fetch_error'}; state.perf.eaipCache[key]=r; return r;
  }
}
/* ---------- OpenAIP : géométrie piste (QFU, altitude) + repli distances si eAIP indisponible ---------- */
async function perfFetchAirport(icao){
  if(!icao) return null;
  const key = icao.toUpperCase();
  if(state.perf.oaCache[key] !== undefined) return state.perf.oaCache[key];
  if(!state.openaipApiKey){ state.perf.oaCache[key] = null; return null; }
  try{
    const url = `https://api.core.openaip.net/api/airports?search=${encodeURIComponent(key)}&apiKey=${encodeURIComponent(state.openaipApiKey)}`;
    const res = await fetch(url);
    if(!res.ok){ state.perf.oaCache[key] = null; return null; }
    const data = await res.json();
    const items = data.items || data || [];
    const airport = items.find(a => (a.icaoCode||'').toUpperCase() === key) || items[0] || null;
    state.perf.oaCache[key] = airport;
    return airport;
  }catch(e){ state.perf.oaCache[key] = null; return null; }
}
/* Extrait TWR/AFIS/ATIS/GND/INFO d'un objet aéroport OpenAIP (déjà en cache via perfFetchAirport).
   Défensif : le champ "type" peut être une chaîne ("TWR") ou un code numérique selon les endpoints —
   on filtre donc aussi sur le "name" (toujours une chaîne lisible, ex. "Nice Tower") pour ne rien rater. */
function extractRelevantFrequencies(airport){
  const freqs = (airport && airport.frequencies) || [];
  const keyword = /twr|tower|afis|atis|gnd|ground|info/i;
  return freqs
    .filter(f => f && f.value != null && (keyword.test(String(f.type||'')) || keyword.test(String(f.name||''))))
    .map(f => ({ name: f.name || String(f.type||'').toUpperCase(), value: Number(f.value) }))
    .filter(f => !isNaN(f.value));
}
async function fillDepArrFrequencies(){
  if(!state.openaipApiKey){ showToast('Enter your OpenAIP key (Map card, above) to enable frequency retrieval.'); return; }
  if(state.legs.length===0){ showToast('Compute the nav log first.'); return; }
  const dep = (state.depIcao||'').trim().toUpperCase();
  const dest = (state.destIcao||'').trim().toUpperCase();
  if(!dep && !dest){ showToast('Enter at least the departure or destination (Flight Info).'); return; }
  let filled = 0;
  if(dep){
    const airport = await perfFetchAirport(dep);
    const freqs = extractRelevantFrequencies(airport);
    if(freqs.length){
      const key = state.legs[0].from+'→'+state.legs[0].to;
      if(!state.legNotes[key]) state.legNotes[key] = {radio:'', nav:'', remarks:''};
      const lines = freqs.map(f=>`${f.name} : ${f.value.toFixed(3)}`).join('\n');
      state.legNotes[key].radio = state.legNotes[key].radio ? (lines+'\n'+state.legNotes[key].radio) : lines;
      filled++;
    }
  }
  if(dest){
    const airport = await perfFetchAirport(dest);
    const freqs = extractRelevantFrequencies(airport);
    if(freqs.length){
      const lastLeg = state.legs[state.legs.length-1];
      const key = lastLeg.from+'→'+lastLeg.to;
      if(!state.legNotes[key]) state.legNotes[key] = {radio:'', nav:'', remarks:''};
      const lines = freqs.map(f=>`${f.name} : ${f.value.toFixed(3)}`).join('\n');
      state.legNotes[key].radio = state.legNotes[key].radio ? (state.legNotes[key].radio+'\n'+lines) : lines;
      filled++;
    }
  }
  renderContent();
  if(filled>0) showToast(`OpenAIP frequencies added to the Radio column (${filled} airport${filled>1?'s':''}) ✓ — please verify.`);
  else showToast('No TWR/AFIS/ATIS/GND frequency found in OpenAIP for this/these airport(s).');
}
// Switches the active airport context (dep/dest/altn/altn2) AND keeps the Takeoff/Landing sub-tab
// consistent with it: departure is for takeoff/climb, destination and alternate(s) are for landing.
// Without this, a wind/QNH lookup for e.g. the destination could be left showing on the Takeoff
// sub-tab — takeoff mass and Vr for an airport that's only ever used for landing.
function perfSwitchSlot(slot){
  state.perf.slot = slot;
  if(slot==='dep'){ if(state.perf.tab==='ldg') state.perf.tab='to'; }
  else { state.perf.tab='ldg'; }
}
async function perfOpenPicker(slot){
  const icao = slot==='dep' ? state.depIcao : slot==='dest' ? state.destIcao
             : slot==='altn2' ? state.perf.altn2Icao : state.altnIcao;
  if(!icao){ showToast('Enter the corresponding ICAO code first, at the top of the flight sheet.'); return; }
  // Fetching a runway for an airport switches the active context to that airport (and the sub-tab
  // to match), so the applied values immediately show on the tab where they're actually relevant.
  perfSwitchSlot(slot);
  const key = icao.toUpperCase();
  const manual = (state.perf.rwyDB||{})[key];
  if(manual && manual.runways && manual.runways.length){
    // Base vérifiée manuellement : aucune requête réseau, aucun souci CORS, priorité absolue.
    state.perf.oaPicker = { slot, icao:key, name:manual.name||null, elevM:null, manual,
      designators: manual.runways.map(r=>r.designator).filter(Boolean),
      eaip:{ok:false}, openaipRunways:[] };
    renderContent();
    return;
  }
  state.perf.oaLoading = true; state.perf.oaPicker = null; renderContent();
  const [airport, eaip] = await Promise.all([
    state.openaipApiKey ? perfFetchAirport(icao) : Promise.resolve(null),
    perfFetchEAIP(icao)
  ]);
  state.perf.oaLoading = false;
  // Construit la liste des pistes à afficher : priorité aux désignateurs eAIP (officiel),
  // complétée par OpenAIP pour l'altitude terrain (donnée géométrique fiable).
  const elevM = airport && airport.elevation ? airport.elevation.value : null;
  let designators = [];
  if(eaip.ok) designators = eaip.runways.map(r=>r.designator);
  else if(airport) designators = (airport.runways||[]).filter(r=>r.operations===0).map(r=>r.designator);
  if(designators.length===0){
    showToast(`No data found for ${icao.toUpperCase()} (neither manual database, nor official eAIP, nor OpenAIP).`);
    renderContent(); return;
  }
  state.perf.oaPicker = { slot, icao: icao.toUpperCase(), name: airport?airport.name:null,
    elevM, manual:null, designators, eaip, openaipRunways: airport ? (airport.runways||[]) : [] };
  renderContent();
}
function perfApplyRunway(designator){
  const p = state.perf.oaPicker;
  if(!p) return;
  const atmo = perfAtmo(p.slot); // écrit dans le contexte de l'aérodrome concerné, pas le contexte affiché
  const qfuFallback = parseInt(designator, 10) * 10;
  atmo.qfu = qfuFallback;

  if(p.manual){
    const rwy = p.manual.runways.find(r=>r.designator===designator);
    if(!rwy) return;
    const qfu = effectiveQfu(rwy);
    if(qfu!=null) atmo.qfu = qfu;
    if(p.manual.elevFt != null) atmo.elev = Math.round(p.manual.elevFt);
    if(rwy.tora!=null) atmo.tora = Math.round(rwy.tora);
    if(rwy.lda!=null) atmo.lda = Math.round(rwy.lda);
    state.perf.oaApplied = { slot:p.slot, source:'manual', icao:p.icao, designator, qfu,
      tora:rwy.tora, toda:rwy.toda, asda:rwy.asda, lda:rwy.lda, note:p.manual.note };
    state.perf.oaPicker = null;
    renderContent();
    showToast(`Runway ${designator} at ${p.icao}: QFU, elevation, TORA and LDA applied (manually verified database) ✓`);
    return;
  }
  if(p.elevM != null) atmo.elev = Math.round(p.elevM * 3.28084);

  const eaipRwy = p.eaip.ok ? p.eaip.runways.find(r=>r.designator===designator) : null;
  if(eaipRwy){
    // Official source available: apply the real QFU (eAIP column)/TORA/LDA directly.
    const qfu = eaipRwy.qfu!=null ? eaipRwy.qfu : qfuFallback;
    atmo.qfu = qfu;
    if(eaipRwy.tora!=null) atmo.tora = Math.round(eaipRwy.tora);
    if(eaipRwy.lda!=null) atmo.lda = Math.round(eaipRwy.lda);
    state.perf.oaApplied = { slot:p.slot, source:'eaip', icao:p.icao, designator, url:p.eaip.url, qfu,
      tora:eaipRwy.tora, toda:eaipRwy.toda, asda:eaipRwy.asda, lda:eaipRwy.lda };
    showToast(`Runway ${designator} at ${p.icao}: QFU, elevation, TORA and LDA applied (official eAIP) ✓`);
  }else{
    // eAIP unavailable for this airport (CORS, cycle not found...): fall back to OpenAIP, no auto-apply of distances.
    const rwy = p.openaipRunways.find(r=>r.designator===designator);
    const lenM = rwy && rwy.dimension && rwy.dimension.length ? rwy.dimension.length.value : null;
    const dd = rwy ? (rwy.declaredDistance||{}) : {};
    const tora = dd.tora ? dd.tora.value : lenM;
    const toda = dd.toda ? dd.toda.value : lenM;
    const asda = dd.asda ? dd.asda.value : lenM;
    const lda  = dd.lda  ? dd.lda.value  : lenM;
    state.perf.oaApplied = { slot:p.slot, source:'openaip', icao:p.icao, designator, eaipUrl:p.eaip.url, eaipReason:p.eaip.reason, qfu:qfuFallback,
      tora, toda, asda, lda, fallback: !dd.tora || !dd.toda || !dd.asda || !dd.lda };
    showToast(`Runway ${designator} at ${p.icao}: QFU and elevation applied — official eAIP unavailable, verify TORA/LDA before carrying them over.`);
  }
  state.perf.oaPicker = null;
  renderContent();
}
function perfUseDistance(field){
  const a = state.perf.oaApplied;
  if(!a) return;
  const val = a[field];
  if(val==null) return;
  const atmo = perfAtmo(a.slot);
  if(field==='tora') atmo.tora = Math.round(val);
  if(field==='lda') atmo.lda = Math.round(val);
  renderContent();
}

/* ---------- Performances (décollage / atterrissage) ---------- */
function perfFmt(n){ return Math.round(n).toLocaleString('en-US'); }
function perfVerdict(avail,req){
  if(req>avail) return ['bad','INSUFFICIENT'];
  const m=(avail-req)/avail; if(m<0.15) return ['warn','LOW MARGIN']; return ['ok','OK'];
}
function perfNotesHTML(notes){

function perfRunwaySVG(avail,req,roll,qfu){
  const W=560,H=80,pad=8;
  const scale=Math.max(avail,req)*1.06 || 1;
  const px=v=>pad+(v/scale)*(W-2*pad);
  const ribY=24,ribH=26;
  const reqX=px(req), rollX=px(roll), availX=px(avail);
  const exceed=req>avail;
  const reqCol=exceed?'var(--danger)':(avail-req)/avail<0.15?'var(--warn)':'var(--accent)';
  let dashes=''; for(let x=pad+34;x<availX-6;x+=26){ dashes+=`<rect x="${x}" y="${ribY+ribH/2-1.1}" width="12" height="2.2" fill="#3a4155" rx="1"/>`; }
  const rwyNum = qfu!=null ? String(Math.round(qfu/10)%36).padStart(2,'0') : null;
  const numMark = rwyNum ? `
    <text x="${pad+13}" y="${ribY+ribH/2+7}" fill="#e8ecf4" font-size="17" font-weight="700" text-anchor="middle" font-family="var(--mono)">${rwyNum}</text>` : '';
  return `<svg class="perf-rwy" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <rect x="${pad}" y="${ribY}" width="${availX-pad}" height="${ribH}" rx="3" fill="var(--bg-1)" stroke="var(--border)"/>
    ${dashes}
    <rect x="${pad}" y="${ribY}" width="${reqX-pad}" height="${ribH}" rx="3" fill="${reqCol}" opacity="0.16"/>
    <rect x="${pad}" y="${ribY}" width="${rollX-pad}" height="${ribH}" fill="${reqCol}" opacity="0.32"/>
    ${numMark}
    <line x1="${reqX}" y1="${ribY-5}" x2="${reqX}" y2="${ribY+ribH+5}" stroke="${reqCol}" stroke-width="2"/>
    <text x="${reqX}" y="${ribY-8}" fill="${reqCol}" font-size="10.5" text-anchor="middle">${perfFmt(req)} m</text>
    <line x1="${availX}" y1="${ribY-3}" x2="${availX}" y2="${ribY+ribH+3}" stroke="var(--text-2)" stroke-width="1.5"/>
    <text x="${availX}" y="${ribY+ribH+17}" fill="var(--text-1)" font-size="9" text-anchor="end">avail ${perfFmt(avail)} m</text>
  </svg>`;
}
// Valeurs par défaut d'un contexte atmo/piste (un jeu par aérodrome : dep/dest/altn/altn2).
function perfDefaultAtmo(){
  return { elev:0, qnhUnit:'hpa', qnh:1013, oat:15, qfu:0, tora:800, lda:800,
           slope:0, slopeDir:'up', surf:'0', pstate:'dry', wdir:0, wspd:0 };
}
// Renvoie le contexte atmo/piste pour un aérodrome donné ('dep'/'dest'/'altn'/'altn2'), ou celui
// actuellement affiché (state.perf.slot) si aucun n'est précisé. Recrée un contexte par défaut si
// absent (ex. vol chargé depuis une sauvegarde antérieure à cette fonctionnalité).
function perfAtmo(slot){
  if(!state.perf.atmo) state.perf.atmo = {};
  const s = slot || state.perf.slot || 'dep';
  if(!state.perf.atmo[s]) state.perf.atmo[s] = perfDefaultAtmo();
  return state.perf.atmo[s];
}
// Migre une ancienne sauvegarde (avant l'introduction du vent/QNH/OAT par aérodrome) : les champs
// plats (p.wdir, p.qnh, ...) sont repris dans le contexte "dep" pour ne pas perdre les données.
function perfMigrateLegacyAtmo(perf){
  if(!perf || perf.atmo) return;
  const legacy = perfDefaultAtmo();
  Object.keys(legacy).forEach(k=>{ if(perf[k]!==undefined) legacy[k]=perf[k]; });
  perf.atmo = { dep: legacy, dest: perfDefaultAtmo(), altn: perfDefaultAtmo(), altn2: perfDefaultAtmo() };
  perf.slot = 'dep';
}
function perfReadInputs(slot){
  const p = perfAtmo(slot);
  let qnh = p.qnh; if(p.qnhUnit==='inhg') qnh = qnh*33.8639;
  const elev = p.elev;
  const pa = elev + (1013.25-qnh)*27;
  const oat = p.oat;
  const isa = oat - PERF_DA40.isaTemp(pa);
  const sig = PERF_DA40.sigma(pa,oat);
  const slope = p.slope*(p.slopeDir==='up'?1:-1);
  let ang=(p.wdir-p.qfu)*Math.PI/180;
  const spd=p.wspd;
  const head = spd*Math.cos(ang), cross = Math.abs(spd*Math.sin(ang));
  return{pa,oat,isa,sig,qfu:p.qfu,tora:p.tora,lda:p.lda,slope,surf:p.surf,state:p.pstate,head,cross};
}

/* ---------- Fiche récap toutes pistes — Part-CAT (formulaire officiel Cannes Aviation) ----------
   Décollage : TOD × 1.25 ≤ TORA (cas "sans clearway ni stopway", nos bases pistes ne suivent pas
   la présence de CWY/STW donc c'est le cas par défaut retenu — dis-le moi si une piste en a une,
   je coderai la variante TOD≤TORA / TOD×1.15≤TODA / ASD×1.3≤ASDA).
   Montée : γ nette = γ brute × 0.77 (facteur réglementaire net de la trajectoire de décollage).
   Atterrissage : LD ≤ LDA × 0.7 (CAT.POL.A.230). */
function qfuFromDesignator(designator){
  const m = (designator||'').match(/(\d{1,2})/);
  if(!m) return null;
  const n = parseInt(m[1],10);
  if(isNaN(n)) return null;
  return norm360(n*10);
}
// QFU réel (renseigné à la main ou récupéré eAIP) si disponible, sinon repli sur le désignateur × 10
// (approximation ± quelques degrés — le vrai QFU magnétique diffère souvent du désignateur arrondi).
function effectiveQfu(rwy){
  return (rwy.qfu!=null && rwy.qfu!=='') ? Number(rwy.qfu) : qfuFromDesignator(rwy.designator);
}
function perfSheetAtmoAt(elevFt, slot){
  const p = perfAtmo(slot);
  let qnh = p.qnh; if(p.qnhUnit==='inhg') qnh = qnh*33.8639;
  const elev = elevFt!=null ? elevFt : p.elev;
  const pa = elev + (1013.25-qnh)*27;
  const oat = p.oat;
  const isa = oat - PERF_DA40.isaTemp(pa);
  const sig = PERF_DA40.sigma(pa,oat);
  const slope = p.slope*(p.slopeDir==='up'?1:-1);
  return {pa,oat,isa,sig,slope};
}
function perfSheetTO(rwy, elevFt, slot){
  const qfu = effectiveQfu(rwy);
  if(qfu==null) return null;
  const p = perfAtmo(slot);
  const ac = AIRCRAFT_DB[state.aircraft];
  const eng114 = (ac.perf114Tails||[]).includes(state.regTail);
  const {pa,oat,isa,sig,slope} = perfSheetAtmoAt(elevFt, slot);
  const ang=(p.wdir-qfu)*Math.PI/180;
  const head = p.wspd*Math.cos(ang), cross = Math.abs(p.wspd*Math.sin(ang));
  const I = {pa,oat,isa,sig,qfu,tora:null,lda:null,slope,surf:p.surf,state:p.pstate,head,cross};
  const r = PERF_DA40.computeTO(eng114?'114':'01', state.perf.prop, state.perf.massTO, I);
  // TOR+LR (Part-NCO, formulaire Cannes Aviation) : pas de table accélération-arrêt dédiée dans l'AFM
  // pour ce monomoteur — proxy = roulage décollage + roulage atterrissage (volets LDG) à la masse
  // au décollage, comme distance de freinage estimée en cas d'interruption.
  const lr = PERF_DA40.computeLDG('LDG', state.perf.massTO, I);
  return { designator:rwy.designator, qfu, tora:rwy.tora, toda:rwy.toda, asda:rwy.asda,
    todGross:r.obst, torGross:r.roll, lrGross:lr.roll, head, cross };
}
function perfSheetLDG(rwy, elevFt, slot){
  const qfu = effectiveQfu(rwy);
  if(qfu==null) return null;
  const p = perfAtmo(slot);
  const {pa,oat,isa,sig,slope} = perfSheetAtmoAt(elevFt, slot);
  const ang=(p.wdir-qfu)*Math.PI/180;
  const head = p.wspd*Math.cos(ang), cross = Math.abs(p.wspd*Math.sin(ang));
  const I = {pa,oat,isa,sig,qfu,tora:null,lda:null,slope,surf:p.surf,state:p.pstate,head,cross};
  const rDry = PERF_DA40.computeLDG(state.perf.flaps, state.perf.massLDG, I);
  const rUp = PERF_DA40.computeLDG('UP', state.perf.massLDG, I);
  return { designator:rwy.designator, qfu, lda:rwy.lda, ldGross:rDry.tot, ldWetGross:rDry.tot*1.25, ldFlaplessGross:rUp.tot, head, cross };
}
function perfSheetVerdict(avail, req){
  if(avail==null) return ['', '—'];
  return perfVerdict(avail, req);
}
function perfSheetWindTxt(head, cross){
  return (head>=0?'head '+head.toFixed(0):'tail '+Math.abs(head).toFixed(0))+'/cross '+cross.toFixed(0)+'kt';
}
// A clearway (CWY) or stopway (STW) doesn't need its own data entry: its presence and length are
// implied directly by the runway's own TORA/TODA/ASDA — TODA > TORA means a clearway exists (that's
// literally what makes TODA bigger than TORA), ASDA > TORA means a stopway exists, same logic.
function perfClearwayStopway(it){
  const hasCwy = it.toda != null && it.tora != null && it.toda > it.tora;
  const hasStw = it.asda != null && it.tora != null && it.asda > it.tora;
  return { hasCwy, hasStw, any: hasCwy||hasStw,
    cwyLen: hasCwy ? Math.round(it.toda-it.tora) : 0, stwLen: hasStw ? Math.round(it.asda-it.tora) : 0 };
}
// OPS 1.530 takeoff distance check (Part-CAT), correctly branching on CWY/STW presence instead of
// always applying the conservative "no CWY/STW" formula: with no clearway and no stopway, only
// TOD×1.25 ≤ TORA applies; with either one present, three separate checks all have to pass instead
// (TOD ≤ TORA, TOD×1.15 ≤ TODA, TOD×1.3 ≤ ASDA) — each against its own, larger, available distance.
function perfSheetTOChecksCAT(it){
  const cs = perfClearwayStopway(it);
  let checks;
  if(!cs.any){
    const req = it.todGross*1.25;
    const [vc,vt] = perfSheetVerdict(it.tora, req);
    checks = [{ label:'TOD ×1.25 ≤ TORA', avail:it.tora, req, vc, vt }];
  }else{
    const c1 = perfSheetVerdict(it.tora, it.todGross);
    const c2 = perfSheetVerdict(it.toda, it.todGross*1.15);
    const c3 = perfSheetVerdict(it.asda, it.todGross*1.3);
    checks = [
      { label:'TOD ≤ TORA', avail:it.tora, req:it.todGross, vc:c1[0], vt:c1[1] },
      { label:'TOD ×1.15 ≤ TODA', avail:it.toda, req:it.todGross*1.15, vc:c2[0], vt:c2[1] },
      { label:'TOD ×1.3 ≤ ASDA', avail:it.asda, req:it.todGross*1.3, vc:c3[0], vt:c3[1] },
    ];
  }
  const overall = checks.some(c=>c.vc==='bad') ? 'bad' : checks.some(c=>c.vc==='warn') ? 'warn' : 'ok';
  const overallLabel = overall==='bad'?'INSUFFICIENT':overall==='warn'?'LOW MARGIN':'OK';
  return Object.assign({ checks, overall, overallLabel }, cs);
}
