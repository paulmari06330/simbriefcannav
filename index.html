    const I = perfReadInputs('dep'); // la montée initiale se fait au départ
    const c = PERF_DA40.computeClimb(p.prop, I, I.head);
    climbHtml = climbSpeedsHtml('Vz initial climb', c.vz, c.gamma);
    if(mode==='cat'){
      const cc = PERF_DA40.computeClimbCruise(p.prop, I, I.head);
      climbHtml += climbSpeedsHtml('Vz cruise climb', cc.vz, cc.gamma)
        + `<div class="status-line" style="margin-top:6px;">Vz (N-1): not applicable — single-engine DA40.</div>`;
    }
    climbHtml += `<div class="status-line">Initial climb: table 5(a)-7/5(b)-7 (flaps T/O, 66 KIAS, 1150 kg)${mode==='cat' ? '. Cruise climb: table 5(a)-8/5(b)-8 (flaps UP, 78 KIAS, 1150 kg) — the ISA+35°C column of 5(b)-8 excluded from the calculation (identical to the ISA column across all 17 rows of the printed table, apparently a manufacturer document error), capped at ISA+30°C beyond that.' : ' — only the initial climb is required on the Part-NCO form.'}</div>`;
    const cruisePA = p.cruisePA ?? 4000;
    const cr = PERF_DA40.computeCruise('114', p.prop, p.loadPct, cruisePA);
    cruiseHtml = `
      <div class="perf-speeds">
        <div class="perf-spd"><div class="k">TAS</div><div class="v">${cr?cr.ktas.toFixed(0):'—'} kt</div></div>
        <div class="perf-spd"><div class="k">Consumption</div><div class="v">${cr?cr.usgh.toFixed(1):'—'} USG/h</div></div>
      </div>
      <div class="status-line" style="margin-top:4px;">Cruise at ${cruisePA} ft / ${p.loadPct}% — settings from the Climb &amp; Cruise tab above.</div>`;
  } else {
    const I = perfReadInputs('dep'); // la montée initiale se fait au départ
    const auto1 = PERF_DA40.climb01Estimate('to', p.massTO, I, I.head);
    const useManualTO = p.manualVzTO!=null && p.manualVzTO!=='';
    const m1 = useManualTO ? PERF_DA40.manualClimbFromVz('to', parseFloat(p.manualVzTO), p.massTO, I, I.head) : auto1;
    climbHtml = `
      <div class="status-line warn" style="margin-bottom:8px;">${escapeHtml(state.regTail)} (135 HP): the base AFM only gives Vz as a graphical chart. Estimate below calibrated on the chart's printed example (as for takeoff) — a single calibration point, cross-check with the paper chart before an actual flight. You can override the value with your own chart reading below.</div>
      ${climbSpeedsHtml('Vz initial climb'+(useManualTO?' (manual)':' (estimated)'), m1.vz, m1.gamma)}
      <div class="field" style="max-width:260px;margin-top:10px;"><label>Vz initial climb — override (ft/mn)</label>
          <input id="perf-manual-vz-to" type="number" step="10" placeholder="${Math.round(auto1.vz)}" value="${p.manualVzTO??''}"></div>`;
    if(mode==='cat'){
      const auto2 = PERF_DA40.climb01Estimate('cruise', p.massTO, I, I.head);
      const useManualCr = p.manualVzCruise!=null && p.manualVzCruise!=='';
      const m2 = useManualCr ? PERF_DA40.manualClimbFromVz('cruise', parseFloat(p.manualVzCruise), p.massTO, I, I.head) : auto2;
      climbHtml += climbSpeedsHtml('Vz cruise climb'+(useManualCr?' (manual)':' (estimated)'), m2.vz, m2.gamma)
        + `<div class="field" style="max-width:260px;margin-top:10px;"><label>Vz cruise climb — override (ft/mn)</label>
          <input id="perf-manual-vz-cruise" type="number" step="10" placeholder="${Math.round(auto2.vz)}" value="${p.manualVzCruise??''}"></div>
        <div class="status-line" style="margin-top:6px;">Vz (N-1): not applicable — single-engine DA40.</div>`;
    } else {
      climbHtml += `<div class="status-line" style="margin-top:6px;">Only the initial climb is required on the Part-NCO form.</div>`;
    }
    const cruisePA01 = p.cruisePA ?? 4000;
    const cr01 = PERF_DA40.computeCruise('01', '5a', p.loadPct, cruisePA01);
    cruiseHtml = `
      <div class="perf-speeds">
        <div class="perf-spd"><div class="k">TAS (estimated)</div><div class="v">${cr01?cr01.ktas.toFixed(0):'—'} kt</div></div>
        <div class="perf-spd"><div class="k">Consumption (estimated)</div><div class="v">${cr01?cr01.usgh.toFixed(1):'—'} USG/h</div></div>
        <div class="perf-spd"><div class="k">Consumption (estimated)</div><div class="v">${cr01?cr01.lh.toFixed(1):'—'} l/h</div></div>
      </div>
      <div class="status-line warn" style="margin-top:4px;">${escapeHtml(state.regTail)} (135 HP): the base AFM only gives cruise and fuel flow as graphical charts (no table). Estimate calibrated on each chart's printed example (1 point) — cross-check with the paper chart before an actual flight.</div>
      <div class="status-line" style="margin-top:4px;">Cruise at ${cruisePA01} ft / ${p.loadPct}% — settings from the Climb &amp; Cruise tab above.</div>`;
  }

  const catNote = `Matches the Cannes Aviation Part-CAT paper form: takeoff TOD×1.25 ≤ TORA (case
        without clearway/stopway, not tracked in the runway database — let me know if a runway has one);
        climb γ net = γ gross × 0.77; landing LD ≤ LDA×0.7 (CAT.POL.A.230) for destination, alternate 1 and
        alternate 2 (the Part-CAT paper form has 2 alternate boxes).`;
  const ncoNote = `Matches the Cannes Aviation Part-NCO paper form: takeoff TOD ≤ TODA and
        TOR+LR ≤ ASDA (TOR+LR = takeoff roll + landing roll with LDG flaps at takeoff mass,
        a proxy since there is no dedicated AFM accelerate-stop table); climb initial Vz only, γ = Vz/Gs (no
        net factor — that's a Part-CAT requirement with no Part-NCO equivalent); landing LD ≤ LDA,
        LD (wet ×1.25) ≤ LDA and LD (flaps up) ≤ LDA, for destination and Altn (the Part-NCO paper form
        has only one alternate box).`;

  const altnLabel = mode==='cat' ? 'alternate 1' : 'Altn';
  const sidBlock = mode==='cat' ? `
      <div class="card-title" style="font-size:12px;margin-top:14px;">🛬 Landing Performance — ${altn2Icao||'(alternate 2 not set)'} (alternate 2)</div>
      ${altn2Icao ? perfSheetLDGTable(altn2Items, mode) : `<div class="status-line">No alternate 2 set (field above).</div>`}

      <div class="card-title" style="font-size:12px;margin-top:14px;">🧭 SID — required gradients / MSA / MVL <span style="font-weight:400;text-transform:none;color:var(--text-2);">(manual entry from the charts, IFR only — leave blank for pure VFR)</span></div>
      <table>
        <thead><tr><th></th><th>SID</th><th>SID</th><th>SID</th><th>SID</th></tr></thead>
        <tbody>
          ${perfSheetSidRow('Required gradient %','pente')}
          ${perfSheetSidRow('MSA (ft)','msa')}
          ${perfSheetSidRow('MVL (ft)','mvl')}
        </tbody>
      </table>` : '';

  return `
    <div class="card" style="margin-top:14px;border:1px solid var(--accent);">
      <div class="card-title">📋 Performance Sheet (${escapeHtml(ac.label)}, ${escapeHtml(state.regTail)})</div>
      <div class="perf-tabs" style="margin:8px 0 12px;">
        <button class="btn ${mode==='cat'?'btn-primary':''}" id="btn-sheetmode-cat" type="button">Part-CAT</button>
        <button class="btn ${mode==='nco'?'btn-primary':''}" id="btn-sheetmode-nco" type="button">Part-NCO</button>
      </div>
      <div class="status-line" style="margin-bottom:10px;">
        ${mode==='cat' ? catNote : ncoNote} Uses the field elevation from the verified database per airport
        (otherwise the Field elevation field entered for that airport), and each airport's own
        QNH/OAT/slope/surface/condition/wind — switch the airport context above (Departure/Destination/
        Alternate/Alternate 2) to enter different conditions for each one.
      </div>
      ${mode==='cat' ? `<div class="field" style="max-width:200px;margin-bottom:12px;"><label>Alternate 2 (ICAO)</label>
        <input id="perf-altn2" type="text" maxlength="4" placeholder="e.g. LFMV" value="${escapeHtml(p.altn2Icao||'')}" style="text-transform:uppercase;"></div>` : ''}

      <div class="card-title" style="font-size:12px;">🛫 Takeoff Performance — ${depIcao||'(enter the departure)'}</div>
      ${depIcao ? perfSheetTOTable(toItems, mode) : `<div class="status-line warn">Enter the departure airport in Flight Info.</div>`}
      <div class="status-line" style="margin-top:4px;">OPS 1.530 (grass/slope/condition) already applied in the TOD above, via the Runway/Surface/Condition settings in the Takeoff tab.</div>

      <div class="card-title" style="font-size:12px;margin-top:14px;">📈 Climb Performance</div>
      ${climbHtml}

      <div class="card-title" style="font-size:12px;margin-top:14px;">✈️ Cruise Performance</div>
      ${cruiseHtml}

      <div class="card-title" style="font-size:12px;margin-top:14px;">🛬 Landing Performance — ${destIcao||'(enter the destination)'} (destination)</div>
      ${destIcao ? perfSheetLDGTable(destItems, mode) : `<div class="status-line warn">Enter the destination airport in Flight Info.</div>`}

      <div class="card-title" style="font-size:12px;margin-top:14px;">🛬 Landing Performance — ${altn1Icao||`(${altnLabel} not set)`} (${altnLabel})</div>
      ${altn1Icao ? perfSheetLDGTable(altn1Items, mode) : `<div class="status-line">No alternate set (Alternate field in Flight Info).</div>`}
      ${sidBlock}
    </div>`;
}

function renderPerfSection(opts){
  const simplified = !!(opts && opts.simplified);
  const ac = AIRCRAFT_DB[state.aircraft];
  if(state.aircraft!=='DA40'){
    return `<div class="empty-state">Takeoff/landing performance available only for the DA40 for now.</div>`;
  }
  const p = state.perf;
  const eng114 = (ac.perf114Tails||[]).includes(state.regTail);
  if(p.tab==='climb' && (!eng114 || simplified)) p.tab='to';
  const mnb = computeMnB();
  if(!p.massTOTouched) p.massTO = Math.round(mnb.toMass);
  if(!p.massLDGTouched) p.massLDG = Math.round(mnb.ldgMass);
  const a = perfAtmo(); // contexte atmo/piste actuellement affiché (dep/dest/altn/altn2)
  // La montée initiale part toujours du terrain de départ, quel que soit le contexte affiché
  // (le sélecteur d'aérodrome est masqué sur cet onglet — voir plus bas).
  const I = p.tab==='climb' ? perfReadInputs('dep') : perfReadInputs();

  const engBadge = eng114
    ? `${escapeHtml(state.regTail)} · TAE 125-02-114 · <b style="color:var(--accent);">155 HP — exact tables</b>`
    : `${escapeHtml(state.regTail)} · TAE 125-01 · <b style="color:var(--warn);">135 HP — estimated chart</b>`;

  const propField = eng114 ? `
    <div class="field"><label>Propeller</label>
      <select id="perf-prop">
        <option value="5a" ${p.prop==='5a'?'selected':''}>MTV-6-A/187-129 — table 5(a)</option>
        <option value="5b" ${p.prop==='5b'?'selected':''}>MTV-6-A/190-69 — table 5(b)</option>
      </select></div>` : '';

  // Sélecteur de contexte aérodrome : chaque bouton correspond à son propre jeu de vent/QNH/OAT/
  // élévation/piste (perfAtmo(slot)), indépendant des autres — plus de vent partagé entre dep/dest/altn.
  const slotBtn = (slot, label, icao) => `<button class="btn ${p.slot===slot?'btn-primary':''}" data-perf-slot="${slot}" type="button">${label}${icao?' ('+escapeHtml(icao)+')':''}</button>`;
  const slotSelector = `
    <div class="status-line" style="margin-bottom:4px;">Airport context — each has its own wind/QNH/OAT/runway:</div>
    <div class="field-row" style="margin-bottom:10px;">
      ${slotBtn('dep','Departure', state.depIcao)}
      ${slotBtn('dest','Destination', state.destIcao)}
      ${slotBtn('altn','Alternate', state.altnIcao)}
      ${(p.regMode==='cat' || p.altn2Icao) ? slotBtn('altn2','Alternate 2', p.altn2Icao) : ''}
    </div>`;

  const atmoFields = `
    <div class="field-row">
      <div class="field"><label>Field elevation (ft)</label><input id="perf-elev" type="number" step="10" value="${a.elev}"></div>
      <div class="field"><label>QNH</label>
        <div style="display:flex;gap:4px;">
          <input id="perf-qnh" type="number" step="${a.qnhUnit==='inhg'?'0.01':'1'}" value="${a.qnh}" style="flex:1;">
          <select id="perf-qnhunit" style="max-width:76px;"><option value="hpa" ${a.qnhUnit==='hpa'?'selected':''}>hPa</option><option value="inhg" ${a.qnhUnit==='inhg'?'selected':''}>inHg</option></select>
        </div></div>
      <div class="field"><label>OAT (°C)</label><input id="perf-oat" type="number" step="1" value="${a.oat}"></div>
      <div class="field"><label>Runway QFU (° mag.)</label><input id="perf-qfu" type="number" min="0" max="360" step="1" value="${a.qfu}"></div>
    </div>
    <div class="field-row" style="margin-top:12px;">
      <div class="field"><label>Wind — direction (° true)</label><input id="perf-wdir" type="number" min="0" max="360" step="1" value="${a.wdir}"></div>
      <div class="field"><label>Wind — speed (kt)</label><input id="perf-wspd" type="number" min="0" step="1" value="${a.wspd}"></div>
    </div>`;
  const runwayFields = `
    <div class="field-row" style="margin-top:12px;">
      <div class="field"><label>Available TORA (m)</label><input id="perf-tora" type="number" step="10" value="${a.tora}"></div>
      <div class="field"><label>Available LDA (m)</label><input id="perf-lda" type="number" step="10" value="${a.lda}"></div>
      <div class="field"><label>Runway slope (%)</label>
        <div style="display:flex;gap:4px;">
          <input id="perf-slope" type="number" min="0" max="5" step="0.1" value="${a.slope}" style="flex:1;">
          <select id="perf-slopedir" style="max-width:110px;"><option value="up" ${a.slopeDir==='up'?'selected':''}>Uphill</option><option value="down" ${a.slopeDir==='down'?'selected':''}>Downhill</option></select>
        </div></div>
      <div class="field"><label>Surface</label>
        <select id="perf-surf">
          <option value="0" ${a.surf==='0'?'selected':''}>Paved</option>
          <option value="g5" ${a.surf==='g5'?'selected':''}>Grass ≤5cm</option>
          <option value="g10" ${a.surf==='g10'?'selected':''}>Grass 5–10cm</option>
          <option value="g25" ${a.surf==='g25'?'selected':''}>Grass &gt;10cm</option>
        </select></div>
    </div>
    <div class="field-row" style="margin-top:12px;">
      <div class="field"><label>Runway condition</label>
        <select id="perf-pstate"><option value="dry" ${a.pstate==='dry'?'selected':''}>Dry</option><option value="wet" ${a.pstate==='wet'?'selected':''}>Wet</option></select></div>
    </div>`;

  const isaTxt=(I.isa>=0?'+':'')+I.isa.toFixed(0);
  const atmoLine = `<div class="status-line">Pressure alt ${perfFmt(I.pa)} ft · ISA dev ${isaTxt}°C · σ ${I.sig.toFixed(3)} · wind ${I.head>=0?'head':'tail'} ${Math.abs(I.head).toFixed(0)} kt, cross ${I.cross.toFixed(0)} kt</div>`;

  let body;
  if(p.tab==='to'){
    const r = PERF_DA40.computeTO(eng114?'114':'01', p.prop, p.massTO, I);
    const [vc,vt] = perfVerdict(r.avail, r.obst);
    const marg = r.avail - r.obst;
    body = `
      <div class="field-row" style="margin-bottom:12px;">
        <div class="field"><label>Takeoff mass (kg)</label><input id="perf-mass-to" type="number" step="5" value="${p.massTO}"></div>
        <div class="field" style="justify-content:flex-end;"><label>&nbsp;</label><span class="status-line" style="margin:0;">pre-filled from TOM (M&amp;B): ${Math.round(mnb.toMass)} kg</span></div>
      </div>
      <div class="perf-speeds">
        <div class="perf-spd"><div class="k">V<sub>R</sub></div><div class="v">${r.vr} kt</div></div>
        <div class="perf-spd"><div class="k">V initial climb</div><div class="v">${r.vcl} kt</div></div>
        <div class="perf-spd"><div class="k">Flaps</div><div class="v">T/O</div></div>
      </div>
      <div class="perf-big">
        <div class="perf-box"><div class="k">Takeoff ground roll</div><div class="v">${perfFmt(r.roll)} m</div><div class="x">${r.est?'ground roll · estimated (chart)':'ground roll · exact table'}</div></div>
        <div class="perf-box accent"><div class="k">Distance / 15 m obstacle</div><div class="v">${perfFmt(r.obst)} m</div><div class="x">${r.est?'estimated (chart) · limiting factor':'take-off distance · limiting factor'}</div></div>
      </div>
      <div class="perf-rwybox">
        <div class="perf-rwyhead"><div class="t">Runway · QFU ${String(Math.round(a.qfu)).padStart(2,'0')}</div><div class="perf-verdict ${vc}">${vt} · ${marg>=0?'+':''}${perfFmt(marg)} m</div></div>
        ${perfRunwaySVG(r.avail, r.obst, r.roll, a.qfu)}
      </div>
      ${perfNotesHTML(r.notes)}
      <div class="perf-src">${eng114?'Source: exact table from the AFM/POH supplement (-114 engine).':'Source: base AFM chart — estimate calibrated on 2 reference points from the chart, see method below.'}</div>`;
  }else if(p.tab==='ldg'){
    const r = PERF_DA40.computeLDG(p.flaps, p.massLDG, I);
    const [vc,vt] = perfVerdict(r.avail, r.tot);
    const marg = r.avail - r.tot;
    body = `
      <div class="field-row" style="margin-bottom:12px;">
        <div class="field"><label>Landing mass (kg)</label><input id="perf-mass-ldg" type="number" step="5" value="${p.massLDG}"></div>
        <div class="field" style="justify-content:flex-end;"><label>&nbsp;</label><span class="status-line" style="margin:0;">pre-filled from estimated LDM (M&amp;B): ${Math.round(mnb.ldgMass)} kg</span></div>
      </div>
      <div class="perf-speeds">
        <div class="perf-spd"><div class="k">V approach</div><div class="v">${r.vapp} kt</div></div>
        <div class="perf-spd" style="flex:2;min-width:180px;"><div class="k">Flap configuration</div>
          <div class="perf-tabs" style="margin:4px 0 0;">
            <button class="btn ${p.flaps==='LDG'?'btn-primary':''}" id="perf-flaps-ldg" type="button">Flaps LDG</button>
            <button class="btn ${p.flaps==='UP'?'btn-primary':''}" id="perf-flaps-up" type="button">Flaps UP</button>
          </div></div>
      </div>
      <div class="perf-big">
        <div class="perf-box"><div class="k">Landing ground roll</div><div class="v">${perfFmt(r.roll)} m</div><div class="x">ground roll · estimated</div></div>
        <div class="perf-box accent"><div class="k">Distance / 15 m obstacle</div><div class="v">${perfFmt(r.tot)} m</div><div class="x">landing distance · estimated</div></div>
      </div>
      <div class="perf-rwybox">
        <div class="perf-rwyhead"><div class="t">Runway · QFU ${String(Math.round(a.qfu)).padStart(2,'0')}</div><div class="perf-verdict ${vc}">${vt} · ${marg>=0?'+':''}${perfFmt(marg)} m</div></div>
        ${perfRunwaySVG(r.avail, r.tot, r.roll, a.qfu)}
      </div>
      ${perfNotesHTML(r.notes)}
      <div class="perf-src">Source: ISA/MSL values printed in the base AFM (§${p.flaps==='LDG'?'5.3.11':'5.3.12'}), identical for the whole fleet, then corrected for mass/density/wind/runway.</div>`;
  }else{
    // ---- Climb & Cruise (F-HOVE / F-GZMP only — tabulated 114 HP data) ----
    if(p.cruisePA==null){ p.cruisePA = Math.min(16000, Math.max(0, Math.round((state.cruiseAlt||3000)/2000)*2000)); }
    const c = PERF_DA40.computeClimb(p.prop, I, I.head);
    const cr = PERF_DA40.computeCruise('114', p.prop, p.loadPct, p.cruisePA);
    const loadOptions = [50,60,70,80,90,100].map(v=>`<option value="${v}" ${p.loadPct===v?'selected':''}>${v}%</option>`).join('');
    const paOptions = [0,2000,4000,6000,8000,10000,12000,14000,16000].map(v=>`<option value="${v}" ${p.cruisePA===v?'selected':''}>${v} ft</option>`).join('');
    body = `
      <div class="status-line" style="margin-bottom:10px;">Computed from tables 5(a)-7/5(b)-7 (initial climb, flaps T/O, MAX, 1150 kg) and 5(a)-11/5(b)-11 (cruise, standard tanks) of the AFM/POH supplement — propeller ${p.prop==='5b'?'MTV-6-A/190-69':'MTV-6-A/187-129'}.</div>
      <div class="card" style="margin-bottom:14px;">
        <div class="card-title">Climb Performances</div>
        <div class="perf-speeds">
          <div class="perf-spd"><div class="k">Vz (initial climb)</div><div class="v">${Math.round(c.vz)} ft/mn</div></div>
          <div class="perf-spd"><div class="k">Climb IAS</div><div class="v">${c.iasKt} kt</div></div>
          <div class="perf-spd"><div class="k">Climb TAS</div><div class="v">${c.tas.toFixed(0)} kt</div></div>
          <div class="perf-spd"><div class="k">Climb GS</div><div class="v">${c.gsKt.toFixed(0)} kt</div></div>
        </div>
        <div class="status-line" style="margin-top:2px;">γ (%) = Vz / GS = ${Math.round(c.vz)} / ${(c.gsKt*101.269).toFixed(0)} = <b style="color:var(--text-0);">${c.gamma.toFixed(2)} %</b></div>
        <div class="status-line" style="margin-top:6px;">Vz tabulated only at MTOW 1150 kg (the AFM does not give initial climb at reduced mass) — at a lower mass, the real Vz is better than what's shown here.</div>
      </div>
      <div class="card">
        <div class="card-title">Cruise Performances</div>
        <div class="field-row" style="margin-bottom:10px;">
          <div class="field"><label>Cruise altitude</label><select id="perf-cruisepa">${paOptions}</select></div>
          <div class="field"><label>% Power</label><select id="perf-loadpct">${loadOptions}</select></div>
        </div>
        <div class="perf-speeds">
          <div class="perf-spd"><div class="k">TAS</div><div class="v">${cr?cr.ktas.toFixed(0):'—'} kt</div></div>
          <div class="perf-spd"><div class="k">Consumption</div><div class="v">${cr?cr.usgh.toFixed(1):'—'} USG/h</div></div>
          <div class="perf-spd"><div class="k">Consumption</div><div class="v">${cr?cr.lh.toFixed(1):'—'} l/h</div></div>
        </div>
        ${p.loadPct>75?`<div class="status-line" style="margin-top:6px;color:var(--warn);">AFM: cruise power &gt;75% not recommended. For economical cruise, set ≤70%.</div>`:''}
        ${cr&&cr.outOfRange?`<div class="status-line" style="margin-top:6px;color:var(--warn);">This power setting isn't tabulated at this altitude — value shown capped at ${cr.maxPA} ft (max tabulated altitude for ${p.loadPct}%).</div>`:''}
      </div>
      <div class="perf-src">Source: exact tables from the AFM/POH supplement (-114 engine) — F-HOVE / F-GZMP only.</div>`;
  }

  // Banner showing the runway currently used for the calculation — more visible than just the
  // number in the diagram. Reliable (ICAO+designator source) if the current QFU actually comes
  // from the last runway lookup, otherwise the runway is inferred from the QFU alone (rounded to
  // the nearest multiple of 10).
  const rwyQfuTxt = String(Math.round(norm360(a.qfu))).padStart(3,'0');
  const rwySrc = (p.oaApplied && p.oaApplied.slot===p.slot && p.oaApplied.qfu===a.qfu) ? p.oaApplied : null;
  const rwyDeduced = String(Math.round(norm360(a.qfu)/10)%36 || 36).padStart(2,'0');
  const rwyBanner = `
    <div class="perf-rwybox" style="margin-bottom:10px;border-color:var(--accent);">
      <div class="perf-rwyhead" style="margin-bottom:0;">
        <div class="t" style="font-size:13px;">🧭 Runway in use: <b style="color:var(--accent);">${rwySrc ? escapeHtml(rwySrc.icao)+' RWY '+escapeHtml(rwySrc.designator) : 'RWY '+rwyDeduced+' (inferred from QFU, not linked to an airport)'}</b></div>
        <div style="font-size:11px;color:var(--text-2);">QFU ${rwyQfuTxt}° · TORA ${perfFmt(a.tora)} m · LDA ${perfFmt(a.lda)} m</div>
      </div>
    </div>`;

  return `
    <div class="status-line" style="margin-bottom:10px;">${engBadge}</div>
    <div class="perf-tabs">
      <button class="btn ${p.tab==='to'?'btn-primary':''}" id="perf-tab-to" type="button">🛫 Takeoff</button>
      <button class="btn ${p.tab==='ldg'?'btn-primary':''}" id="perf-tab-ldg" type="button">🛬 Landing</button>
      ${(!simplified && eng114)?`<button class="btn ${p.tab==='climb'?'btn-primary':''}" id="perf-tab-climb" type="button">📈 Climb &amp; Cruise</button>`:''}
      ${!simplified?`<button class="btn ${p.showSheet?'btn-primary':''}" id="perf-tab-sheet" type="button">📋 Part-CAT/NCO Sheet</button>`:''}
    </div>
    ${p.tab!=='climb'?slotSelector:''}
    ${(p.tab==='to'||p.tab==='ldg')?rwyBanner:''}
    <div class="field-row">${propField}</div>
    ${p.tab!=='climb'?`<div class="status-line" style="margin-bottom:4px;">Fetch runway (TORA/TODA/ASDA/LDA) — verified database first, then official eAIP (SIA), fallback to OpenAIP if unavailable:</div>
    ${renderPerfOpenAip()}
    ${renderPerfRwyDBManager()}`:''}
    ${atmoFields}
    ${p.tab!=='climb'?runwayFields:''}
    ${p.tab!=='climb'?atmoLine:''}
    <div style="margin-top:14px;">${body}</div>
    <details class="perf-method">
      <summary>Method &amp; calculation limits</summary>
      <div class="body">
        <b>F-HOVE / F-GZMP (155 HP)</b>: takeoff, initial climb and cruise read directly from
        tables 5(a)/5(b) of the AFM/POH supplement (mass/PA/ISA deviation interpolation, or PA/%power for
        cruise) — exact values, no estimation.<br><br>
        <b>Rest of the fleet (135 HP)</b>: the base AFM only gives takeoff as a chart
        (nomogram), no table; climb/cruise are not available for these aircraft in the tool.
        The shape of the takeoff variation (mass/altitude/temperature) is taken from the -114 table above,
        scaled by two factors calibrated on the numeric examples printed on the chart itself
        (K roll = 1.109; K distance/obstacle = 1.250). This is an estimate — cross-check with the paper chart
        of the AFM before an actual flight.<br><br>
        <b>Landing</b>: ISA/MSL baseline printed in full in the AFM (identical for the whole
        fleet), corrected for mass (proportional), density (1/σ), wind (GS² law) and runway (grass by
        length, slope, condition) per the AFM notes: grass ≤5cm +5% roll; 5–10cm +15%; &gt;10cm
        +25%; 2% slope ≈ +10% distance (downhill for landing); wet runway: conservative
        margin not in the AFM (+15% roll).<br><br>
        <b>Takeoff — regulatory increases (OPS 1.530)</b>: dry grass TOD ×1.2; wet grass
        TOD ×1.3; hard runway (dry or wet) ×1.0 (no regulatory increase on wet hard
        runway); uphill runway: TOD +5% per 1% slope. These factors replace, for takeoff
        only, the old empirical increases by grass length — landing keeps its own
        (AFM, above). Wind: linear model (takeoff) / GS² (landing), calibrated on
        the chart, not from a dedicated AFM table.<br><br>
        <b>Initial climb</b>: Vz read from tables 5(a)-7/5(b)-7 (flaps T/O, MAX power, 1150 kg
        only — the AFM doesn't tabulate any other mass). TAS obtained by density conversion of the climb
        IAS (66 kt); GS = TAS − headwind component along the QFU axis; γ(%) = Vz / GS (converted to
        ft/mn).<br><br>
        <b>Cruise</b>: TAS and fuel flow read from tables 5(a)-11/5(b)-11 (standard tanks),
        by altitude and %power step. Fuel flow is independent of altitude in these
        tables (function of %power only); the AFM recommends against cruise power &gt;75%.
      </div>
    </details>
    ${(!simplified && p.showSheet) ? renderPerfSheet() : ''}`;
}
function wirePerfInputs(){
  const bind = (id, cb) => { const el=document.getElementById(id); if(el) el.addEventListener('change', cb); };
  bind('perf-prop', e=>{ state.perf.prop=e.target.value; renderContent(); });
  bind('perf-elev', e=>{ perfAtmo().elev=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-qnh', e=>{ perfAtmo().qnh=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-qnhunit', e=>{
    const atmo = perfAtmo();
    const was=atmo.qnhUnit, nu=e.target.value;
    if(was!=='inhg'&&nu==='inhg') atmo.qnh = +(atmo.qnh/33.8639).toFixed(2);
    if(was==='inhg'&&nu==='hpa') atmo.qnh = Math.round(atmo.qnh*33.8639);
    atmo.qnhUnit=nu; renderContent();
  });
  bind('perf-oat', e=>{ perfAtmo().oat=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-qfu', e=>{ perfAtmo().qfu=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-tora', e=>{ perfAtmo().tora=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-lda', e=>{ perfAtmo().lda=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-slope', e=>{ perfAtmo().slope=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-slopedir', e=>{ perfAtmo().slopeDir=e.target.value; renderContent(); });
  bind('perf-surf', e=>{ perfAtmo().surf=e.target.value; renderContent(); });
  bind('perf-pstate', e=>{ perfAtmo().pstate=e.target.value; renderContent(); });
  bind('perf-wdir', e=>{ perfAtmo().wdir=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-wspd', e=>{ perfAtmo().wspd=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-mass-to', e=>{ state.perf.massTO=parseFloat(e.target.value)||0; state.perf.massTOTouched=true; renderContent(); });
  bind('perf-mass-ldg', e=>{ state.perf.massLDG=parseFloat(e.target.value)||0; state.perf.massLDGTouched=true; renderContent(); });
  bind('perf-cruisepa', e=>{ state.perf.cruisePA=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-loadpct', e=>{ state.perf.loadPct=parseFloat(e.target.value)||70; state.perf.loadPctTouched=true; renderContent(); });
  bind('perf-altn2', e=>{ state.perf.altn2Icao=e.target.value.toUpperCase().trim(); renderContent(); });
  bind('perf-manual-vz-to', e=>{ state.perf.manualVzTO = e.target.value===''?null:parseFloat(e.target.value); renderContent(); });
  bind('perf-manual-vz-cruise', e=>{ state.perf.manualVzCruise = e.target.value===''?null:parseFloat(e.target.value); renderContent(); });
  document.querySelectorAll('[data-perf-slot]').forEach(b=>{
    b.addEventListener('click', ()=>{ perfSwitchSlot(b.dataset.perfSlot); renderContent(); });
  });
  document.querySelectorAll('[data-sid-col]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const i = parseInt(e.target.dataset.sidCol,10), key = e.target.dataset.sidKey;
      if(!state.perf.sidCols) state.perf.sidCols = [{},{},{},{}];
      if(!state.perf.sidCols[i]) state.perf.sidCols[i] = {};
      state.perf.sidCols[i][key] = e.target.value;
    });
  });
  const btnTO = document.getElementById('perf-tab-to'); if(btnTO) btnTO.onclick=()=>{ state.perf.tab='to'; renderContent(); };
  const btnLDG = document.getElementById('perf-tab-ldg'); if(btnLDG) btnLDG.onclick=()=>{ state.perf.tab='ldg'; renderContent(); };
  const btnClimb = document.getElementById('perf-tab-climb'); if(btnClimb) btnClimb.onclick=()=>{ state.perf.tab='climb'; renderContent(); };
  const btnSheet = document.getElementById('perf-tab-sheet'); if(btnSheet) btnSheet.onclick=()=>{ state.perf.showSheet = !state.perf.showSheet; renderContent(); };
  const btnSheetCat = document.getElementById('btn-sheetmode-cat'); if(btnSheetCat) btnSheetCat.onclick=()=>{ state.perf.regMode='cat'; renderContent(); };
  const btnSheetNco = document.getElementById('btn-sheetmode-nco'); if(btnSheetNco) btnSheetNco.onclick=()=>{ state.perf.regMode='nco'; renderContent(); };
  const btnFL = document.getElementById('perf-flaps-ldg'); if(btnFL) btnFL.onclick=()=>{ state.perf.flaps='LDG'; renderContent(); };
  const btnFU = document.getElementById('perf-flaps-up'); if(btnFU) btnFU.onclick=()=>{ state.perf.flaps='UP'; renderContent(); };
  wirePerfOpenAip();
  wirePerfRwyDBManager();
}

/* ============================= MAP ============================= */
const OPENAIP_LAYER_DEFS = [
  { key:'openaip', label:'OpenAIP (airspaces, airports, reporting points, nav aids)' },
];
function buildOpenAipLayer(key){
  return L.tileLayer(
    `https://{s}.api.tiles.openaip.net/api/data/${key}/{z}/{x}/{y}.png?apiKey=${encodeURIComponent(state.openaipApiKey)}`,
    { attribution:'&copy; <a href="https://www.openaip.net/">openAIP</a> data (CC-BY-NC 4.0)', subdomains:['a','b','c'],
      minZoom:4, minNativeZoom:7, maxNativeZoom:14, maxZoom:16, opacity:0.9 }
  );
}
function rebuildOpenAipLayers(){
  if(!map) return;
  OPENAIP_LAYER_DEFS.forEach(def=>{
    const wasOnMap = openaipLayers[def.key] && map.hasLayer(openaipLayers[def.key]);
    if(openaipLayers[def.key]){ layersControl.removeLayer(openaipLayers[def.key]); map.removeLayer(openaipLayers[def.key]); }
    if(!state.openaipApiKey) return;
    openaipLayers[def.key] = buildOpenAipLayer(def.key);
    layersControl.addOverlay(openaipLayers[def.key], def.label);
    if(wasOnMap) openaipLayers[def.key].addTo(map);
  });
}
function initMap(){
  const initCenter = state.mapView ? [state.mapView.lat, state.mapView.lng] : [43.5417,6.9531];
  const initZoom = state.mapView ? state.mapView.zoom : 10;
  map = L.map('map', {zoomControl:true}).setView(initCenter, initZoom);

  osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
  });
  satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '&copy; Esri, Maxar, Earthstar Geographics', maxZoom: 19
  });

  (state.mapBase === 'satellite' ? satelliteLayer : osmLayer).addTo(map);
  layersControl = L.control.layers(
    { 'OpenStreetMap': osmLayer, 'Satellite (Esri)': satelliteLayer },
    {}, { position:'topright', collapsed:false }
  ).addTo(map);
  if(state.openaipApiKey) rebuildOpenAipLayers();
  if(state.mapOpenAipOn && openaipLayers.openaip) openaipLayers.openaip.addTo(map);

  map.on('baselayerchange', e=>{ state.mapBase = (e.name==='Satellite (Esri)') ? 'satellite' : 'osm'; });
  map.on('overlayadd', e=>{ if(e.layer===openaipLayers.openaip) state.mapOpenAipOn = true; });
  map.on('overlayremove', e=>{ if(e.layer===openaipLayers.openaip) state.mapOpenAipOn = false; });
  map.on('moveend', ()=>{ const c=map.getCenter(); state.mapView = {lat:c.lat, lng:c.lng, zoom:map.getZoom()}; });

  map.on('click', e=>{
    if(state.placingAlternate){
      state.alternatePoint = { lat: e.latlng.lat, lon: e.latlng.lng };
      state.placingAlternate = false;
      renderContent();
      showToast('Alternate point placed ✓');
      return;
    }
    const id = uid++;
    const name = 'WP' + (state.waypoints.length + 1);
    state.waypoints.push({ id, name, lat: e.latlng.lat, lon: e.latlng.lng, windDir:null, windSpeed:null, manual:false, alt: state.cruiseAlt });
    state.legs = [];
    renderContent();
  });
}
function refreshMap(){
  requestAnimationFrame(()=>{
    const container = document.getElementById('map');
    if(!container) return;
    if(map && map.getContainer() === container){
      map.invalidateSize();
      renderMapMarkers();
      return;
    }
    if(map){ map.remove(); map = null; }
    initMap();
    renderMapMarkers();
  });
}
function renderMapMarkers(){
  mapMarkers.forEach(m=>map.removeLayer(m)); mapMarkers=[];
  if(mapLine){ map.removeLayer(mapLine); mapLine=null; }
  const latlngs = [];
  state.waypoints.forEach((wp,i)=>{
    const isTOD = wp.name && wp.name.toUpperCase().startsWith('TOD');
    const bg = isTOD ? '#e0a856' : (i===0?'#4fd1a5':(i===state.waypoints.length-1?'#e0685f':'#5b8cff'));
    const shape = isTOD ? 'border-radius:6px;transform:rotate(45deg);' : 'border-radius:50%;';
    const inner = isTOD ? `<span style="transform:rotate(-45deg);">↓</span>` : `${i+1}`;
    const icon = L.divIcon({
      html: `<div style="background:${bg}; ${shape}
        color:#06231a;width:24px;height:24px;display:flex;align-items:center;justify-content:center;
        font-weight:700;font-size:11px;border:2px solid #0b0d12;box-shadow:0 2px 6px rgba(0,0,0,0.5);">${inner}</div>`,
      className:'', iconSize:[24,24], iconAnchor:[12,12]
    });
    const m = L.marker([wp.lat,wp.lon],{icon, draggable:true}).addTo(map)
      .bindTooltip(wp.name + (isTOD ? ` (Top of Descent, ${Math.round(wp.alt)} ft)` : ''), {permanent:false, direction:'top'});
    m.on('dragend', ()=>{ const ll = m.getLatLng(); wp.lat = ll.lat; wp.lon = ll.lng; state.legs=[]; renderContent(); });
    mapMarkers.push(m);
    latlngs.push([wp.lat,wp.lon]);
  });
  if(latlngs.length>1){ mapLine = L.polyline(latlngs, {color:'#4fd1a5', weight:2, dashArray:'5,5'}).addTo(map); }

  if(state.alternatePoint){
    const ap = state.alternatePoint;
    const icon = L.divIcon({
      html: `<div style="background:#b06be0;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
        clip-path:polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
        color:#1a0b23;font-weight:700;font-size:11px;box-shadow:0 2px 6px rgba(0,0,0,0.5);">A</div>`,
      className:'', iconSize:[22,22], iconAnchor:[11,11]
    });
    const m = L.marker([ap.lat, ap.lon], {icon, draggable:true}).addTo(map)
      .bindTooltip('Alternate' + (state.altnIcao?(' — '+state.altnIcao):''), {permanent:false, direction:'top'});
    m.on('dragend', ()=>{ const ll = m.getLatLng(); state.alternatePoint = {lat:ll.lat, lon:ll.lng}; renderContent(); });
    mapMarkers.push(m);
    if(state.waypoints.length>0){
      const dest = state.waypoints[state.waypoints.length-1];
      const altnLine = L.polyline([[dest.lat,dest.lon],[ap.lat,ap.lon]], {color:'#b06be0', weight:2, dashArray:'3,6'}).addTo(map);
      mapMarkers.push(altnLine);
    }
  }
}

/* ============================= BOOTSTRAP ============================= */
function renderAll(){
  renderTopbar();
  renderContent(); // renderContent() now also refreshes the map via refreshMap()
}
(async function boot(){
  renderShell();
  try{
    const res = await appStorage.get('app_settings');
    if(res && res.value){ const s = JSON.parse(res.value); if(s.openaipApiKey) state.openaipApiKey = s.openaipApiKey; }
  }catch(e){}
  try{
    const res = await appStorage.get('rwy_db');
    state.perf.rwyDB = (res && res.value) ? JSON.parse(res.value) : JSON.parse(JSON.stringify(VERIFIED_RWY_SEED));
  }catch(e){ state.perf.rwyDB = JSON.parse(JSON.stringify(VERIFIED_RWY_SEED)); }
  await loadSavedIndex();
  renderAll();
})();
</script>
