<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFR Nav</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
@import url('https://cdnjs.cloudflare.com/ajax/libs/inter-ui/3.19.3/inter.min.css');

:root{
  --bg-0:#0b0d12; --bg-1:#12151c; --bg-2:#181c25; --bg-3:#1f242f;
  --border:#2a3040; --border-soft:#232834;
  --text-0:#e9ecf1; --text-1:#aab1c2; --text-2:#6b7385;
  --accent:#4fd1a5; --accent-dim:#245c48; --accent-blue:#5b8cff;
  --warn:#e0a856; --danger:#e0685f;
  --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}
*{box-sizing:border-box;min-width:0;}
html,body{margin:0;height:100%;background:var(--bg-0);color:var(--text-0);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;font-size:13px;}
#app{display:flex;height:100vh;overflow:hidden;}

.sidebar{width:200px;flex-shrink:0;background:var(--bg-1);border-right:1px solid var(--border-soft);
  display:flex;flex-direction:column;padding:16px 0;overflow-y:auto;}
.brand{padding:0 16px 16px 16px;border-bottom:1px solid var(--border-soft);margin-bottom:8px;}
.brand-name{font-weight:700;font-size:15px;letter-spacing:0.3px;}
.brand-name span{color:var(--accent);}
.brand-sub{font-size:9.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.nav-item{padding:9px 16px;color:var(--text-1);cursor:pointer;font-size:12.5px;border-left:2px solid transparent;
  display:flex;align-items:center;gap:8px;}
.nav-item:hover{background:var(--bg-2);color:var(--text-0);}
.nav-item.active{background:var(--bg-2);color:var(--text-0);border-left-color:var(--accent);font-weight:600;}
.nav-section-title{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-2);
  padding:12px 16px 4px 16px;}
.saved-list{overflow-y:auto;}
.saved-item{padding:8px 16px;font-size:11.5px;color:var(--text-1);cursor:pointer;border-left:2px solid transparent;}
.saved-item:hover{background:var(--bg-2);color:var(--text-0);}
.saved-item .sf-name{color:var(--text-0);font-weight:500;}
.saved-item .sf-meta{color:var(--text-2);font-size:10px;margin-top:1px;}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.topbar{background:var(--bg-1);border-bottom:1px solid var(--border-soft);padding:11px 20px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.topbar-title{font-weight:700;font-size:14.5px;margin-right:6px;white-space:nowrap;}
.pill-badge{background:var(--accent-dim);color:var(--accent);font-size:9.5px;padding:3px 9px;border-radius:10px;
  text-transform:uppercase;letter-spacing:0.5px;font-weight:600;}
.spacer{flex:1;}
.btn{background:var(--bg-3);border:1px solid var(--border);color:var(--text-0);padding:7px 13px;
  border-radius:6px;font-size:12px;cursor:pointer;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap;}
.btn:hover{background:#252b38;border-color:#3a4155;}
.btn-primary{background:var(--accent);color:#06231a;border-color:var(--accent);font-weight:700;}
.btn-primary:hover{background:#5edcae;}
.btn-danger-ghost{color:var(--danger);}
.btn:disabled{opacity:0.4;cursor:not-allowed;}

.content{flex:1;overflow-y:auto;overflow-x:hidden;padding:18px 20px 60px 20px;}
.card{background:var(--bg-1);border:1px solid var(--border-soft);border-radius:10px;padding:15px 17px;margin-bottom:14px;}
.card-title{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-2);font-weight:700;
  margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.field-row{display:flex;flex-wrap:wrap;gap:14px;}
.field{display:flex;flex-direction:column;gap:5px;flex:1 1 130px;max-width:220px;}
.field.grow{flex:2 1 200px;max-width:none;}
.field label{font-size:10px;color:var(--text-2);text-transform:uppercase;letter-spacing:0.4px;white-space:nowrap;}
input,select{background:var(--bg-0);border:1px solid var(--border);color:var(--text-0);
  padding:8px 10px;border-radius:6px;font-size:12.5px;font-family:inherit;width:100%;}
input:focus,select:focus{outline:none;border-color:var(--accent-blue);}
input[type=number]{font-family:var(--mono);}

.map-wrap{height:420px;border-radius:10px;overflow:hidden;border:1px solid var(--border-soft);position:relative;}
#map{height:100%;width:100%;background:#0b0d12;}
.map-hint{position:absolute;bottom:10px;left:10px;background:rgba(11,13,18,0.88);border:1px solid var(--border);
  padding:6px 10px;border-radius:6px;font-size:11px;color:var(--text-1);z-index:1000;}
.map-toolbar{position:absolute;top:10px;left:10px;z-index:1000;display:flex;gap:6px;flex-wrap:wrap;max-width:70%;}
.map-toolbar .btn{padding:6px 10px;font-size:11px;}

table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;}
th{text-align:left;color:var(--text-2);font-weight:600;font-size:9.5px;text-transform:uppercase;
  letter-spacing:0.4px;padding:7px 7px;border-bottom:1px solid var(--border-soft);font-family:'Inter',sans-serif;}
td{padding:6px 7px;border-bottom:1px solid var(--border-soft);color:var(--text-0);white-space:nowrap;}
tr:hover td{background:var(--bg-2);}
td input{width:100%;min-width:50px;padding:5px 7px;font-size:11.5px;background:transparent;border:1px solid transparent;}
td input:hover{border-color:var(--border);}
td input:focus{background:var(--bg-0);border-color:var(--accent-blue);}
.wp-name-input{min-width:85px !important;font-family:'Inter',sans-serif !important;}
.small-btn{background:none;border:none;color:var(--text-2);cursor:pointer;font-size:13px;padding:2px 5px;border-radius:4px;}
.small-btn:hover{background:var(--bg-3);color:var(--text-0);}
.total-row td{border-top:1px solid var(--border);font-weight:700;color:var(--accent);background:var(--bg-2);}
.manual-tag{font-size:9px;color:var(--warn);border:1px solid var(--warn);padding:1px 5px;border-radius:8px;margin-left:5px;}
.auto-tag{font-size:9px;color:var(--accent);border:1px solid var(--accent-dim);padding:1px 5px;border-radius:8px;margin-left:5px;}
.ok-tag{font-size:10px;color:var(--accent);font-weight:700;}
.bad-tag{font-size:10px;color:var(--danger);font-weight:700;}

.empty-state{color:var(--text-2);font-size:12px;text-align:center;padding:22px 10px;}
.status-line{font-size:11px;color:var(--text-2);margin-top:8px;line-height:1.5;}
.status-line.ok{color:var(--accent);}
.status-line.err{color:var(--danger);}
.status-line.warn{color:var(--warn);}

.mnb-grid{display:grid;grid-template-columns:1fr 320px;gap:18px;}
@media (max-width:900px){.mnb-grid{grid-template-columns:1fr;}}
.limit-bar{height:5px;background:var(--bg-3);border-radius:3px;overflow:hidden;margin-top:4px;}
.limit-fill{height:100%;background:var(--accent);}
.limit-fill.over{background:var(--danger);}

.tabs-locked{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
.tab-locked{background:var(--bg-1);border:1px solid var(--border-soft);color:var(--text-2);
  padding:8px 14px;border-radius:6px;font-size:12px;cursor:not-allowed;display:flex;align-items:center;gap:6px;}

.toast{position:fixed;bottom:20px;right:20px;background:var(--bg-3);border:1px solid var(--border);
  padding:10px 16px;border-radius:8px;font-size:12px;color:var(--text-0);z-index:2000;
  box-shadow:0 8px 24px rgba(0,0,0,0.4);opacity:0;transform:translateY(8px);transition:all 0.25s;max-width:320px;}
.toast.show{opacity:1;transform:translateY(0);}

::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:var(--bg-0);}
::-webkit-scrollbar-thumb{background:var(--bg-3);border-radius:5px;}

/* ---- Performances (décollage / atterrissage) ---- */
.perf-tabs{display:flex;gap:8px;margin-bottom:14px;}
.perf-tabs .btn{flex:1;justify-content:center;}
.perf-speeds{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.perf-spd{flex:1;min-width:90px;background:var(--bg-0);border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
.perf-spd .k{font-size:9.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;}
.perf-spd .v{font-family:var(--mono);font-size:16px;color:var(--text-0);margin-top:2px;}
.perf-big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.perf-box{background:var(--bg-0);border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
.perf-box .k{font-size:9.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;}
.perf-box .v{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--text-0);margin-top:4px;}
.perf-box .x{font-size:10.5px;color:var(--text-2);margin-top:2px;}
.perf-box.accent .v{color:var(--accent);}
.perf-verdict{font-family:var(--mono);font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;}
.perf-verdict.ok{color:var(--accent);background:rgba(79,209,165,.12);border:1px solid rgba(79,209,165,.35);}
.perf-verdict.warn{color:var(--warn);background:rgba(224,168,86,.12);border:1px solid rgba(224,168,86,.35);}
.perf-verdict.bad{color:var(--danger);background:rgba(224,104,95,.14);border:1px solid rgba(224,104,95,.4);}
.perf-rwybox{background:var(--bg-0);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;}
.perf-rwyhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
.perf-rwyhead .t{font-size:10.5px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;}
svg.perf-rwy{width:100%;height:auto;display:block;font-family:var(--mono);}
.perf-notes{margin-top:8px;font-family:var(--mono);font-size:11px;color:var(--text-1);line-height:1.6;}
.perf-notes .nw{color:var(--warn);}
.perf-notes .ne{color:var(--danger);}
.perf-src{font-size:10.5px;color:var(--accent-blue);margin-top:4px;}
details.perf-method{margin-top:12px;border:1px solid var(--border-soft);border-radius:8px;background:var(--bg-0);}
details.perf-method summary{cursor:pointer;padding:9px 12px;font-size:10.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--accent-blue);list-style:none;}
details.perf-method summary::-webkit-details-marker{display:none;}
details.perf-method .body{padding:0 13px 12px;font-family:var(--mono);font-size:11px;color:var(--text-1);line-height:1.65;}
details.perf-method .body b{color:var(--text-0);}
</style>
</head>

<script>
/* Storage abstraction: uses Claude's window.storage when running as an artifact,
   falls back to the browser's localStorage when running as a standalone hosted page. */
const appStorage = (window.storage && typeof window.storage.get === 'function')
  ? window.storage
  : {
      async get(key){ const v = localStorage.getItem(key); return v===null ? null : {key, value:v}; },
      async set(key, value){ localStorage.setItem(key, value); return {key, value}; },
      async delete(key){ localStorage.removeItem(key); return {key, deleted:true}; },
      async list(prefix){
        const keys = [];
        for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(!prefix || k.startsWith(prefix)) keys.push(k); }
        return { keys };
      }
    };

/* ============================= AIRCRAFT DATA (from Cannes Aviation M&B workbooks) ============================= */
const AIRCRAFT_DB = {

/* ============================= PERFORMANCE DA40 D (décollage / atterrissage) =============================
   Sources :
   - F-HOVE / F-GZMP (TAE 125-02-114, 155 HP, STC 10036328) : tables EXACTES du supplément AFM/POH
     (Doc. 50-0310-500, chap. 5(a)/5(b) selon hélice) — reproduites intégralement ci-dessous.
   - Reste de la flotte (TAE 125-01, 135 HP) : décollage NON tabulé dans l'AFM — uniquement un abaque
     (nomogramme 3 panneaux, AFM DA 40 D de base, Doc. 6.01.05-E Rev.8, p.5-12/5-13). Faute de pouvoir
     digitaliser un nomogramme point par point de façon fiable, la forme (variation avec masse/altitude/
     température) est reprise de la table -114 ci-dessus (même cellule/aérodynamique, seule la puissance
     change), et mise à l'échelle par un facteur calibré sur les DEUX exemples numériques imprimés dans
     l'abaque de base lui-même :
       · Roulage : PA 6000ft, OAT 10°C, 1010 kg, vent debout 15 kt → 260 m  ⇒ K_ROLL = 1.109
       · Distance/obstacle 15 m : PA 4000ft, OAT 22°C, 1070 kg, vent debout 10 kt → 600 m ⇒ K_OBST = 1.250
     C'est donc une ESTIMATION, explicitement marquée comme telle dans l'UI — à recouper avec l'abaque
     papier avant tout vol réel.
   - Atterrissage : valeurs ISA/MSL imprimées en toutes lettres dans l'AFM de base pour TOUTE la flotte
     (indépendant du moteur) : volets LDG 744 m / 287 m roulage ; volets UP 916 m / 304 m roulage
     (Doc. 6.01.05-E Rev.8, §5.3.11/5.3.12), corrigées ensuite pour masse/densité/vent/piste.
   - Montée (135 HP) : même principe que le décollage — pas de table, seulement des abaques (nomogrammes
     3 panneaux, Doc. 6.01.05-E Rev.8, p.5-15 montée initiale / p.5-17 montée croisière). Forme reprise
     des tables -114 (5(a)-7 et 5(a)-8), mise à l'échelle sur l'exemple chiffré imprimé sur chaque abaque :
       · Montée initiale : PA 8000ft, OAT 21°C, 1030 kg → Vz = 560 ft/min ⇒ K_CLIMB_TO = 0,933
       · Montée croisière : PA 4000ft, OAT 18°C, 975 kg → Vz = 740 ft/min ⇒ K_CLIMB_CRUISE = 0,977
     Un seul point de calibration par abaque (contre deux pour le décollage) : ESTIMATION à recouper avec
     l'abaque papier avant tout vol réel — un champ de saisie manuelle permet d'écraser la valeur si tu
     préfères t'appuyer directement sur ta lecture de l'abaque. */

  const FUEL_FLOW_BY_LOAD={50:{lh:15.3,usgh:4.0},60:{lh:18.6,usgh:4.9},70:{lh:22.1,usgh:5.8},80:{lh:25.8,usgh:6.8},90:{lh:29.6,usgh:7.8},100:{lh:33.6,usgh:8.9}};

  const lerp=(a,b,t)=>a+(b-a)*t;
  function bracket(grid,v){
    if(v<=grid[0])return[0,0,0];
    if(v>=grid[grid.length-1])return[grid.length-1,grid.length-1,0];
    for(let i=0;i<grid.length-1;i++) if(v<=grid[i+1]) return[i,i+1,(v-grid[i])/(grid[i+1]-grid[i])];

  function interpTable(tbl,dGrid,paV,dISA){

  function vApp(mass){const p=[[850,58],[1000,63],[1150,71]];if(mass<=850)return 58;if(mass>=1150)return 71;for(let i=0;i<p.length-1;i++){if(mass<=p[i+1][0]){const[a,b]=p[i],[c,d]=p[i+1];return b+(d-b)*(mass-a)/(c-a);}}}

    if(clamped<=arr[0][0]) ktas=arr[0][1];

    if(I.head<0) notes.push(['e',`Tailwind ${Math.abs(I.head).toFixed(0)} kt: landing distance significantly increased.`]);

/* ============================= GEO / NAV MATH ============================= */
const toRad = d => d * Math.PI/180;
const toDeg = r => r * 180/Math.PI;
function norm360(d){ d = d % 360; if(d<0) d+=360; return d; }
function distanceNM(a,b){
  const R = 3440.065;
  const dLat = toRad(b.lat-a.lat), dLon = toRad(b.lon-a.lon);
  const la1=toRad(a.lat), la2=toRad(b.lat);
  const h = Math.sin(dLat/2)**2 + Math.cos(la1)*Math.cos(la2)*Math.sin(dLon/2)**2;
  return R * 2*Math.atan2(Math.sqrt(h), Math.sqrt(1-h));
}
function trueCourse(a,b){
  const la1=toRad(a.lat), la2=toRad(b.lat), dLon=toRad(b.lon-a.lon);
  const y = Math.sin(dLon)*Math.cos(la2);
  const x = Math.cos(la1)*Math.sin(la2) - Math.sin(la1)*Math.cos(la2)*Math.cos(dLon);
  return norm360(toDeg(Math.atan2(y,x)));
}
function windTriangle(tc, tas, windDirFrom, windSpeed){
  const diff = toRad(windDirFrom - tc);
  const wca = toDeg(Math.asin( Math.max(-1,Math.min(1,(windSpeed/tas)*Math.sin(diff))) ));
  const hdgTrue = norm360(tc + wca);
  const gs = tas*Math.cos(toRad(wca)) - windSpeed*Math.cos(diff);
  return { wca, hdgTrue, gs: Math.max(gs, 1) };
}
const LEVELS = [1000,975,950,925,900,850,800,700,600,500];
function levelAltFt(hpa){ return (44330 * (1 - Math.pow(hpa/1013.25, 1/5.255))) * 3.28084; }
function nearestLevel(altFt){
  let best = LEVELS[0], bestDiff = Infinity;
  for(const l of LEVELS){ const d = Math.abs(levelAltFt(l) - altFt); if(d < bestDiff){ bestDiff = d; best = l; } }
  return best;
}

/* ============================= MEA / TERRAIN (obstacle corridor sampling) ============================= */
function destinationPoint(lat, lon, bearingDeg, distNM){
  const R = 3440.065;
  const d = distNM/R;
  const brng = toRad(bearingDeg);
  const lat1 = toRad(lat), lon1 = toRad(lon);
  const lat2 = Math.asin(Math.sin(lat1)*Math.cos(d) + Math.cos(lat1)*Math.sin(d)*Math.cos(brng));
  const lon2 = lon1 + Math.atan2(Math.sin(brng)*Math.sin(d)*Math.cos(lat1), Math.cos(d)-Math.sin(lat1)*Math.sin(lat2));
  return { lat: toDeg(lat2), lon: toDeg(lon2) };
}
async function fetchElevations(points){
  const results = new Array(points.length);
  for(let i=0;i<points.length;i+=100){
    const chunk = points.slice(i, i+100);
    const lats = chunk.map(p=>p.lat.toFixed(4)).join(',');
    const lons = chunk.map(p=>p.lon.toFixed(4)).join(',');
    const url = `https://api.open-meteo.com/v1/elevation?latitude=${lats}&longitude=${lons}`;
    const res = await fetch(url);
    if(!res.ok) throw new Error('elevation http '+res.status);
    const data = await res.json();
    data.elevation.forEach((e,j)=>{ results[i+j] = e; });
  }
  return results;
}
/* Samples a 20NM-wide corridor (10NM either side of track) along a leg and returns the
   highest obstacle found, plus the MEA (obstacle + 1000ft if <5000ft, +2000ft if >=5000ft). */
async function computeLegMEA(a, b){
  const dist = distanceNM(a,b);
  const tc = trueCourse(a,b);
  const alongStep = Math.max(2, dist/6);
  const offsets = [-10,-5,0,5,10];
  const samples = [];
  for(let d=0; d<=dist+0.01; d+=alongStep){
    const dd = Math.min(d, dist);
    const centerPt = destinationPoint(a.lat, a.lon, tc, dd);
    offsets.forEach(off=>{
      if(off===0){ samples.push(centerPt); }
      else{ samples.push(destinationPoint(centerPt.lat, centerPt.lon, norm360(tc + (off<0?-90:90)), Math.abs(off))); }
    });
  }
  const elevM = await fetchElevations(samples);
  const validElevM = elevM.filter(v=>v!=null && !isNaN(v));
  const maxElevFt = validElevM.length ? Math.max(...validElevM) * 3.28084 : 0;
  const margin = maxElevFt < 5000 ? 1000 : 2000;
  const mea = Math.ceil((maxElevFt + margin)/50)*50; // round up to nearest 50ft
  return { maxElevFt, margin, mea };
}
/* Rounds a required pressure altitude up to the next valid VFR semicircular flight level.
   Magnetic track 000-179° -> odd thousands +500ft. Magnetic track 180-359° -> even thousands +500ft. */
function roundToSemicircular(requiredAlt, magneticTrack){
  const wantOdd = (magneticTrack >= 0 && magneticTrack < 180);
  let n = Math.ceil((requiredAlt - 500) / 1000);
  if(n < 1) n = 1;
  if(wantOdd && n % 2 === 0) n += 1;
  if(!wantOdd && n % 2 !== 0) n += 1;
  return n*1000 + 500;
}
/* Pure calc + state mutation (cruiseAlt, waypoints, autoFlInfo) — does NOT itself
   trigger a nav log recompute, so it can be called both from computeNavLog() (which
   is already mid-computation) and from the manual "Auto" button. Returns true if the
   chosen level actually changed the cruise altitude (caller decides whether to
   recompute the nav log to refresh wind-at-level etc.). */
function applyAutoFL(){
  if(state.legs.length === 0) return false;
  const routeMEA = Math.max(...state.legs.map(l=>l.mea));
  const wpsWithAtmo = state.waypoints.filter(w=>w.qnh!=null && w.tempC!=null);
  const qnh = wpsWithAtmo.length ? wpsWithAtmo.reduce((s,w)=>s+w.qnh,0)/wpsWithAtmo.length : 1013.25;
  const tempAtLevel = wpsWithAtmo.length ? wpsWithAtmo.reduce((s,w)=>s+w.tempC,0)/wpsWithAtmo.length : null;
  const pressureCorrection = Math.max(0, (1013 - qnh) * 30);
  const isaTemp = 15 - 1.98*(routeMEA/1000);
  const deltaT = tempAtLevel!=null ? Math.max(0, isaTemp - tempAtLevel) : 0;
  const tempCorrection = routeMEA * deltaT * 0.004;
  const requiredAlt = routeMEA + pressureCorrection + tempCorrection;
  const mt = state.legs[0].mt;
  const chosenFL = roundToSemicircular(requiredAlt, mt);
  const oldCruiseAlt = state.cruiseAlt;
  const changed = Math.round(chosenFL) !== Math.round(oldCruiseAlt);
  // propagate the new level to every waypoint that was still at the old cruise altitude
  // (points deliberately set lower/higher — TOD, circuit altitude, etc. — are left untouched)
  state.waypoints.forEach(wp=>{
    if(Math.round(wp.alt ?? oldCruiseAlt) === Math.round(oldCruiseAlt)){ wp.alt = chosenFL; }
  });
  state.cruiseAlt = chosenFL;
  state.autoFlInfo = { routeMEA, qnh: Math.round(qnh), tempAtLevel: tempAtLevel!=null?Math.round(tempAtLevel):null,
    isaTemp: Math.round(isaTemp), deltaT: Math.round(deltaT*10)/10, pressureCorrection: Math.round(pressureCorrection),
    tempCorrection: Math.round(tempCorrection), requiredAlt: Math.round(requiredAlt), mt: Math.round(mt), chosenFL };
  return changed;
}
/* Manual "🧮 Auto" button (visible in Manuel mode): one-off suggestion, does not
   switch the field back into permanent Auto mode. */
async function computeAutoFL(){
  if(state.legs.length === 0){ showToast('Compute the nav log first (MEA required for auto level).'); return; }
  const changed = applyAutoFL();
  showToast('Cruise level computed: ' + state.cruiseAlt + ' ft' + (changed ? ' — recomputing nav log…' : ''));
  if(changed) await computeNavLog({isRecompute:true});
  else renderAll();
}


async function fetchWindAtPoint(lat, lon, level, dateStr, timeStr){
  const hour = timeStr.slice(0,2);
  const targetISO = `${dateStr}T${hour}:00`;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}`
    + `&hourly=windspeed_${level}hPa,winddirection_${level}hPa,temperature_${level}hPa,pressure_msl&windspeed_unit=kn&timezone=UTC&forecast_days=16`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('http '+res.status);
  const data = await res.json();
  const times = data.hourly.time;
  let idx = times.indexOf(targetISO);
  if(idx === -1){
    const target = new Date(targetISO+':00Z').getTime();
    let bestI=0, bestD=Infinity;
    times.forEach((t,i)=>{ const d=Math.abs(new Date(t+':00Z').getTime()-target); if(d<bestD){bestD=d;bestI=i;} });
    idx = bestI;
    if(bestD > 1000*60*60*24*3) throw new Error('out of range');
  }
  const spd = data.hourly[`windspeed_${level}hPa`][idx];
  const dir = data.hourly[`winddirection_${level}hPa`][idx];
  const tempC = data.hourly[`temperature_${level}hPa`] ? data.hourly[`temperature_${level}hPa`][idx] : null;
  const qnh = data.hourly.pressure_msl ? data.hourly.pressure_msl[idx] : null;
  if(spd == null || dir == null) throw new Error('missing data');
  return { speed: Math.round(spd), dir: Math.round(dir), tempC, qnh };
}

async function computeNavLog(opts={}){
  const isRecompute = !!opts.isRecompute;
  if(state.waypoints.length < 2){ showToast('Add at least 2 points.'); return; }
  state.computeStatus = {type:'info', msg: (state.flAutoMode && !isRecompute)
    ? 'Fetching wind (Open-Meteo) — provisional level, will be recalculated automatically afterward…'
    : 'Fetching wind (Open-Meteo)…'};
  renderContent();
  let anyManualFallback = false;
  for(const wp of state.waypoints){
    if(wp.manual) continue;
    const level = nearestLevel(wp.alt ?? state.cruiseAlt);
    try{
      const w = await fetchWindAtPoint(wp.lat, wp.lon, level, state.eobtDate, state.eobtTime);
      wp.windDir = w.dir; wp.windSpeed = w.speed; wp.windError = false;
      wp.tempC = w.tempC; wp.qnh = w.qnh;
    }catch(e){
      wp.windError = true; anyManualFallback = true;
      if(wp.windDir == null) wp.windDir = 0;
      if(wp.windSpeed == null) wp.windSpeed = 0;
    }
  }
  state.computeStatus = {type:'info', msg:'Analyzing terrain along the route (20NM corridor)…'};
  renderContent();
  const legs = [];
  let cumMin = 0, cumNM = 0, cumFuelUSG = 0;
  let meaError = false;
  const ac = AIRCRAFT_DB[state.aircraft];
  const climbFpm = (ac.climbFpmByTail && ac.climbFpmByTail[state.regTail]) || ac.climbFpmDefault || null;
  for(let i=0;i<state.waypoints.length-1;i++){
    const a = state.waypoints[i], b = state.waypoints[i+1];
    const aAlt = a.alt ?? state.cruiseAlt, bAlt = b.alt ?? state.cruiseAlt;
    const dist = distanceNM(a,b);
    const tc = trueCourse(a,b);
    const d1 = toRad(a.windDir||0), d2 = toRad(b.windDir||0);
    const sSin = Math.sin(d1)+Math.sin(d2), sCos = Math.cos(d1)+Math.cos(d2);
    const windDir = norm360(toDeg(Math.atan2(sSin,sCos)));
    const windSpeed = ((a.windSpeed||0)+(b.windSpeed||0))/2;
    let phase = 'cruise', legTas = state.tas;
    if(bAlt > aAlt + 50 && ac.climbSpeedKt){ phase = 'climb'; legTas = ac.climbSpeedKt; }
    else if(bAlt < aAlt - 50){ phase = 'descent'; legTas = state.descentTas || state.tas; }
    const { wca, hdgTrue, gs } = windTriangle(tc, legTas, windDir, windSpeed);
    const magHdg = norm360(hdgTrue - state.variation);
    const magTrack = norm360(tc - state.variation);
    const eteMin = (dist/gs)*60;
    cumMin += eteMin; cumNM += dist;
    const fuelRate = phase==='climb' ? (ac.climbUSGh ?? ac.cruiseUSGh ?? state.fuelParams.manualCruiseUSGh)
      : phase==='descent' ? (ac.descentUSGh ?? ac.cruiseUSGh ?? state.fuelParams.manualCruiseUSGh)
      : (ac.cruiseUSGh ?? state.fuelParams.manualCruiseUSGh);
    const fuelUSG = (eteMin/60) * fuelRate;
    cumFuelUSG += fuelUSG;
    let meaData = { maxElevFt:0, margin:1000, mea:0 };
    try{ meaData = await computeLegMEA(a,b); }catch(e){ meaError = true; }
    legs.push({ from:a.name, to:b.name, dist, tt:tc, mt:magTrack, windDir, windSpeed, wca,
      th:hdgTrue, mh:magHdg, gs, eteMin, cumMin, cumNM, phase, legTas, alt:bAlt, climbFpm,
      obstacleFt: meaData.maxElevFt, mea: meaData.mea, fuelUSG, cumFuelUSG });
  }
  state.legs = legs;
  {
    const oldNotes = state.legNotes || {};
    const newNotes = {};
    legs.forEach(l=>{
      const key = l.from+'→'+l.to;
      newNotes[key] = oldNotes[key] || {radio:'', nav:'', remarks:''};
    });
    state.legNotes = newNotes;
  }
  // Niveau de croisière auto : ce premier passage a utilisé le niveau encore en
  // vigueur (souvent provisoire) pour aller chercher le vent/MEA. On en déduit
  // maintenant le vrai niveau, et si ça change quelque chose on relance un passage
  // complet pour récupérer le vent au bon niveau et des segments montée/descente cohérents.
  if(state.flAutoMode && !isRecompute){
    const changed = applyAutoFL();
    if(changed){ await computeNavLog({isRecompute:true}); return; }
  }
  state.computeStatus = anyManualFallback
    ? {type:'err', msg:'Wind unavailable for one or more points (outside Open-Meteo forecast range) — enter it manually in the table above, then recompute.'}
    : {type:'ok', msg:'Nav log computed ✓ (Open-Meteo wind per point, altitude specific to each segment)'
        + (meaError ? ' — terrain unavailable for at least one segment, check MEA manually on the map.' : '')
        + (state.flAutoMode ? ' — cruise level ' + state.cruiseAlt + ' ft computed automatically.' : '')};
  renderAll();
}

function renderAutoFlDetail(){

  const parity = (i.mt>=0 && i.mt<180) ? 'odd (mag. track 000-179°)' : 'even (mag. track 180-359°)';
  return `<div class="status-line">
    Route MEA (max of segments): <b style="color:var(--text-0);">${Math.round(i.routeMEA)} ft</b>
    · Estimated QNH ${i.qnh} hPa → pressure correction +${i.pressureCorrection} ft
    · Estimated temp. ${i.tempAtLevel!=null?i.tempAtLevel+'°C':'n/a'} vs ISA ${i.isaTemp}°C (diff ${i.deltaT}°C) → temperature correction +${Math.round(i.tempCorrection)} ft
    · Required pressure altitude ≈ ${i.requiredAlt} ft
    · Magnetic track ${i.mt}° → ${parity} level
    → <b style="color:var(--accent);">${i.chosenFL} ft</b> selected.
  </div>`;
}

/* Inserts a TOD (Top of Descent) point on the last leg, using the 3:1 rule:
   distance (NM) = (alt initiale - alt cible) / 1000 * 3 */
/* Walks backward from waypoints[targetIdx] through preceding legs, accumulating distance,
   and returns the lat/lon that sits `distanceBackNM` before it, plus the array index
   at which the new point should be spliced in. Returns null if the route isn't long enough. */
function pointAtDistanceBeforeIndex(waypoints, targetIdx, distanceBackNM){
  let remaining = distanceBackNM;
  for(let i = targetIdx; i > 0; i--){
    const a = waypoints[i-1], b = waypoints[i];
    const legDist = distanceNM(a,b);
    if(remaining <= legDist){
      const tc = trueCourse(a,b);
      const pos = destinationPoint(a.lat, a.lon, tc, legDist - remaining);
      return { lat: pos.lat, lon: pos.lon, insertAt: i };
    }
    remaining -= legDist;
  }
  return null;
}
/* Mirror of pointAtDistanceBeforeIndex, but walking forward from a source index — used for TOC. */
function pointAtDistanceAfterIndex(waypoints, sourceIdx, distanceFwdNM){
  let remaining = distanceFwdNM;
  for(let i = sourceIdx; i < waypoints.length-1; i++){
    const a = waypoints[i], b = waypoints[i+1];
    const legDist = distanceNM(a,b);
    if(remaining <= legDist){
      const tc = trueCourse(a,b);
      const pos = destinationPoint(a.lat, a.lon, tc, remaining);
      return { lat: pos.lat, lon: pos.lon, insertAt: i+1 };
    }
    remaining -= legDist;
  }
  return null;
}
function todSuggestedDistance(targetIdx){
  if(targetIdx <= 0 || targetIdx >= state.waypoints.length) return null;
  const to = state.waypoints[targetIdx];
  const toAlt = to.alt ?? state.cruiseAlt;
  const fromAlt = state.cruiseAlt; // descent planned from the route's cruise level
  if(toAlt >= fromAlt) return null;
  const margin = state.todMarginNM ?? 2;
  const deltaFL = (fromAlt - toAlt) / 100;
  return Math.round((deltaFL / 3 + margin) * 10) / 10;
}
function insertTOD(){
  if(state.waypoints.length < 2){ showToast('At least 2 points required.'); return; }
  const targetIdx = state.todTargetIdx != null ? state.todTargetIdx : state.waypoints.length - 1;
  const to = state.waypoints[targetIdx];
  if(!to){ showToast('Invalid target point.'); return; }
  const toAlt = to.alt ?? state.cruiseAlt;
  const fromAlt = state.cruiseAlt;
  if(toAlt >= fromAlt){ showToast('The target point isn\'t lower than the cruise level — set its altitude before inserting the TOD.'); return; }
  const dist = state.todManualDistNM != null ? state.todManualDistNM : todSuggestedDistance(targetIdx);
  if(!dist || dist <= 0){ showToast('Invalid TOD distance.'); return; }
  const placement = pointAtDistanceBeforeIndex(state.waypoints, targetIdx, dist);
  if(!placement){ showToast('The route isn\'t long enough before this point to place the TOD at ' + dist.toFixed(1) + ' NM (reduce the distance or choose a target point further away).'); return; }
  const id = uid++;
  state.waypoints.splice(placement.insertAt, 0, { id, name:'TOD', lat: placement.lat, lon: placement.lon,
    windDir:null, windSpeed:null, manual:false, alt: fromAlt });
  state.legs = [];
  state.todManualDistNM = null;
  renderAll();
  showToast('TOD inserted ' + dist.toFixed(1) + ' NM before ' + escapeHtml(to.name) + ' ✓');
}
function tocSuggestedDistance(sourceIdx){
  if(state.waypoints.length < 2 || sourceIdx < 0 || sourceIdx >= state.waypoints.length-1) return null;
  const from = state.waypoints[sourceIdx];
  const fromAlt = from.alt ?? 0;
  const toAlt = state.cruiseAlt;
  if(toAlt <= fromAlt) return null;
  const ac = AIRCRAFT_DB[state.aircraft];
  const climbFpm = (ac.climbFpmByTail && ac.climbFpmByTail[state.regTail]) || ac.climbFpmDefault;
  const climbKt = ac.climbSpeedKt;
  if(!climbFpm || !climbKt) return null;
  const timeMin = (toAlt-fromAlt)/climbFpm;
  return Math.round((climbKt*timeMin/60)*10)/10;
}
function insertTOC(){
  if(state.waypoints.length < 2){ showToast('At least 2 points required.'); return; }
  const sourceIdx = state.tocSourceIdx != null ? state.tocSourceIdx : 0;
  const from = state.waypoints[sourceIdx];
  if(!from){ showToast('Invalid source point.'); return; }
  const fromAlt = from.alt ?? 0;
  const toAlt = state.cruiseAlt;
  if(toAlt <= fromAlt){ showToast('The cruise level isn\'t higher than the source point — set the altitudes before inserting the TOC.'); return; }
  const dist = state.tocManualDistNM != null ? state.tocManualDistNM : tocSuggestedDistance(sourceIdx);
  if(!dist || dist <= 0){ showToast('Invalid TOC distance (check the climb speed/rate of the selected aircraft).'); return; }
  const placement = pointAtDistanceAfterIndex(state.waypoints, sourceIdx, dist);
  if(!placement){ showToast('The route isn\'t long enough after this point to place the TOC at ' + dist.toFixed(1) + ' NM (reduce the distance or choose a source point further away).'); return; }
  const id = uid++;
  state.waypoints.splice(placement.insertAt, 0, { id, name:'TOC', lat: placement.lat, lon: placement.lon,
    windDir:null, windSpeed:null, manual:false, alt: toAlt });
  state.legs = [];
  state.tocManualDistNM = null;
  renderAll();
  showToast('TOC inserted ' + dist.toFixed(1) + ' NM after ' + escapeHtml(from.name) + ' ✓');
}

/* Computes the Alternate fuel (D) from the last route waypoint to the placed diversion point:
   distance/GS at cruise speed with fetched wind, plus a 15-min minimum approach allowance. */
async function computeAlternateFuel(){
  if(state.waypoints.length === 0){ showToast('Add at least your destination point on the route.'); return; }
  if(!state.alternatePoint){ showToast('First place the alternate point on the map ("Place alternate").'); return; }
  const dest = state.waypoints[state.waypoints.length-1];
  const altn = state.alternatePoint;
  const dist = distanceNM(dest, altn);
  const tc = trueCourse(dest, altn);
  const ac = AIRCRAFT_DB[state.aircraft];
  const level = nearestLevel(dest.alt ?? state.cruiseAlt);
  let windDir = 0, windSpeed = 0, windNote = 'wind unavailable, calculating without wind';
  try{
    const w = await fetchWindAtPoint((dest.lat+altn.lat)/2, (dest.lon+altn.lon)/2, level, state.eobtDate, state.eobtTime);
    windDir = w.dir; windSpeed = w.speed; windNote = `wind ${Math.round(w.dir)}°/${Math.round(w.speed)}kt`;
  }catch(e){}
  const { gs } = windTriangle(tc, state.tas, windDir, windSpeed);
  const eteMin = (dist/gs)*60;
  const approachMin = 15;
  const totalMin = eteMin + approachMin;
  const cruiseUSGh = ac.cruiseUSGh ?? state.fuelParams.manualCruiseUSGh;
  const fuelUSG = (totalMin/60) * cruiseUSGh;
  state.fuelParams.altnMin = Math.round(totalMin);
  state.fuelParams.altnUSG = Math.ceil(fuelUSG);
  showToast(`Alternate: ${dist.toFixed(1)} NM, ${windNote}, +15min approach → ${Math.round(totalMin)} min / ${Math.ceil(fuelUSG)} USG`);
  renderContent();
}

function weatherAirportList(){
  const set = new Set();
  [state.depIcao, state.destIcao, state.altnIcao].forEach(c => { if(c && c.trim()) set.add(c.trim().toUpperCase()); });
  state.weatherExtraIcao.forEach(c => { if(c && c.trim()) set.add(c.trim().toUpperCase()); });
  return Array.from(set);
}
async function refreshWeather(){
  const list = weatherAirportList();
  if(list.length===0){ showToast('Enter at least one ICAO code (Departure/Destination/Alternate or an added airport).'); return; }
  state.weatherLoading = true;
  renderContent();
  const errors = [];
  let metars = {}, tafs = {};
  try{
    const res = await fetch(`https://aviationweather.gov/api/data/metar?ids=${list.join(',')}&format=json`);
    if(res.ok){ const data = await res.json(); data.forEach(m => { metars[m.icaoId] = m; }); }
    else errors.push('METAR: HTTP error ' + res.status);
  }catch(e){ errors.push('METAR: request failed (' + e.message + ')'); }
  try{
    const res = await fetch(`https://aviationweather.gov/api/data/taf?ids=${list.join(',')}&format=json`);
    if(res.ok){ const data = await res.json(); data.forEach(t => { tafs[t.icaoId] = t; }); }
    else errors.push('TAF: HTTP error ' + res.status);
  }catch(e){ errors.push('TAF: request failed (' + e.message + ')'); }
  state.weatherData = { metars, tafs, fetchedAt: new Date(), errors };
  state.weatherLoading = false;
  renderContent();
}

/* ============================= EXPORT DOSSIER (Flight Planning Folder) =============================
   Assemble le dossier de préparation de vol au format papier Cannes Aviation, à partir des gabarits PDF
   vierges (hébergés dans /templates/ à côté d'index.html — voir liste dans fpfTemplatePaths ci-dessous)
   et des données déjà saisies dans l'appli. Phase 1 : page de garde + tableau Weather (ICAO/RWY) remplis,
   fusion des PDF météo/NOTAM déjà attachés dans l'onglet Briefing, toutes les autres pages du gabarit
   (dont OFP/Diversion, Route Details, Fuel, Performances) insérées à la bonne place mais encore vierges —
   à compléter à la main en attendant les prochaines phases (OFP, abaques, image M&B). */
const fpfTemplatePaths = {
  folder: 'templates/flight_planning_folder.pdf',
  ofp: 'templates/ofp.pdf',
  fuelCat: 'templates/fuel_cat.pdf',
  fuelNco: 'templates/fuel_nco.pdf',
  perfCat: 'templates/perf_cat.pdf',
  perfNco: 'templates/perf_nco.pdf',
};
function fpfPdfY(top, bottom, frac){
  frac = frac==null ? 0.28 : frac;
  const PAGE_H = 841.8898;
  return PAGE_H - bottom + (bottom-top)*frac;
}
async function fpfLoadBytes(pathOrUrl){
  const res = await fetch(pathOrUrl);
  if(!res.ok) throw new Error('Unable to load '+pathOrUrl+' (HTTP '+res.status+')');
  return await res.arrayBuffer();
}
function fpfRunwaysFor(icao){
  if(!icao) return null;
  const ac = state.perf.rwyDB && state.perf.rwyDB[(icao||'').toUpperCase()];
  if(!ac || !ac.runways || !ac.runways.length) return null;
  return ac.runways.map(r=>r.designator).filter(Boolean).join('/') || null;
}
function fpfDepTakeoffFigures(){
  const depIcao = (state.depIcao||'').trim().toUpperCase();
  const entry = state.perf.rwyDB && state.perf.rwyDB[depIcao];
  if(!entry || !entry.runways || !entry.runways.length) return null;
  const rwy = entry.runways[0];
  const qfu = effectiveQfu(rwy);
  if(qfu==null) return null;
  const ac = AIRCRAFT_DB[state.aircraft];
  const eng114 = (ac.perf114Tails||[]).includes(state.regTail);
  const {pa,oat,isa,sig,slope} = perfSheetAtmoAt(entry.elevFt, 'dep');
  const p = state.perf;
  const a = perfAtmo('dep');
  const ang=(a.wdir-qfu)*Math.PI/180;
  const head = a.wspd*Math.cos(ang), cross = Math.abs(a.wspd*Math.sin(ang));
  const I = {pa,oat,isa,sig,qfu,tora:null,lda:null,slope,surf:a.surf,state:a.pstate,head,cross};
  const mnb = computeMnB();
  const massTO = p.massTOTouched ? p.massTO : Math.round(mnb.toMass);
  const r = PERF_DA40.computeTO(eng114?'114':'01', p.prop, massTO, I);
  return { vr: r.vr, tod: Math.round(r.obst) };
}
function fpfDestLandingFigures(){
  const destIcao = (state.destIcao||'').trim().toUpperCase();
  const entry = state.perf.rwyDB && state.perf.rwyDB[destIcao];
  if(!entry || !entry.runways || !entry.runways.length) return null;
  const rwy = entry.runways[0];
  const qfu = effectiveQfu(rwy);
  if(qfu==null) return null;
  const {pa,oat,isa,sig,slope} = perfSheetAtmoAt(entry.elevFt, 'dest');
  const p = state.perf;
  const a = perfAtmo('dest');
  const ang=(a.wdir-qfu)*Math.PI/180;
  const head = a.wspd*Math.cos(ang), cross = Math.abs(a.wspd*Math.sin(ang));
  const I = {pa,oat,isa,sig,qfu,tora:null,lda:null,slope,surf:a.surf,state:a.pstate,head,cross};
  const mnb = computeMnB();
  const massLDG = p.massLDGTouched ? p.massLDG : Math.round(mnb.ldgMass);
  const r = PERF_DA40.computeLDG(p.flaps, massLDG, I);
  return { vref: Math.round(r.vapp), ld: Math.round(r.tot) };
}
function fpfOFPData(){
  const legs = state.legs || [];
  const tidy = (s) => (s||'').replace(/\n{2,}/g,'\n').trim(); // collapse blank lines so short columns fit more
  // One row per waypoint: the departure waypoint of each leg, carrying that leg's outgoing data
  // (MT/MH/dist/ETE/crz/mea/fuel), plus a final name-only row for the very last destination reached.
  const rows = [];
  legs.forEach(l=>{
    const key = l.from+'→'+l.to;
    const n = state.legNotes[key] || {radio:'', nav:'', remarks:''};
    rows.push({
      name: l.from, radio: tidy(n.radio), nav: tidy(n.nav), clearances: tidy(n.remarks),
      mt: Math.round(l.mt), mh: Math.round(l.mh), dist: l.dist.toFixed(1),
      ete: fmtMin(l.eteMin), etec: fmtMin(l.cumMin),
      crz: Math.round(l.alt), mea: Math.round(l.mea), fuelEst: l.fuelUSG.toFixed(1),
    });
  });
  if(legs.length>0) rows.push({ name: legs[legs.length-1].to, radio:'', nav:'', clearances:'', mt:null });
  // The template has 7 waypoint slots per OFP page. A flight with more than 7 legs (8 waypoints)
  // no longer fits on a single page — split into several pages of ≤7 rows each; mergeFilledOfp()
  // duplicates the blank OFP page template once per group and continues filling from there.
  const pages = [];
  for(let i=0; i<rows.length; i+=7) pages.push(rows.slice(i,i+7));
  if(pages.length===0) pages.push([]); // no leg computed yet: still render one (mostly blank) page

  const totals = legs.length ? { dist: legs[legs.length-1].cumNM.toFixed(1), ete: fmtMin(legs[legs.length-1].cumMin), fuel: legs[legs.length-1].cumFuelUSG.toFixed(1) } : null;
  const mnb = computeMnB();
  const to = fpfDepTakeoffFigures();
  const ldg = fpfDestLandingFigures();
  const destIcao = (state.destIcao||'').trim().toUpperCase();
  const destEntry = state.perf.rwyDB && state.perf.rwyDB[destIcao];
  return {
    depIcao: state.depIcao, destIcao: state.destIcao, altnIcao: state.altnIcao,
    tow: Math.round(mnb.toMass), vr: to?to.vr:null, tod: to?to.tod:null, dptBlock: state.eobtTime, toTime: state.eobtTime,
    pages, totals,
    destElevFt: destEntry && destEntry.elevFt!=null ? Math.round(destEntry.elevFt) : null,
    ldm: Math.round(mnb.ldgMass), vref: ldg?ldg.vref:null, ld: ldg?ldg.ld:null,
  };
}
function fpfFuelData(){
  const ac = AIRCRAFT_DB[state.aircraft];
  if(!state.legs.length) return null;
  const tripMin = state.legs[state.legs.length-1].cumMin;
  const tripUSG = state.legs.reduce((s,l)=>s+l.fuelUSG, 0);
  if(state.fuelMode==='nco'){
    const nco = ac.partNCO;
    if(!nco) return null;
    const fp = state.fuelParamsNco;
    const gp = state.fuelParams; // field D (alternate) shared with Part-CAT
    const addMin = fp.approachAdd ? nco.approachAddMin : 0;
    const addUSG = fp.approachAdd ? nco.approachAddUSG : 0;
    const aMin = tripMin + addMin, aUSG = tripUSG + addUSG;
    const bMin = aMin*(fp.contingencyPct/100), bUSG = aUSG*(fp.contingencyPct/100);
    const reserve = nco.finalReserve[fp.reserveType];
    const cMin = reserve.min, cUSG = reserve.usg;
    const dMin = gp.altnMin||0, dUSG = gp.altnUSG||0;
    const eMin = aMin+bMin+cMin+dMin, eUSG = aUSG+bUSG+cUSG+dUSG;
    const fMin = fp.discretionaryMin||0, fUSG = fp.discretionaryUSG||0;
    const gMin = eMin+fMin, gUSG = eUSG+fUSG;
    const hMin = aMin+bMin, hUSG = aUSG+bUSG;
    const jUSG = gUSG - cUSG - dUSG - hUSG;
    const jMin = ac.holdUSGh ? (jUSG/ac.holdUSGh)*60 : null;
    return { mode:'nco',
      a:{min:fmtMin(aMin), usg:Math.round(aUSG)}, b:{min:fmtMin(bMin), usg:Math.round(bUSG)},
      c:{min:fmtMin(cMin), usg:Math.round(cUSG)}, d:{min:fmtMin(dMin), usg:Math.round(dUSG)},
      e:{min:fmtMin(eMin), usg:Math.ceil(eUSG)}, f:{min:fmtMin(fMin), usg:Math.round(fUSG)},
      g:{min:fmtMin(gMin), usg:Math.ceil(gUSG), kg:Math.round(gUSG*ac.kgPerUSG)},
      h:{min:fmtMin(hMin), usg:Math.round(hUSG), kg:Math.round(hUSG*ac.kgPerUSG)},
      j:{min: jMin!=null?fmtMin(Math.max(0,jMin)):null, usg:Math.round(jUSG)},
    };
  }
  const fp = state.fuelParams;
  const taxiUSG = ac.taxiUSG != null ? ac.taxiUSG : fp.manualTaxiUSG;
  const finalReserveUSG = ac.finalReserveUSG != null ? ac.finalReserveUSG : fp.manualFinalReserveUSG;
  const contUSG = tripUSG * (fp.contingencyPct/100);
  const contMin = tripMin * (fp.contingencyPct/100);
  const additionalMin = fp.additionalMin||0, extraMin = fp.extraMin||0;
  const discretionaryUSG = fp.discretionaryUSG||0, discretionaryMin = fp.discretionaryMin||0;
  const minReq = taxiUSG + tripUSG + contUSG + fp.altnUSG + finalReserveUSG + fp.additionalUSG + fp.extraUSG;
  const hUSG = Math.ceil(minReq); // H
  const hMin = tripMin + contMin + fp.altnMin + ac.finalReserveMin + additionalMin + extraMin; // taxi has no time component (--- on the form)
  const kUSG = hUSG + discretionaryUSG, kMin = hMin + discretionaryMin; // K = H + J
  const burnOffUSG = taxiUSG + tripUSG + fp.extraUSG, burnOffMin = tripMin + extraMin; // L = A + B + G
  const mUSG = kUSG - fp.altnUSG - finalReserveUSG - burnOffUSG; // M = K - D - E - L
  const mMin = kMin - fp.altnMin - ac.finalReserveMin - burnOffMin;
  return { mode:'cat',
    b:{min:fmtMin(tripMin), usg:Math.round(tripUSG)},
    c:{min:fmtMin(contMin), usg:Math.ceil(contUSG)}, // never show less than the true 5%-of-trip value
    d:{min:fp.altnMin, usg:Math.round(fp.altnUSG)},
    f:{min:fmtMin(additionalMin), usg:Math.round(fp.additionalUSG)},
    g:{min:fmtMin(extraMin), usg:Math.round(fp.extraUSG)},
    h:{min:fmtMin(hMin), usg:hUSG},
    j:{min:fmtMin(discretionaryMin), usg:Math.round(discretionaryUSG)},
    k:{min:fmtMin(kMin), usg:Math.round(kUSG), kg:Math.round(kUSG*ac.kgPerUSG)},
    l:{min:fmtMin(burnOffMin), usg:Math.round(burnOffUSG), kg:Math.round(burnOffUSG*ac.kgPerUSG)},
    m:{min:fmtMin(mMin), usg:Math.round(mUSG)},
  };
}
function fpfPerfData(){
  const ac = AIRCRAFT_DB[state.aircraft];
  const eng114 = (ac.perf114Tails||[]).includes(state.regTail);
  const p = state.perf;
  const byIcao = (icao) => {
    const e = state.perf.rwyDB && state.perf.rwyDB[(icao||'').trim().toUpperCase()];
    return (e && e.runways && e.runways.length) ? e : null;
  };
  const depEntry = byIcao(state.depIcao), destEntry = byIcao(state.destIcao),
        altn1Entry = byIcao(state.altnIcao), altn2Entry = byIcao(p.altn2Icao);
  const toItems = depEntry ? depEntry.runways.map(r=>perfSheetTO(r, depEntry.elevFt, 'dep')).filter(Boolean) : [];
  const destItems = destEntry ? destEntry.runways.map(r=>perfSheetLDG(r, destEntry.elevFt, 'dest')).filter(Boolean) : [];
  const altn1Items = altn1Entry ? altn1Entry.runways.map(r=>perfSheetLDG(r, altn1Entry.elevFt, 'altn')).filter(Boolean) : [];
  const altn2Items = altn2Entry ? altn2Entry.runways.map(r=>perfSheetLDG(r, altn2Entry.elevFt, 'altn2')).filter(Boolean) : [];

  // Climb: exact tables for the 155HP fleet, calibrated abaque estimate for the rest — same figures
  // already shown in the interactive Performance tab (no separate "estimate" flag possible on this
  // printed form; treat like the rest of the app already does).
  const I = perfReadInputs('dep'); // la montée initiale se fait au départ
  const climbInit = eng114 ? PERF_DA40.computeClimb(p.prop, I, I.head) : PERF_DA40.climb01Estimate('to', p.massTO, I, I.head);
  const climbCru = eng114 ? PERF_DA40.computeClimbCruise(p.prop, I, I.head) : PERF_DA40.climb01Estimate('cruise', p.massTO, I, I.head);
  const cruisePA = p.cruisePA ?? 4000;
  const cr = eng114 ? PERF_DA40.computeCruise('114', p.prop, p.loadPct, cruisePA) : PERF_DA40.computeCruise('01','5a', p.loadPct, cruisePA);

  return {
    depIcao: state.depIcao, destIcao: state.destIcao, altnIcao: state.altnIcao, altn2Icao: p.altn2Icao,
    toItems, destItems, altn1Items, altn2Items,
    climbInitVz: Math.round(climbInit.vz), climbInitGamma: climbInit.gamma, climbInitGsFtMin: Math.round(climbInit.gsKt*101.269),
    climbCruVz: Math.round(climbCru.vz), climbCruGamma: climbCru.gamma,
    cruiseTAS: cr?Math.round(cr.ktas):null, cruiseUSGh: cr?cr.usgh.toFixed(1):null,
  };
}
function fpfMnBData(){
  const ac = AIRCRAFT_DB[state.aircraft];
  const r = computeMnB();
  const toInside = pointInPolygon([r.toArm, r.toMass], ac.envelope);
  const ldInside = pointInPolygon([r.ldgArm, r.ldgMass], ac.envelope);
  return {
    acLabel: ac.label, reg: r.reg.tail,
    emptyMass: r.emptyMass, emptyArm: +(r.emptyMoment/r.emptyMass).toFixed(3),
    stationRows: r.stationRows.map(s=>({label:s.label, mass:s.mass, arm:s.arm, moment:+(s.mass*s.arm).toFixed(1)})),
    fuelRows: r.fuelRows.map(f=>({label:f.label, usg:f.usg, kg:+f.kg.toFixed(1), arm:f.arm, moment:+(f.kg*f.arm).toFixed(1)})),
    zfMass: ac.maxZFM!=null ? +r.zfMass.toFixed(1) : null,
    zfArm: ac.maxZFM!=null ? +(r.zfMoment/r.zfMass).toFixed(3) : null,
    zfMoment: ac.maxZFM!=null ? +r.zfMoment.toFixed(1) : null, maxZFM: ac.maxZFM,
    toMass: +r.toMass.toFixed(1), toArm: +r.toArm.toFixed(3), toMoment: +r.toMoment.toFixed(1), maxTOM: ac.maxTOM,
    ldgMass: +r.ldgMass.toFixed(1), ldgArm: +r.ldgArm.toFixed(3), maxLDG: ac.maxLDG,
    burnKg: +r.burnKg.toFixed(1),
    toInside, ldInside,
    envelope: ac.envelope,
    toPoint: {cg:r.toArm, mass:r.toMass}, ldgPoint: {cg:r.ldgArm, mass:r.ldgMass},

async function fpfBuildFolder(data){
  const { PDFDocument, StandardFonts, rgb } = PDFLib;

  const folderBytes = await fpfLoadBytes(fpfTemplatePaths.folder);
  const folderDoc = await PDFDocument.load(folderBytes);
  const font = await folderDoc.embedFont(StandardFonts.Helvetica);
  const SIZE = 9.5;
  const COLOR = rgb(0.1, 0.15, 0.55);

  const drawIn = (pageIdx, x0, x1, top, bottom, text, opts) => {
    if(text==null || text==='') return;
    opts = opts || {};
    const page = folderDoc.getPages()[pageIdx];
    const size = opts.size || SIZE;
    const y = fpfPdfY(top, bottom, opts.frac);
    let x = x0 + 3;
    if(opts.align==='center'){
      const w = font.widthOfTextAtSize(String(text), size);
      x = (x0+x1)/2 - w/2;
    }
    page.drawText(String(text), { x, y, size, font, color: COLOR });
  };

  // PAGE 1 — cover
  drawIn(0, 124.15,211.27, 244.79,264.55, data.dof);
  drawIn(0, 298.15,363.51, 244.79,264.55, data.crew, {align:'center'});
  drawIn(0, 472.47,559.55, 244.79,264.55, data.pax, {align:'center'});

  drawIn(0, 312.07,384.23, 298.75,316.16, data.fobGal, {align:'center'});

    { top:416.96, bottom:434.55, icao:data.depIcao, ppr:data.pprDep, boarding:data.boarding, eobt:data.eobt },
    { top:434.55, bottom:452.31, icao:null },

    { top:469.83, bottom:487.35, icao:data.altnIcao },

    if(r.boarding) drawIn(0, 370.10,445.35, r.top,r.bottom, r.boarding, {align:'center'});
    if(r.eobt) drawIn(0, 445.35,500.07, r.top,r.bottom, r.eobt, {align:'center'});
  }

  // PAGE 3 — weather (ICAO CODE + RWY/APP only)
  const wxGroups = [
    { icao:data.depIcao, rwy:data.depRwy, top:415.3, bottom:471.0, subTop:429.3, subBottom:443.2 },
    { icao:null, rwy:null, top:471.0, bottom:526.7, subTop:484.9, subBottom:498.9 },
    { icao:data.destIcao, rwy:data.destRwy, top:526.7, bottom:582.4, subTop:540.6, subBottom:554.5 },
    { icao:data.altnIcao, rwy:data.altnRwy, top:582.4, bottom:638.1, subTop:596.3, subBottom:610.2 },
    { icao:data.altn2Icao, rwy:data.altn2Rwy, top:638.1, bottom:693.7, subTop:652.0, subBottom:665.9 },
  ];
  for(const g of wxGroups){
    drawIn(2, 177.5,214.0, g.top,g.bottom, g.icao, {align:'center', frac:0.46});
    drawIn(2, 214.0,277.8, g.subTop,g.subBottom, g.rwy, {align:'center'});
  }

  // Assemble final document in Paul's requested order
  const out = await PDFDocument.create();
  const copyOne = async (srcDoc, idx) => { const [p] = await out.copyPages(srcDoc, [idx]); out.addPage(p); };
  const copyRange = async (srcDoc, from, to) => {
    const idxs = []; for(let i=from;i<=to;i++) idxs.push(i);
    const ps = await out.copyPages(srcDoc, idxs); ps.forEach(p=>out.addPage(p));
  };
  const mergeExternalPdf = async (path) => {

      {nameTop:335.5, nameBot:362.4, dataTop:362.4, dataBot:389.6},
      {nameTop:389.6, nameBot:415.8, dataTop:415.8, dataBot:442.5},
      {nameTop:442.5, nameBot:470.3, dataTop:470.3, dataBot:497.0},

      draw(390.4,417.8, 694.7,706.7, ofp.ldm+' kg', {size:7.5, erase:true});

      draw(388.4,415.8, 749.9,761.9, ofp.ld!=null?ofp.ld+' m':null, {size:7.5, erase:true});
      draw(438.7,466.1, 805.1,817.1, ofp.dptBlock, {size:7.5, erase:true});

  const mergeMassBalancePage = async (mnb) => {

    const rule = (x0,x1,y) => page.drawLine({ start:{x:x0,y}, end:{x:x1,y}, thickness:0.6, color:LINE });

      t(colX.label,y,'ITEM',{size:8,bold:true,color:GREY});

      t(colX.arm,y,'ARM (M)',{size:8,bold:true,color:GREY});
      t(colX.moment,y,'MOMENT (KG.M)',{size:8,bold:true,color:GREY});

      y -= 15;
    });
    y -= 4; rule(50,545,y); y -= 16;
    const limitRow = (label, mass, arm, moment, max) => {
      const over = max!=null && mass>max;
      t(colX.label,y,label,{bold:true});
      t(colX.mass,y,mass.toFixed(1),{bold:true});
      if(arm!=null) t(colX.arm,y,arm.toFixed(3));
      if(moment!=null) t(colX.moment,y,moment.toFixed(1));
      if(max!=null) t(colX.limit,y, (over?'EXCEEDS ':'OK <= ')+max+' kg', {color: over?RED:GREEN, bold:true, size:8.5});

    if(mnb.zfMass!=null) limitRow('ZFM', mnb.zfMass, mnb.zfArm, mnb.zfMoment, mnb.maxZFM);
    limitRow('TOM', mnb.toMass, mnb.toArm, mnb.toMoment, mnb.maxTOM);

    y -= 26;

    // ---- CG envelope graph ----
    const boxX=60, boxW=470, boxH=300, boxY=y-boxH;
    const padL=48, padB=28, padT=14, padR=14;
    const allX = mnb.envelope.map(p=>p[0]).concat([mnb.toPoint.cg, mnb.ldgPoint.cg]);
    const allY = mnb.envelope.map(p=>p[1]).concat([mnb.toPoint.mass, mnb.ldgPoint.mass]);
    const xmin = Math.min(...allX)-0.03, xmax = Math.max(...allX)+0.03;
    const ymin = Math.min(...allY)-60, ymax = Math.max(...allY)+60;
    const sx = x => boxX+padL + (x-xmin)/(xmax-xmin) * (boxW-padL-padR);
    const sy = v => boxY+padB + (v-ymin)/(ymax-ymin) * (boxH-padB-padT);
    page.drawRectangle({ x:boxX, y:boxY, width:boxW, height:boxH, borderColor:LINE, borderWidth:0.8, color:rgb(0.985,0.985,0.99) });
    for(let i=0;i<=4;i++){
      const yv = ymin + (ymax-ymin)*i/4;
      page.drawLine({ start:{x:boxX+padL,y:sy(yv)}, end:{x:boxX+boxW-padR,y:sy(yv)}, thickness:0.5, color:LINE });
      t(boxX+padL-38, sy(yv)-3, Math.round(yv), {size:7.5, color:GREY});
    }
    for(let i=0;i<=4;i++){
      const xv = xmin + (xmax-xmin)*i/4;

      page.drawLine({ start:{x:boxX+padL,y:sy(p.mass)}, end:{x:sx(p.cg),y:sy(p.mass)}, thickness:0.6, color, dashArray:[2,2] });

    const BLUE = rgb(0.35,0.55,1), ORANGE = rgb(0.88,0.66,0.34);

    const legend2X = boxX+16+font.widthOfTextAtSize(`Takeoff (${mnb.toInside?'within envelope':'OUTSIDE ENVELOPE'})`,8.5)+22;

async function fpfExport(){
  const btn = document.getElementById('btn-export-fpf');
  const status = document.getElementById('fpf-export-status');
  if(!window.PDFLib){ if(status) status.textContent = 'Error: pdf-lib not loaded (check your connection).'; return; }
  if(btn){ btn.disabled = true; btn.textContent = '⏳ Generating…'; }
  if(status) status.textContent = '';
  try{
    const data = fpfGatherData();
    const bytes = await fpfBuildFolder(data);
    const blob = new Blob([bytes], {type:'application/pdf'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Flight_Planning_Folder_${(state.depIcao||'DEP')}-${(state.destIcao||'DEST')}_${state.eobtDate||''}.pdf`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    if(status) status.textContent = '✓ Folder generated (' + Math.round(bytes.length/1024) + ' KB). OFP, performance charts and M&B image still need to be completed by hand for now.';
  }catch(e){
    console.error(e);
    if(status) status.textContent = '❌ ' + e.message;
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = '📦 Export flight planning folder (PDF)'; }
  }
}

function renderTodPanel(){
  if(state.waypoints.length < 2) return '';
  const defaultTarget = state.waypoints.length - 1;
  const targetIdx = state.todTargetIdx != null ? state.todTargetIdx : defaultTarget;
  const targetOptions = state.waypoints.map((wp,i)=> i===0 ? '' :
    `<option value="${i}" ${i===targetIdx?'selected':''}>${escapeHtml(wp.name)} (${Math.round(wp.alt ?? state.cruiseAlt)} ft)</option>`).join('');
  const suggested = todSuggestedDistance(targetIdx);
  const distValue = state.todManualDistNM != null ? state.todManualDistNM : (suggested ?? '');
  return `
  <div class="card" style="background:var(--bg-2);margin-bottom:14px;">
    <div class="card-title">Insert a TOD point (Top of Descent)</div>
    <div class="field-row">
      <div class="field"><label>Descend to</label>
        <select id="in-tod-target">${targetOptions}</select></div>
      <div class="field"><label>Safety margin (NM)</label>
        <input id="in-tod-margin" type="number" step="0.5" value="${state.todMarginNM}"></div>
      <div class="field"><label>TOD distance (NM) — editable</label>
        <input id="in-tod-dist" type="number" step="0.1" value="${distValue}"
          placeholder="${suggested!=null ? 'suggested '+suggested+' NM' : 'target not lower than cruise'}"></div>
      <div class="field" style="justify-content:flex-end;">
        <button class="btn btn-primary" id="btn-insert-tod" style="margin-top:18px;">↓ Insert</button>
      </div>
    </div>
    <div class="status-line">Suggestion = ΔFL/3 + margin, where ΔFL = (Cruise level − Target alt.)/100. Can span multiple segments if needed. You can override the suggested value and place the TOD wherever you want.</div>
  </div>`;
}
function renderTocPanel(){
  if(state.waypoints.length < 2) return '';
  const sourceIdx = state.tocSourceIdx != null ? state.tocSourceIdx : 0;
  const sourceOptions = state.waypoints.map((wp,i)=> i===state.waypoints.length-1 ? '' :
    `<option value="${i}" ${i===sourceIdx?'selected':''}>${escapeHtml(wp.name)} (${Math.round(wp.alt ?? 0)} ft)</option>`).join('');
  const suggested = tocSuggestedDistance(sourceIdx);
  const distValue = state.tocManualDistNM != null ? state.tocManualDistNM : (suggested ?? '');
  const ac = AIRCRAFT_DB[state.aircraft];
  const climbFpm = (ac.climbFpmByTail && ac.climbFpmByTail[state.regTail]) || ac.climbFpmDefault;
  return `
  <div class="card" style="background:var(--bg-2);margin-bottom:14px;">
    <div class="card-title">Insert a TOC point (Top of Climb)</div>
    <div class="field-row">
      <div class="field"><label>Climb from</label>
        <select id="in-toc-source">${sourceOptions}</select></div>
      <div class="field"><label>TOC distance (NM) — editable</label>
        <input id="in-toc-dist" type="number" step="0.1" value="${distValue}"
          placeholder="${suggested!=null ? 'suggested '+suggested+' NM' : (climbFpm?'target not higher than cruise':'climb rate unknown for this aircraft')}"></div>
      <div class="field" style="justify-content:flex-end;">
        <button class="btn btn-primary" id="btn-insert-toc" style="margin-top:18px;">↑ Insert</button>
      </div>
    </div>
    <div class="status-line">Suggested distance = climb speed × (Cruise level − Source alt.) / climb rate${climbFpm?` (${ac.climbSpeedKt}kt @ ${climbFpm} ft/min for ${escapeHtml(state.regTail)})`:''}. Can span multiple segments. You can override the suggested value and place the TOC wherever you want.</div>
  </div>`;
}

  const bind = (id, key, num) => {

      if(id==='in-name') renderTopbar();
    });

  bind('in-name','flightName',false);

  bind('in-descent-tas','descentTas',true);
  bind('in-alt','cruiseAlt',true);
  bind('in-date','eobtDate',false);
  bind('in-time','eobtTime',false);
  bind('in-var','variation',true);
  bind('in-boarding','boardingTime',false);
  bind('in-crew','crew',true);
  bind('in-pax','pax',true);

  if(inTocDist) inTocDist.addEventListener('change', e=>{
    state.tocManualDistNM = e.target.value === '' ? null : parseFloat(e.target.value);

  });
  const btnAutoFl = document.getElementById('btn-auto-fl');
  if(btnAutoFl) btnAutoFl.onclick = computeAutoFL;
  const btnFlAuto = document.getElementById('btn-fl-auto');
  if(btnFlAuto) btnFlAuto.onclick = ()=>{ state.flAutoMode = true; renderContent(); };
  const btnFlManual = document.getElementById('btn-fl-manual');
  if(btnFlManual) btnFlManual.onclick = ()=>{ state.flAutoMode = false; renderContent(); };
  document.getElementById('btn-center-lfmd').onclick = ()=> map.setView([43.5417,6.9531], 11);
  document.getElementById('btn-clear-wp').onclick = ()=>{
    if(confirm('Clear all points?')){ state.waypoints=[]; state.legs=[]; renderAll(); }
  };
  const btnPlaceAltn = document.getElementById('btn-place-altn');
  if(btnPlaceAltn) btnPlaceAltn.onclick = ()=>{ state.placingAlternate = !state.placingAlternate; renderContent(); };
  const btnClearAltn = document.getElementById('btn-clear-altn');
  if(btnClearAltn) btnClearAltn.onclick = ()=>{ state.alternatePoint = null; renderAll(); };
  const btnOpenaipKey = document.getElementById('btn-apply-openaipkey');
  if(btnOpenaipKey) btnOpenaipKey.onclick = async ()=>{
    const val = document.getElementById('in-openaipkey').value.trim();
    state.openaipApiKey = val;
    rebuildOpenAipLayers();
    try{ await appStorage.set('app_settings', JSON.stringify({openaipApiKey: val})); }catch(e){}
    showToast(val ? 'OpenAIP key applied — enables overlays in the layer selector.' : 'OpenAIP key removed.');
  };

  wireWaypointRowEvents();
  wireFuelInputs();
  wireFuelInputsNco();
  wireMnbInputs();
  wirePerfInputs();
  wireWeatherCard();
  wireBriefingSection();
  wireNavLogNotes();
  const btnFillFreq = document.getElementById('btn-fill-freq');
  if(btnFillFreq) btnFillFreq.onclick = fillDepArrFrequencies;
  const btnExportFpf = document.getElementById('btn-export-fpf');
  if(btnExportFpf) btnExportFpf.onclick = fpfExport;
  refreshMap();
}

/* ---------- Onglet "Performances" — outil rapide décollage/atterrissage seul (sans Fiche Part-CAT/NCO),
   pensé pour un calcul ponctuel en vol, indépendant d'un plan de vol en cours d'édition. Réutilise
   directement state.perf et renderPerfSection (mode simplifié) — même moteur de calcul que la fiche
   complète, juste sans le contexte "Nouveau vol" (carte, nav log, fuel, M&B). ---------- */
function renderPerfStandalone(){
  const el = document.getElementById('content');
  const ac = AIRCRAFT_DB[state.aircraft];
  const acOptions = Object.entries(AIRCRAFT_DB).map(([k,v])=>
    `<option value="${k}" ${state.aircraft===k?'selected':''}>${v.label}</option>`).join('');
  const regOptions = ac.registrations.map(r=>
    `<option value="${r.tail}" ${state.regTail===r.tail?'selected':''}>${r.tail} (${r.mass} kg)</option>`).join('');
  el.innerHTML = `
    <div class="card">
      <div class="card-title">Aircraft</div>
      <div class="field-row">
        <div class="field"><label>Type</label><select id="perfstd-aircraft">${acOptions}</select></div>
        <div class="field"><label>Registration</label><select id="perfstd-reg">${regOptions}</select></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title">Takeoff / landing performance — ${ac.label}</div>
      ${renderPerfSection({simplified:true})}
    </div>`;

  const inAc = document.getElementById('perfstd-aircraft');
  if(inAc) inAc.addEventListener('change', e=>{
    state.aircraft = e.target.value;
    state.regTail = AIRCRAFT_DB[state.aircraft].registrations[0].tail;
    state.perf.massTO = null; state.perf.massLDG = null;
    state.perf.massTOTouched = false; state.perf.massLDGTouched = false;
    if(!state.perf.loadPctTouched) state.perf.loadPct = perfDefaultLoadPct(state.regTail);
    renderContent();
  });
  const inReg = document.getElementById('perfstd-reg');
  if(inReg) inReg.addEventListener('change', e=>{
    state.regTail = e.target.value;
    if(!state.perf.loadPctTouched) state.perf.loadPct = perfDefaultLoadPct(state.regTail);
    renderContent();
  });
  wirePerfInputs();
  renderSidebarActive();
}

/* ---------- waypoints table ---------- */
function renderWaypointTable(){
  if(state.waypoints.length===0){
    return `<div class="empty-state">No points yet — click on the map above to place your first point (departure).</div>`;
  }
  const rows = state.waypoints.map((wp,i)=>`
    <tr data-wid="${wp.id}">
      <td style="color:var(--text-2);">${i+1}</td>
      <td><input class="wp-name-input" data-field="name" value="${escapeHtml(wp.name)}"></td>
      <td>${wp.lat.toFixed(4)}</td>
      <td>${wp.lon.toFixed(4)}</td>
      <td><input data-field="alt" type="number" step="50" value="${wp.alt ?? state.cruiseAlt}" style="width:64px;"> ft</td>
      <td>
        <input data-field="windDir" type="number" min="0" max="360" step="1" value="${wp.windDir ?? ''}" placeholder="dir° True" style="width:56px;">
        <span class="${wp.manual ? 'manual-tag':'auto-tag'}">${wp.manual?'manual':'auto'}</span>
        ${wp.manual ? `<button class="small-btn" data-act="reset-auto" title="Switch back to auto (will fetch Open-Meteo wind again on next computation)">↺ auto</button>` : ''}
      </td>
      <td><input data-field="windSpeed" type="number" min="0" value="${wp.windSpeed ?? ''}" placeholder="kt" style="width:50px;"></td>
      <td>
        <button class="small-btn" data-act="up" title="Move up">↑</button>
        <button class="small-btn" data-act="down" title="Move down">↓</button>
        <button class="small-btn" data-act="del" title="Delete">✕</button>
      </td>
    </tr>`).join('');
  return `<table>
    <thead><tr><th>#</th><th>Name</th><th>Lat</th><th>Lon</th><th>Alt</th><th>Wind dir (° True)</th><th>Wind (kt)</th><th></th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}
function wireWaypointRowEvents(){
  document.querySelectorAll('#content tr[data-wid]').forEach(tr=>{
    const id = parseInt(tr.dataset.wid);
    tr.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('change', e=>{
        const wp = state.waypoints.find(w=>w.id===id);
        const field = e.target.dataset.field;
        if(field==='name'){ wp.name = e.target.value || wp.name; renderMapMarkers(); }
        else if(field==='windDir'){
          if(e.target.value === ''){ wp.windDir = null; }
          else{
            let v = parseFloat(e.target.value);
            if(isNaN(v)) v = 0;
            v = ((v % 360) + 360) % 360; // clamp into [0,360), reject negatives by wrapping
            wp.windDir = v;
          }
          wp.manual = true;
          renderContent();
        }
        else if(field==='windSpeed'){
          let v = e.target.value === '' ? null : parseFloat(e.target.value);
          if(v !== null && (isNaN(v) || v < 0)) v = 0;
          wp.windSpeed = v;
          wp.manual = true;
          renderContent();
        }
        else if(field==='alt'){
          let v = parseFloat(e.target.value);
          if(isNaN(v)) v = state.cruiseAlt;
          wp.alt = v;
          state.legs = [];
          renderContent();
        }
        else{ wp[field] = e.target.value === '' ? null : parseFloat(e.target.value); wp.manual = true; renderContent(); }
      });
    });
    tr.querySelectorAll('button[data-act]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const idx = state.waypoints.findIndex(w=>w.id===id);
        const act = btn.dataset.act;
        if(act==='del'){ state.waypoints.splice(idx,1); }
        else if(act==='up' && idx>0){ [state.waypoints[idx-1],state.waypoints[idx]]=[state.waypoints[idx],state.waypoints[idx-1]]; }
        else if(act==='down' && idx<state.waypoints.length-1){ [state.waypoints[idx+1],state.waypoints[idx]]=[state.waypoints[idx],state.waypoints[idx+1]]; }
        else if(act==='reset-auto'){
          const wp = state.waypoints[idx];
          wp.manual = false; wp.windError = false;
          showToast('Switched back to auto — click "Compute nav log" again to fetch Open-Meteo wind.');
        }
        state.legs = [];
        renderAll();
      });
    });
  });
}

function renderFuelTable(){
  const ac = AIRCRAFT_DB[state.aircraft];
  const fp = state.fuelParams;
  const cruiseUSGh = ac.cruiseUSGh != null ? ac.cruiseUSGh : fp.manualCruiseUSGh;
  const holdUSGh = ac.holdUSGh != null ? ac.holdUSGh : cruiseUSGh; // Extra Fuel (anticipated delays) is holding-pattern fuel, flown at hold power
  const taxiUSG = ac.taxiUSG != null ? ac.taxiUSG : fp.manualTaxiUSG;
  const finalReserveUSG = ac.finalReserveUSG != null ? ac.finalReserveUSG : fp.manualFinalReserveUSG;

  if(state.legs.length===0){
    return `<div class="empty-state">Compute the nav log first to get the Trip Fuel.</div>`;
  }
  const tripMin = state.legs[state.legs.length-1].cumMin;
  const tripUSG = state.legs.reduce((s,l)=>s+l.fuelUSG, 0);
  const contUSG = tripUSG * (fp.contingencyPct/100);
  const contMin = tripMin * (fp.contingencyPct/100);
  const additionalMin = fp.additionalMin||0, extraMin = fp.extraMin||0;
  const discretionaryMin = fp.discretionaryMin||0, discretionaryUSG = fp.discretionaryUSG||0;
  // Internal calculation stays precise (taxi/reserve = unrounded school reference values); only
  // the DISPLAY is rounded to the unit. The total (H) is rounded UP (never to the nearest unit):
  // a regulatory minimum must never be displayed below its true value. Contingency (C) is rounded
  // UP too, for the same reason: 5% of a non-zero trip is never actually zero, so it must never
  // display as "0" even if it rounds to under 1 USG.
  const minReq = taxiUSG + tripUSG + contUSG + fp.altnUSG + finalReserveUSG + fp.additionalUSG + fp.extraUSG;
  state._lastFuelTotalUSG = minReq; // used to prefill M&B — precise value, not rounded
  const minReqDisp = Math.ceil(minReq);
  const minReqMin = tripMin + contMin + fp.altnMin + ac.finalReserveMin + additionalMin + extraMin;
  const contUSGdisp = Math.ceil(contUSG);

  const cruiseInput = ac.cruiseUSGh != null
    ? `${ac.cruiseUSGh} USG/h (${ac.cruisePct})${ac.climbUSGh!=null?', climb '+ac.climbUSGh+' USG/h':''}${ac.descentUSGh!=null?', descent '+ac.descentUSGh+' USG/h':''}`

    <tbody>
      <tr><td>A</td><td>Taxi fuel</td><td>—</td><td>${taxiInput}</td></tr>
      <tr><td>B</td><td>Trip fuel (cons. ${cruiseInput})</td><td>${fmtMin(tripMin)}</td><td>${Math.round(tripUSG)}</td></tr>
      <tr><td>C</td><td>Contingency (${fp.contingencyPct}% trip)</td><td>${fmtMin(contMin)}</td><td>${contUSGdisp}</td></tr>
      <tr><td>D</td><td>Alternate fuel <input data-fp="altnMin" type="number" value="${fp.altnMin}" style="width:40px;">min /
        <input data-fp="altnUSG" type="number" step="1" value="${Math.round(fp.altnUSG)}" style="width:44px;">USG
        <button class="small-btn" id="btn-calc-altn" title="Compute from the alternate point placed on the map" style="border:1px solid var(--border);padding:2px 6px;">🧮 Compute</button></td>

        <input data-fp="additionalUSG" type="number" step="1" value="${Math.round(fp.additionalUSG)}" style="width:44px;">USG</td>
        <td>${fmtMin(additionalMin)}</td><td>${Math.round(fp.additionalUSG)}</td></tr>

function wireFuelInputs(){
  // Additional/Extra/Discretionary fuel: Min and USG are two views of the same quantity, kept in
  // sync via the relevant consumption rate whenever either one is edited. Extra Fuel is defined as
  // covering anticipated delays / holding — i.e. flown at HOLD power, not cruise — so it converts
  // at the hold rate (3.5 USG/h for the DA40); Additional and Discretionary use the classic cruise
  // rate, matching Trip Fuel above.
  const fpSyncPairs = {
    additionalMin: ['additionalUSG','cruise'], additionalUSG: ['additionalMin','cruise'],
    extraMin: ['extraUSG','hold'], extraUSG: ['extraMin','hold'],
    discretionaryMin: ['discretionaryUSG','cruise'], discretionaryUSG: ['discretionaryMin','cruise'],
  };
  document.querySelectorAll('[data-fp]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const key = e.target.dataset.fp;
      const val = Math.round(parseFloat(e.target.value))||0;
      state.fuelParams[key] = val;
      const pair = fpSyncPairs[key];
      if(pair){
        const [otherKey, kind] = pair;
        const ac = AIRCRAFT_DB[state.aircraft];
        const cruiseRate = ac.cruiseUSGh != null ? ac.cruiseUSGh : state.fuelParams.manualCruiseUSGh;
        const rate = kind==='hold' ? (ac.holdUSGh != null ? ac.holdUSGh : cruiseRate) : cruiseRate;
        if(rate){
          state.fuelParams[otherKey] = key.endsWith('Min')
            ? Math.round((val/60)*rate)   // minutes entered -> derive USG
            : Math.round((val/rate)*60);  // USG entered -> derive minutes
        }
      }
      renderContent();
    });
  });
  const btnCalcAltn = document.getElementById('btn-calc-altn');
  if(btnCalcAltn) btnCalcAltn.onclick = computeAlternateFuel;
  const btn = document.getElementById('btn-fuel-to-mnb');
  if(btn) btn.onclick = ()=>{
    const ac = AIRCRAFT_DB[state.aircraft];
    const total = Math.ceil(state._lastFuelTotalUSG || 0);
    // put it all in the first fuel station (MAIN), capped at its usable capacity
    const main = ac.fuelStations[0];
    state.mnb.fuel[main.key] = Math.min(total, main.usableUSG);
    renderContent();
    showToast('Fuel carried over to Mass & Balance ✓');
  };
  wireFuelModeToggle();
}

/* ---------- Mass & Balance ---------- */
function pointInPolygon(pt, poly){
  let inside = false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    const intersect = ((yi>pt[1]) !== (yj>pt[1])) && (pt[0] < (xj-xi)*(pt[1]-yi)/(yj-yi)+xi);
    if(intersect) inside = !inside;
  }
  return inside;
}
function computeMnB(){
  const ac = AIRCRAFT_DB[state.aircraft];
  const reg = ac.registrations.find(r=>r.tail===state.regTail) || ac.registrations[0];
  const emptyMass = reg.mass, emptyMoment = reg.moment;

  let zfMass = emptyMass, zfMoment = emptyMoment;
  const stationRows = ac.stations.map(s=>{
    const mass = state.mnb.stations[s.key] || 0;
    zfMass += mass; zfMoment += mass*s.arm;
    return { ...s, mass };
  });

  let toMass = zfMass, toMoment = zfMoment, fuelMassTotal = 0;
  const fuelRows = ac.fuelStations.map(f=>{
    const usg = state.mnb.fuel[f.key] || 0;
    const kg = usg * ac.kgPerUSG;
    fuelMassTotal += kg;
    toMass += kg; toMoment += kg*f.arm;
    return { ...f, usg, kg };
  });
  const toArm = toMass>0 ? toMoment/toMass : 0;

  // landing = takeoff minus trip fuel burn (from computed nav log if available), burned from MAIN tank arm
  const tripMin = state.legs.length ? state.legs[state.legs.length-1].cumMin : 0;
  const cruiseUSGh = ac.cruiseUSGh != null ? ac.cruiseUSGh : state.fuelParams.manualCruiseUSGh;
  const burnUSG = (tripMin/60) * (cruiseUSGh||0);
  const burnKg = burnUSG * ac.kgPerUSG;
  const mainArm = ac.fuelStations[0].arm;
  const ldgMass = Math.max(toMass - burnKg, zfMass);
  const ldgMoment = toMoment - burnKg*mainArm;
  const ldgArm = ldgMass>0 ? ldgMoment/ldgMass : 0;

  return { ac, reg, emptyMass, emptyMoment, stationRows, fuelRows, fuelMassTotal,
    zfMass, zfMoment, toMass, toMoment, toArm, burnKg, ldgMass, ldgArm };
}

function limitBar(val, max){
  if(max == null) return '';
  const pct = Math.min(100, (val/max)*100);
  return `<div class="limit-bar"><div class="limit-fill ${val>max?'over':''}" style="width:${pct}%;"></div></div>`;
}

function envelopeSVG(ac, points){
  const allX = ac.envelope.map(p=>p[0]).concat(points.map(p=>p.cg));
  const allY = ac.envelope.map(p=>p[1]).concat(points.map(p=>p.mass));
  const xmin = Math.min(...allX)-0.03, xmax = Math.max(...allX)+0.03;
  const ymin = Math.min(...allY)-60, ymax = Math.max(...allY)+60;
  const W=300,H=220,padL=46,padB=26,padT=10,padR=10;
  const sx = x => padL + (x-xmin)/(xmax-xmin) * (W-padL-padR);
  const sy = y => (H-padB) - (y-ymin)/(ymax-ymin) * (H-padB-padT);
  const poly = ac.envelope.map(p=>`${sx(p[0]).toFixed(1)},${sy(p[1]).toFixed(1)}`).join(' ');
  let gridY = '';
  const ySteps = 4;
  for(let i=0;i<=ySteps;i++){
    const yv = ymin + (ymax-ymin)*i/ySteps;
    gridY += `<line x1="${padL}" y1="${sy(yv).toFixed(1)}" x2="${W-padR}" y2="${sy(yv).toFixed(1)}" stroke="#232834" stroke-width="1"/>
      <text x="${padL-6}" y="${(sy(yv)+3).toFixed(1)}" font-size="8.5" fill="#6b7385" text-anchor="end">${Math.round(yv)}</text>`;
  }
  const xSteps = 4;
  let gridX = '';
  for(let i=0;i<=xSteps;i++){
    const xv = xmin + (xmax-xmin)*i/xSteps;
    gridX += `<text x="${sx(xv).toFixed(1)}" y="${H-padB+14}" font-size="8.5" fill="#6b7385" text-anchor="middle">${xv.toFixed(2)}</text>`;
  }
  const pointsSVG = points.map((p,pi)=>{
    // takeoff (first point) drawn larger as a ring so it stays visible even when landing sits exactly on top of it
    const r = pi===0 ? 7 : 4;
    const strokeW = pi===0 ? 2.5 : 1.5;
    return `<line x1="${padL}" y1="${sy(p.mass).toFixed(1)}" x2="${sx(p.cg).toFixed(1)}" y2="${sy(p.mass).toFixed(1)}" stroke="${p.color}" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="${sx(p.cg).toFixed(1)}" y1="${sy(p.mass).toFixed(1)}" x2="${sx(p.cg).toFixed(1)}" y2="${H-padB}" stroke="${p.color}" stroke-width="1" stroke-dasharray="2,2"/>
      <circle cx="${sx(p.cg).toFixed(1)}" cy="${sy(p.mass).toFixed(1)}" r="${r}" fill="${pi===0?'none':p.color}" stroke="${p.color}" stroke-width="${strokeW}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:var(--bg-0);border-radius:8px;">
    ${gridY}${gridX}
    <polygon points="${poly}" fill="rgba(79,209,165,0.10)" stroke="#4fd1a5" stroke-width="1.5"/>
    ${pointsSVG}
    <text x="${W/2}" y="${H-4}" font-size="9" fill="#6b7385" text-anchor="middle">Lever arm (m)</text>
  </svg>`;
}
