/* ---------- Performances (décollage / atterrissage) ---------- */
function perfFmt(n){ return Math.round(n).toLocaleString('fr-FR'); }
function perfVerdict(avail,req){
  if(req>avail) return ['bad','INSUFFISANT'];
  const m=(avail-req)/avail; if(m<0.15) return ['warn','MARGE FAIBLE']; return ['ok','OK'];
}
function perfNotesHTML(notes){
  if(!notes.length) return '';
  return '<div class="perf-notes">'+notes.map(([t,m])=>`<div class="${t==='e'?'ne':'nw'}">› ${escapeHtml(m)}</div>`).join('')+'</div>';
}
function perfRunwaySVG(avail,req,roll,qfu){
  const W=560,H=80,pad=8;
  const scale=Math.max(avail,req)*1.06 || 1;
  const px=v=>pad+(v/scale)*(W-2*pad);
  const ribY=24,ribH=26;
  const reqX=px(req), rollX=px(roll), availX=px(avail);
  const exceed=req>avail;
  const reqCol=exceed?'var(--danger)':(avail-req)/avail<0.15?'var(--warn)':'var(--accent)';
  let dashes=''; for(let x=pad+34;x<availX-6;x+=26){ dashes+=`<rect x="${x}" y="${ribY+ribH/2-1.1}" width="12" height="2.2" fill="#3a4155" rx="1"/>`; }
  const rwyNum = qfu!=null ? String(Math.round(qfu/10)%36).padStart(2,'0') : null;
  const numMark = rwyNum ? `
    <text x="${pad+13}" y="${ribY+ribH/2+7}" fill="#e8ecf4" font-size="17" font-weight="700" text-anchor="middle" font-family="var(--mono)">${rwyNum}</text>` : '';
  return `<svg class="perf-rwy" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
    <rect x="${pad}" y="${ribY}" width="${availX-pad}" height="${ribH}" rx="3" fill="var(--bg-1)" stroke="var(--border)"/>
    ${dashes}
    <rect x="${pad}" y="${ribY}" width="${reqX-pad}" height="${ribH}" rx="3" fill="${reqCol}" opacity="0.16"/>
    <rect x="${pad}" y="${ribY}" width="${rollX-pad}" height="${ribH}" fill="${reqCol}" opacity="0.32"/>
    ${numMark}
    <line x1="${reqX}" y1="${ribY-5}" x2="${reqX}" y2="${ribY+ribH+5}" stroke="${reqCol}" stroke-width="2"/>
    <text x="${reqX}" y="${ribY-8}" fill="${reqCol}" font-size="10.5" text-anchor="middle">${perfFmt(req)} m</text>
    <line x1="${availX}" y1="${ribY-3}" x2="${availX}" y2="${ribY+ribH+3}" stroke="var(--text-2)" stroke-width="1.5"/>
    <text x="${availX}" y="${ribY+ribH+17}" fill="var(--text-1)" font-size="9" text-anchor="end">dispo ${perfFmt(avail)} m</text>
  </svg>`;
}
function perfReadInputs(){
  const p = state.perf;
  let qnh = p.qnh; if(p.qnhUnit==='inhg') qnh = qnh*33.8639;
  const elev = p.elev;
  const pa = elev + (1013.25-qnh)*27;
  const oat = p.oat;
  const isa = oat - PERF_DA40.isaTemp(pa);
  const sig = PERF_DA40.sigma(pa,oat);
  const slope = p.slope*(p.slopeDir==='up'?1:-1);
  let ang=(p.wdir-p.qfu)*Math.PI/180;
  const spd=p.wspd;
  const head = spd*Math.cos(ang), cross = Math.abs(spd*Math.sin(ang));
  return{pa,oat,isa,sig,qfu:p.qfu,tora:p.tora,lda:p.lda,slope,surf:p.surf,state:p.pstate,head,cross};
}

/* ---------- Fiche récap toutes pistes — Part-CAT (formulaire officiel Cannes Aviation) ----------
   Décollage : TOD × 1.25 ≤ TORA (cas "sans clearway ni stopway", nos bases pistes ne suivent pas
   la présence de CWY/STW donc c'est le cas par défaut retenu — dis-le moi si une piste en a une,
   je coderai la variante TOD≤TORA / TOD×1.15≤TODA / ASD×1.3≤ASDA).
   Montée : γ nette = γ brute × 0.77 (facteur réglementaire net de la trajectoire de décollage).
   Atterrissage : LD ≤ LDA × 0.7 (CAT.POL.A.230). */
function qfuFromDesignator(designator){
  const m = (designator||'').match(/(\d{1,2})/);
  if(!m) return null;
  const n = parseInt(m[1],10);
  if(isNaN(n)) return null;
  return norm360(n*10);
}
function perfSheetAtmoAt(elevFt){
  const p = state.perf;
  let qnh = p.qnh; if(p.qnhUnit==='inhg') qnh = qnh*33.8639;
  const elev = elevFt!=null ? elevFt : p.elev;
  const pa = elev + (1013.25-qnh)*27;
  const oat = p.oat;
  const isa = oat - PERF_DA40.isaTemp(pa);
  const sig = PERF_DA40.sigma(pa,oat);
  const slope = p.slope*(p.slopeDir==='up'?1:-1);
  return {pa,oat,isa,sig,slope};
}
function perfSheetTO(rwy, elevFt){
  const qfu = qfuFromDesignator(rwy.designator);
  if(qfu==null) return null;
  const p = state.perf;
  const ac = AIRCRAFT_DB[state.aircraft];
  const eng114 = (ac.perf114Tails||[]).includes(state.regTail);
  const {pa,oat,isa,sig,slope} = perfSheetAtmoAt(elevFt);
  const ang=(p.wdir-qfu)*Math.PI/180;
  const head = p.wspd*Math.cos(ang), cross = Math.abs(p.wspd*Math.sin(ang));
  const I = {pa,oat,isa,sig,qfu,tora:null,lda:null,slope,surf:p.surf,state:p.pstate,head,cross};
  const r = PERF_DA40.computeTO(eng114?'114':'01', p.prop, p.massTO, I);
  // TOR+LR (Part-NCO, formulaire Cannes Aviation) : pas de table accélération-arrêt dédiée dans l'AFM
  // pour ce monomoteur — proxy = roulage décollage + roulage atterrissage (volets LDG) à la masse
  // au décollage, comme distance de freinage estimée en cas d'interruption.
  const lr = PERF_DA40.computeLDG('LDG', p.massTO, I);
  return { designator:rwy.designator, qfu, tora:rwy.tora, toda:rwy.toda, asda:rwy.asda,
    todGross:r.obst, torGross:r.roll, lrGross:lr.roll, head, cross };
}
function perfSheetLDG(rwy, elevFt){
  const qfu = qfuFromDesignator(rwy.designator);
  if(qfu==null) return null;
  const p = state.perf;
  const {pa,oat,isa,sig,slope} = perfSheetAtmoAt(elevFt);
  const ang=(p.wdir-qfu)*Math.PI/180;
  const head = p.wspd*Math.cos(ang), cross = Math.abs(p.wspd*Math.sin(ang));
  const I = {pa,oat,isa,sig,qfu,tora:null,lda:null,slope,surf:p.surf,state:p.pstate,head,cross};
  const rDry = PERF_DA40.computeLDG(p.flaps, p.massLDG, I);
  const rUp = PERF_DA40.computeLDG('UP', p.massLDG, I);
  return { designator:rwy.designator, qfu, lda:rwy.lda, ldGross:rDry.tot, ldWetGross:rDry.tot*1.25, ldFlaplessGross:rUp.tot, head, cross };
}
function perfSheetVerdict(avail, req){
  if(avail==null) return ['', '—'];
  return perfVerdict(avail, req);
}
function perfSheetWindTxt(head, cross){
  return (head>=0?'face '+head.toFixed(0):'arr. '+Math.abs(head).toFixed(0))+'/trav. '+cross.toFixed(0)+'kt';
}

function perfSheetLDGTable(items, mode){

          ${perfSheetSidRow('MVL (ft)','mvl')}
        </tbody>
      </table>` : '';

  return `
    <div class="card" style="margin-top:14px;border:1px solid var(--accent);">
      <div class="card-title">📋 Fiche Performances (${escapeHtml(ac.label)}, ${escapeHtml(state.regTail)})</div>
      <div class="perf-tabs" style="margin:8px 0 12px;">
        <button class="btn ${mode==='cat'?'btn-primary':''}" id="btn-sheetmode-cat" type="button">Part-CAT</button>
        <button class="btn ${mode==='nco'?'btn-primary':''}" id="btn-sheetmode-nco" type="button">Part-NCO</button>
      </div>
      <div class="status-line" style="margin-bottom:10px;">
        ${mode==='cat' ? catNote : ncoNote} Utilise l'altitude terrain de la base vérifiée par aérodrome
        (sinon le champ Altitude terrain ci-dessus), et le QNH/OAT/pente/surface/état/vent déjà saisis plus
        haut pour tous les terrains — ajuste toi-même si les conditions diffèrent vraiment entre eux.
      </div>
      ${mode==='cat' ? `<div class="field" style="max-width:200px;margin-bottom:12px;"><label>Degagt 2 (OACI)</label>
        <input id="perf-altn2" type="text" maxlength="4" placeholder="ex. LFMV" value="${escapeHtml(p.altn2Icao||'')}" style="text-transform:uppercase;"></div>` : ''}

      <div class="card-title" style="font-size:12px;">🛫 Performances Décollage — ${depIcao||'(renseigne le départ)'}</div>
      ${depIcao ? perfSheetTOTable(toItems, mode) : `<div class="status-line warn">Renseigne l'aérodrome de départ dans Flight Info.</div>`}
      <div class="status-line" style="margin-top:4px;">OPS 1.530 (herbe/pente/état) déjà appliqué dans le TOD ci-dessus, via les réglages Piste/Surface/État de l'onglet Décollage.</div>

      <div class="card-title" style="font-size:12px;margin-top:14px;">📈 Performances Montée</div>
      ${climbHtml}

      <div class="card-title" style="font-size:12px;margin-top:14px;">✈️ Performances Croisière</div>
      ${cruiseHtml}

      <div class="card-title" style="font-size:12px;margin-top:14px;">🛬 Performances Atterrissage — ${destIcao||'(renseigne la destination)'} (destination)</div>
      ${destIcao ? perfSheetLDGTable(destItems, mode) : `<div class="status-line warn">Renseigne l'aérodrome de destination dans Flight Info.</div>`}

      <div class="card-title" style="font-size:12px;margin-top:14px;">🛬 Performances Atterrissage — ${altn1Icao||`(${altnLabel} non renseigné)`} (${altnLabel})</div>
      ${altn1Icao ? perfSheetLDGTable(altn1Items, mode) : `<div class="status-line">Pas de dégagement renseigné (champ Dégagement dans Flight Info).</div>`}
      ${sidBlock}
    </div>`;
}

function renderPerfSection(){
  const ac = AIRCRAFT_DB[state.aircraft];
  if(state.aircraft!=='DA40'){
    return `<div class="empty-state">Performances décollage/atterrissage disponibles uniquement pour le DA40 pour l'instant.</div>`;
  }
  const p = state.perf;
  const eng114 = (ac.perf114Tails||[]).includes(state.regTail);
  if(p.tab==='climb' && !eng114) p.tab='to';
  const mnb = computeMnB();
  if(p.massTO==null) p.massTO = Math.round(mnb.toMass);
  if(p.massLDG==null) p.massLDG = Math.round(mnb.ldgMass);
  const I = perfReadInputs();

  const engBadge = eng114

    <div class="field-row" style="margin-top:12px;">

  const isaTxt=(I.isa>=0?'+':'')+I.isa.toFixed(0);

        <div class="perf-box accent"><div class="k">Distance / obstacle 15 m</div><div class="v">${perfFmt(r.obst)} m</div><div class="x">${r.est?'estimé (abaque) · facteur dimensionnant':'take-off distance · facteur dimensionnant'}</div></div>

        <div class="perf-rwyhead"><div class="t">Piste · QFU ${String(Math.round(p.qfu)).padStart(2,'0')}</div><div class="perf-verdict ${vc}">${vt} · ${marg>=0?'+':''}${perfFmt(marg)} m</div></div>
        ${perfRunwaySVG(r.avail, r.obst, r.roll, p.qfu)}
      </div>
      ${perfNotesHTML(r.notes)}
      <div class="perf-src">${eng114?'Source : table exacte du supplément AFM/POH (moteur -114).':'Source : abaque AFM de base — estimation calibrée sur 2 points de référence de l’abaque, voir méthode ci-dessous.'}</div>`;
  }else if(p.tab==='ldg'){
    const r = PERF_DA40.computeLDG(p.flaps, p.massLDG, I);
    const [vc,vt] = perfVerdict(r.avail, r.tot);
    const marg = r.avail - r.tot;
    body = `
      <div class="field-row" style="margin-bottom:12px;">
        <div class="field"><label>Masse à l'atterrissage (kg)</label><input id="perf-mass-ldg" type="number" step="5" value="${p.massLDG}"></div>
        <div class="field" style="justify-content:flex-end;"><label>&nbsp;</label><span class="status-line" style="margin:0;">pré-rempli depuis LDM estimée (M&amp;B) : ${Math.round(mnb.ldgMass)} kg</span></div>
      </div>
      <div class="perf-speeds">
        <div class="perf-spd"><div class="k">V approche</div><div class="v">${r.vapp} kt</div></div>
        <div class="perf-spd" style="flex:2;min-width:180px;"><div class="k">Configuration volets</div>
          <div class="perf-tabs" style="margin:4px 0 0;">
            <button class="btn ${p.flaps==='LDG'?'btn-primary':''}" id="perf-flaps-ldg" type="button">Volets LDG</button>
            <button class="btn ${p.flaps==='UP'?'btn-primary':''}" id="perf-flaps-up" type="button">Volets UP</button>
          </div></div>
      </div>
      <div class="perf-big">
        <div class="perf-box"><div class="k">Roulage atterrissage</div><div class="v">${perfFmt(r.roll)} m</div><div class="x">ground roll · estimé</div></div>
        <div class="perf-box accent"><div class="k">Distance / obstacle 15 m</div><div class="v">${perfFmt(r.tot)} m</div><div class="x">landing distance · estimé</div></div>
      </div>
      <div class="perf-rwybox">
        <div class="perf-rwyhead"><div class="t">Piste · QFU ${String(Math.round(p.qfu)).padStart(2,'0')}</div><div class="perf-verdict ${vc}">${vt} · ${marg>=0?'+':''}${perfFmt(marg)} m</div></div>
        ${perfRunwaySVG(r.avail, r.tot, r.roll, p.qfu)}
      </div>
      ${perfNotesHTML(r.notes)}
      <div class="perf-src">Source : valeurs ISA/MSL imprimées dans l'AFM de base (§${p.flaps==='LDG'?'5.3.11':'5.3.12'}), identiques pour toute la flotte, corrigées ensuite pour masse/densité/vent/piste.</div>`;
  }else{
    // ---- Montée & Croisière (F-HOVE / F-GZMP uniquement — données tabulées 114 HP) ----
    if(p.cruisePA==null){ p.cruisePA = Math.min(16000, Math.max(0, Math.round((state.cruiseAlt||3000)/2000)*2000)); }
    const c = PERF_DA40.computeClimb(p.prop, I, I.head);
    const cr = PERF_DA40.computeCruise(p.prop, p.loadPct, p.cruisePA);
    const loadOptions = [50,60,70,80,90,100].map(v=>`<option value="${v}" ${p.loadPct===v?'selected':''}>${v}%</option>`).join('');
    const paOptions = [0,2000,4000,6000,8000,10000,12000,14000,16000].map(v=>`<option value="${v}" ${p.cruisePA===v?'selected':''}>${v} ft</option>`).join('');
    body = `
      <div class="status-line" style="margin-bottom:10px;">Calculée à partir des tables 5(a)-7/5(b)-7 (montée initiale, flaps T/O, MAX, 1150 kg) et 5(a)-11/5(b)-11 (croisière, réservoirs standard) du supplément AFM/POH — hélice ${p.prop==='5b'?'MTV-6-A/190-69':'MTV-6-A/187-129'}.</div>
      <div class="card" style="margin-bottom:14px;">
        <div class="card-title">Climb Performances</div>

          <div class="perf-spd"><div class="k">TAS montée</div><div class="v">${c.tas.toFixed(0)} kt</div></div>
          <div class="perf-spd"><div class="k">GS montée</div><div class="v">${c.gsKt.toFixed(0)} kt</div></div>
        </div>
        <div class="status-line" style="margin-top:2px;">γ (%) = Vz / GS = ${Math.round(c.vz)} / ${(c.gsKt*101.269).toFixed(0)} = <b style="color:var(--text-0);">${c.gamma.toFixed(2)} %</b></div>
        <div class="status-line" style="margin-top:6px;">Vz tabulée uniquement à MTOW 1150 kg (l'AFM ne donne pas la montée initiale à masse réduite) — à masse inférieure, Vz réelle est meilleure que ce qui est affiché ici.</div>
      </div>
      <div class="card">

          <div class="field"><label>Altitude croisière</label><select id="perf-cruisepa">${paOptions}</select></div>
          <div class="field"><label>% Puissance</label><select id="perf-loadpct">${loadOptions}</select></div>
        </div>
        <div class="perf-speeds">
          <div class="perf-spd"><div class="k">TAS</div><div class="v">${cr?cr.ktas.toFixed(0):'—'} kt</div></div>
          <div class="perf-spd"><div class="k">Consommation</div><div class="v">${cr?cr.usgh.toFixed(1):'—'} USG/h</div></div>
          <div class="perf-spd"><div class="k">Consommation</div><div class="v">${cr?cr.lh.toFixed(1):'—'} l/h</div></div>
        </div>
        ${p.loadPct>75?`<div class="status-line" style="margin-top:6px;color:var(--warn);">AFM : puissance croisière &gt;75 % déconseillée. Pour une croisière économique, régler ≤70 %.</div>`:''}
        ${cr&&cr.outOfRange?`<div class="status-line" style="margin-top:6px;color:var(--warn);">Cette puissance n'est pas tabulée à cette altitude — valeur affichée plafonnée à ${cr.maxPA} ft (altitude max tabulée pour ${p.loadPct}%).</div>`:''}
      </div>
      <div class="perf-src">Source : tables exactes du supplément AFM/POH (moteur -114) — F-HOVE / F-GZMP uniquement.</div>`;
  }

  return `
    <div class="status-line" style="margin-bottom:10px;">${engBadge}</div>
    <div class="perf-tabs">
      <button class="btn ${p.tab==='to'?'btn-primary':''}" id="perf-tab-to" type="button">🛫 Décollage</button>
      <button class="btn ${p.tab==='ldg'?'btn-primary':''}" id="perf-tab-ldg" type="button">🛬 Atterrissage</button>
      ${eng114?`<button class="btn ${p.tab==='climb'?'btn-primary':''}" id="perf-tab-climb" type="button">📈 Montée &amp; Croisière</button>`:''}
      <button class="btn ${p.showSheet?'btn-primary':''}" id="perf-tab-sheet" type="button">📋 Fiche Part-CAT/NCO</button>
    </div>
    <div class="field-row">${propField}</div>
    ${p.tab!=='climb'?`<div class="status-line" style="margin-bottom:4px;">Récupérer piste (TORA/TODA/ASDA/LDA) — base vérifiée en priorité, puis eAIP officiel (SIA), repli OpenAIP si indisponible :</div>
    ${renderPerfOpenAip()}
    ${renderPerfRwyDBManager()}`:''}
    ${atmoFields}
    ${p.tab!=='climb'?runwayFields:''}
    ${p.tab!=='climb'?atmoLine:''}
    <div style="margin-top:14px;">${body}</div>
    <details class="perf-method">
      <summary>Méthode &amp; limites de calcul</summary>
      <div class="body">
        <b>F-HOVE / F-GZMP (155 HP)</b> : décollage, montée initiale et croisière lus directement dans les
        tables 5(a)/5(b) du supplément AFM/POH (interpolation masse/PA/écart ISA, ou PA/%puissance pour la
        croisière) — valeurs exactes, pas d'estimation.<br><br>
        <b>Reste de la flotte (135 HP)</b> : l'AFM de base ne donne le décollage que sous forme d'abaque
        (nomogramme), pas de table ; la montée/croisière ne sont pas disponibles pour ces avions dans l'outil.
        La forme de variation du décollage (masse/altitude/température) est reprise de la table -114 ci-dessus,
        mise à l'échelle par deux facteurs calibrés sur les exemples chiffrés imprimés dans l'abaque lui-même
        (K roulage = 1,109 ; K distance/obstacle = 1,250). C'est une estimation — recoupe avec l'abaque papier
        de l'AFM avant tout vol réel.<br><br>
        <b>Atterrissage</b> : base ISA/MSL imprimée en toutes lettres dans l'AFM (identique pour toute la
        flotte), corrigée pour masse (proportionnelle), densité (1/σ), vent (loi GS²) et piste (herbe par
        longueur, pente, état) selon les notes de l'AFM : herbe ≤5cm +5 % roulage ; 5–10cm +15 % ; &gt;10cm
        +25 % ; pente 2 % ≈ +10 % distance (descendante à l'atterrissage) ; piste mouillée : majoration
        prudentielle hors AFM (+15 % roulage).<br><br>
        <b>Décollage — majorations réglementaires (OPS 1.530)</b> : herbe sèche TOD ×1,2 ; herbe mouillée
        TOD ×1,3 ; piste dure (sèche ou mouillée) ×1,0 (pas de majoration réglementaire sur piste dure
        mouillée) ; piste ascendante : TOD +5 % par 1 % de pente. Ces facteurs remplacent, pour le décollage
        uniquement, les anciennes majorations empiriques par longueur d'herbe — l'atterrissage garde les
        siennes (AFM, ci-dessus). Vent : modèle linéaire (décollage) / GS² (atterrissage), calibré sur
        l'abaque, non issu d'une table AFM dédiée.<br><br>
        <b>Montée initiale</b> : Vz lue dans les tables 5(a)-7/5(b)-7 (flaps T/O, puissance MAX, 1150 kg
        uniquement — l'AFM ne tabule pas d'autre masse). TAS obtenue par conversion densité de l'IAS de
        montée (66 kt) ; GS = TAS − composante de vent debout dans l'axe QFU ; γ(%) = Vz / GS (converti en
        ft/mn).<br><br>
        <b>Croisière</b> : TAS et débit carburant lus dans les tables 5(a)-11/5(b)-11 (réservoirs standard),
        par palier d'altitude et de %puissance. Le débit carburant est indépendant de l'altitude dans ces
        tables (fonction du %puissance seul) ; l'AFM déconseille une puissance croisière &gt;75 %.
      </div>
    </details>
    ${p.showSheet ? renderPerfSheet() : ''}`;
}
function wirePerfInputs(){
  const bind = (id, cb) => { const el=document.getElementById(id); if(el) el.addEventListener('change', cb); };
  bind('perf-prop', e=>{ state.perf.prop=e.target.value; renderContent(); });
  bind('perf-elev', e=>{ state.perf.elev=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-qnh', e=>{ state.perf.qnh=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-qnhunit', e=>{
    const was=state.perf.qnhUnit, nu=e.target.value;
    if(was!=='inhg'&&nu==='inhg') state.perf.qnh = +(state.perf.qnh/33.8639).toFixed(2);
    if(was==='inhg'&&nu==='hpa') state.perf.qnh = Math.round(state.perf.qnh*33.8639);
    state.perf.qnhUnit=nu; renderContent();
  });
  bind('perf-oat', e=>{ state.perf.oat=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-qfu', e=>{ state.perf.qfu=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-tora', e=>{ state.perf.tora=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-lda', e=>{ state.perf.lda=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-slope', e=>{ state.perf.slope=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-slopedir', e=>{ state.perf.slopeDir=e.target.value; renderContent(); });
  bind('perf-surf', e=>{ state.perf.surf=e.target.value; renderContent(); });
  bind('perf-pstate', e=>{ state.perf.pstate=e.target.value; renderContent(); });
  bind('perf-wdir', e=>{ state.perf.wdir=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-wspd', e=>{ state.perf.wspd=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-mass-to', e=>{ state.perf.massTO=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-mass-ldg', e=>{ state.perf.massLDG=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-cruisepa', e=>{ state.perf.cruisePA=parseFloat(e.target.value)||0; renderContent(); });
  bind('perf-loadpct', e=>{ state.perf.loadPct=parseFloat(e.target.value)||70; renderContent(); });
  bind('perf-altn2', e=>{ state.perf.altn2Icao=e.target.value.toUpperCase().trim(); renderContent(); });
  bind('perf-manual-vz-to', e=>{ state.perf.manualVzTO = e.target.value===''?null:parseFloat(e.target.value); renderContent(); });
  bind('perf-manual-vz-cruise', e=>{ state.perf.manualVzCruise = e.target.value===''?null:parseFloat(e.target.value); renderContent(); });
  document.querySelectorAll('[data-sid-col]').forEach(inp=>{
    inp.addEventListener('change', e=>{
      const i = parseInt(e.target.dataset.sidCol,10), key = e.target.dataset.sidKey;
      if(!state.perf.sidCols) state.perf.sidCols = [{},{},{},{}];
      if(!state.perf.sidCols[i]) state.perf.sidCols[i] = {};
      state.perf.sidCols[i][key] = e.target.value;
    });
  });
  const btnTO = document.getElementById('perf-tab-to'); if(btnTO) btnTO.onclick=()=>{ state.perf.tab='to'; renderContent(); };
  const btnLDG = document.getElementById('perf-tab-ldg'); if(btnLDG) btnLDG.onclick=()=>{ state.perf.tab='ldg'; renderContent(); };
  const btnClimb = document.getElementById('perf-tab-climb'); if(btnClimb) btnClimb.onclick=()=>{ state.perf.tab='climb'; renderContent(); };
  const btnSheet = document.getElementById('perf-tab-sheet'); if(btnSheet) btnSheet.onclick=()=>{ state.perf.showSheet = !state.perf.showSheet; renderContent(); };
  const btnSheetCat = document.getElementById('btn-sheetmode-cat'); if(btnSheetCat) btnSheetCat.onclick=()=>{ state.perf.regMode='cat'; renderContent(); };
  const btnSheetNco = document.getElementById('btn-sheetmode-nco'); if(btnSheetNco) btnSheetNco.onclick=()=>{ state.perf.regMode='nco'; renderContent(); };
  const btnFL = document.getElementById('perf-flaps-ldg'); if(btnFL) btnFL.onclick=()=>{ state.perf.flaps='LDG'; renderContent(); };
  const btnFU = document.getElementById('perf-flaps-up'); if(btnFU) btnFU.onclick=()=>{ state.perf.flaps='UP'; renderContent(); };
  wirePerfOpenAip();
  wirePerfRwyDBManager();
}

/* ============================= MAP ============================= */
const OPENAIP_LAYER_DEFS = [
  { key:'openaip', label:'OpenAIP (espaces, terrains, points de report, aides à la nav)' },
];
function buildOpenAipLayer(key){
  return L.tileLayer(
    `https://{s}.api.tiles.openaip.net/api/data/${key}/{z}/{x}/{y}.png?apiKey=${encodeURIComponent(state.openaipApiKey)}`,
    { attribution:'&copy; <a href="https://www.openaip.net/">openAIP</a> data (CC-BY-NC 4.0)', subdomains:['a','b','c'],
      minZoom:4, minNativeZoom:7, maxNativeZoom:14, maxZoom:16, opacity:0.9 }
  );
}
function rebuildOpenAipLayers(){
  if(!map) return;
  OPENAIP_LAYER_DEFS.forEach(def=>{
    const wasOnMap = openaipLayers[def.key] && map.hasLayer(openaipLayers[def.key]);
    if(openaipLayers[def.key]){ layersControl.removeLayer(openaipLayers[def.key]); map.removeLayer(openaipLayers[def.key]); }
    if(!state.openaipApiKey) return;
    openaipLayers[def.key] = buildOpenAipLayer(def.key);
    layersControl.addOverlay(openaipLayers[def.key], def.label);
    if(wasOnMap) openaipLayers[def.key].addTo(map);
  });
}
function initMap(){
  const initCenter = state.mapView ? [state.mapView.lat, state.mapView.lng] : [43.5417,6.9531];
  const initZoom = state.mapView ? state.mapView.zoom : 10;
  map = L.map('map', {zoomControl:true}).setView(initCenter, initZoom);

  osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
  });
  satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: '&copy; Esri, Maxar, Earthstar Geographics', maxZoom: 19
  });

  (state.mapBase === 'satellite' ? satelliteLayer : osmLayer).addTo(map);
  layersControl = L.control.layers(
    { 'OpenStreetMap': osmLayer, 'Satellite (Esri)': satelliteLayer },
    {}, { position:'topright', collapsed:false }
  ).addTo(map);
  if(state.openaipApiKey) rebuildOpenAipLayers();
  if(state.mapOpenAipOn && openaipLayers.openaip) openaipLayers.openaip.addTo(map);

  map.on('baselayerchange', e=>{ state.mapBase = (e.name==='Satellite (Esri)') ? 'satellite' : 'osm'; });
  map.on('overlayadd', e=>{ if(e.layer===openaipLayers.openaip) state.mapOpenAipOn = true; });
  map.on('overlayremove', e=>{ if(e.layer===openaipLayers.openaip) state.mapOpenAipOn = false; });
  map.on('moveend', ()=>{ const c=map.getCenter(); state.mapView = {lat:c.lat, lng:c.lng, zoom:map.getZoom()}; });

  map.on('click', e=>{
    if(state.placingAlternate){
      state.alternatePoint = { lat: e.latlng.lat, lon: e.latlng.lng };
      state.placingAlternate = false;
      renderContent();
      showToast('Point de dégagement placé ✓');
      return;
    }
    const id = uid++;
    const name = 'WP' + (state.waypoints.length + 1);
    state.waypoints.push({ id, name, lat: e.latlng.lat, lon: e.latlng.lng, windDir:null, windSpeed:null, manual:false, alt: state.cruiseAlt });
    state.legs = [];
    renderContent();
  });
}
function refreshMap(){
  requestAnimationFrame(()=>{
    const container = document.getElementById('map');
    if(!container) return;
    if(map && map.getContainer() === container){
      map.invalidateSize();
      renderMapMarkers();
      return;
    }
    if(map){ map.remove(); map = null; }
    initMap();
    renderMapMarkers();
  });
}
function renderMapMarkers(){
  mapMarkers.forEach(m=>map.removeLayer(m)); mapMarkers=[];
  if(mapLine){ map.removeLayer(mapLine); mapLine=null; }
  const latlngs = [];
  state.waypoints.forEach((wp,i)=>{
    const isTOD = wp.name && wp.name.toUpperCase().startsWith('TOD');
    const bg = isTOD ? '#e0a856' : (i===0?'#4fd1a5':(i===state.waypoints.length-1?'#e0685f':'#5b8cff'));
    const shape = isTOD ? 'border-radius:6px;transform:rotate(45deg);' : 'border-radius:50%;';
    const inner = isTOD ? `<span style="transform:rotate(-45deg);">↓</span>` : `${i+1}`;
    const icon = L.divIcon({
      html: `<div style="background:${bg}; ${shape}
        color:#06231a;width:24px;height:24px;display:flex;align-items:center;justify-content:center;
        font-weight:700;font-size:11px;border:2px solid #0b0d12;box-shadow:0 2px 6px rgba(0,0,0,0.5);">${inner}</div>`,
      className:'', iconSize:[24,24], iconAnchor:[12,12]
    });
    const m = L.marker([wp.lat,wp.lon],{icon, draggable:true}).addTo(map)
      .bindTooltip(wp.name + (isTOD ? ` (Top of Descent, ${Math.round(wp.alt)} ft)` : ''), {permanent:false, direction:'top'});
    m.on('dragend', ()=>{ const ll = m.getLatLng(); wp.lat = ll.lat; wp.lon = ll.lng; state.legs=[]; renderContent(); });
    mapMarkers.push(m);
    latlngs.push([wp.lat,wp.lon]);
  });
  if(latlngs.length>1){ mapLine = L.polyline(latlngs, {color:'#4fd1a5', weight:2, dashArray:'5,5'}).addTo(map); }

  if(state.alternatePoint){
    const ap = state.alternatePoint;
    const icon = L.divIcon({
      html: `<div style="background:#b06be0;width:22px;height:22px;display:flex;align-items:center;justify-content:center;
        clip-path:polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
        color:#1a0b23;font-weight:700;font-size:11px;box-shadow:0 2px 6px rgba(0,0,0,0.5);">A</div>`,
      className:'', iconSize:[22,22], iconAnchor:[11,11]
    });
    const m = L.marker([ap.lat, ap.lon], {icon, draggable:true}).addTo(map)
      .bindTooltip('Dégagement' + (state.altnIcao?(' — '+state.altnIcao):''), {permanent:false, direction:'top'});
    m.on('dragend', ()=>{ const ll = m.getLatLng(); state.alternatePoint = {lat:ll.lat, lon:ll.lng}; renderContent(); });
    mapMarkers.push(m);
    if(state.waypoints.length>0){
      const dest = state.waypoints[state.waypoints.length-1];
      const altnLine = L.polyline([[dest.lat,dest.lon],[ap.lat,ap.lon]], {color:'#b06be0', weight:2, dashArray:'3,6'}).addTo(map);
      mapMarkers.push(altnLine);
    }
  }
}

/* ============================= BOOTSTRAP ============================= */
function renderAll(){
  renderTopbar();
  renderContent(); // renderContent() now also refreshes the map via refreshMap()
}
(async function boot(){
  renderShell();
  try{
    const res = await appStorage.get('app_settings');
    if(res && res.value){ const s = JSON.parse(res.value); if(s.openaipApiKey) state.openaipApiKey = s.openaipApiKey; }
  }catch(e){}
  try{
    const res = await appStorage.get('rwy_db');
    state.perf.rwyDB = (res && res.value) ? JSON.parse(res.value) : JSON.parse(JSON.stringify(VERIFIED_RWY_SEED));
  }catch(e){ state.perf.rwyDB = JSON.parse(JSON.stringify(VERIFIED_RWY_SEED)); }
  await loadSavedIndex();
  renderAll();
})();
</script>
